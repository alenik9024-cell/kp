<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Конструктор КП</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #070a10;
    }

    #kp-frame {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      display: block;
      border: 0;
    }
  </style>
</head>
<body>

<script src="https://cdn.saas-support.com/crm_assets/build/widget/js/envycrmwidget.min.js"></script>

<iframe
  id="kp-frame"
  src="https://alenik9024-cell.github.io/kp/kp.html?embed=1&full=1&v=19"
  title="Конструктор КП">
</iframe>

<script>
(function () {
  'use strict';

  var params = new URLSearchParams(
    window.location.search
  );

  var dealId =
    params.get('deal_id') ||
    params.get('dealID') ||
    '';

  var clientId =
    params.get('client_id') ||
    params.get('clientID') ||
    '';

  var frame = document.getElementById('kp-frame');

  var clientName = '';
  var clientPhone = '';

  var nameWasChanged = false;
  var phoneWasChanged = false;
  var numberWasChanged = false;

  var writing = false;

  function log(message, data) {
    console.log(
      '[KP AUTO v19] ' + message,
      data || ''
    );
  }

  function valueOf(data) {
    if (
      data === null ||
      data === undefined
    ) {
      return '';
    }

    if (
      typeof data === 'string' ||
      typeof data === 'number'
    ) {
      return String(data).trim();
    }

    if (Array.isArray(data)) {
      for (var i = 0; i < data.length; i++) {
        var arrayValue = valueOf(data[i]);

        if (arrayValue) {
          return arrayValue;
        }
      }

      return '';
    }

    if (typeof data === 'object') {
      if (
        data.value !== undefined &&
        data.value !== null
      ) {
        return valueOf(data.value);
      }

      if (
        data.phone !== undefined &&
        data.phone !== null
      ) {
        return valueOf(data.phone);
      }

      if (
        data.name !== undefined &&
        data.name !== null
      ) {
        return valueOf(data.name);
      }

      if (
        data.result !== undefined &&
        data.result !== null
      ) {
        return valueOf(data.result);
      }
    }

    return '';
  }

  function loadClientData() {
    var w = window.EnvyCrmWidget;

    if (!w) {
      log('EnvyCrmWidget не загрузилась');
      return Promise.reject(
        new Error('EnvyCrmWidget не загрузилась')
      );
    }

    /*
     * Это точно тот способ, который используется
     * в присланном примере расширения.
     */
    var namePromise = w.getClientValue({
      input_id: 1001,
      type: 'service'
    });

    var phonePromise = w.getClientValue({
      input_id: 1002,
      type: 'service'
    });

    return Promise.all([
      namePromise,
      phonePromise
    ]).then(function (values) {
      clientName = valueOf(values[0]);
      clientPhone = valueOf(values[1]);

      log('данные клиента получены', {
        dealID: dealId,
        clientID: clientId,
        clientName: clientName,
        clientPhone: clientPhone
      });
    });
  }

  function getInnerDocument() {
    try {
      return frame.contentDocument ||
        frame.contentWindow.document ||
        null;
    } catch (error) {
      return null;
    }
  }

  function allFields(doc) {
    return Array.prototype.slice.call(
      doc.querySelectorAll(
        'input, textarea, [contenteditable="true"]'
      )
    );
  }

  function fieldValue(element) {
    if (!element) {
      return '';
    }

    if (
      element.matches &&
      element.matches('[contenteditable="true"]')
    ) {
      return String(
        element.textContent || ''
      ).trim();
    }

    return String(element.value || '').trim();
  }

  function fieldDescription(element) {
    if (!element) {
      return '';
    }

    var text =
      String(element.id || '') + ' ' +
      String(element.name || '') + ' ' +
      String(element.placeholder || '') + ' ' +
      String(
        element.getAttribute('aria-label') || ''
      );

    if (element.labels) {
      for (var i = 0; i < element.labels.length; i++) {
        text += ' ' + String(
          element.labels[i].innerText || ''
        );
      }
    }

    var parent = element.parentElement;

    for (var j = 0; j < 5 && parent; j++) {
      text += ' ' + String(
        parent.innerText || ''
      );

      parent = parent.parentElement;
    }

    return text
      .replace(/\s+/g, ' ')
      .toLowerCase();
  }

  function findByText(doc, text) {
    var fields = allFields(doc);

    for (var i = 0; i < fields.length; i++) {
      if (
        fieldDescription(fields[i]).indexOf(text) !== -1
      ) {
        return fields[i];
      }
    }

    return null;
  }

  function findNameField(doc) {
    return findByText(
      doc,
      'кому (заказчик)'
    );
  }

  function findDocumentPhoneField(doc) {
    return findByText(
      doc,
      'контакт (телефон)'
    );
  }

  function findProposalNumberField(doc) {
    return findByText(
      doc,
      'номер кп'
    );
  }

  function findMainPhoneField(doc) {
    return doc.querySelector('#kpPhone');
  }

  function fire(element) {
    element.dispatchEvent(new Event('input', {
      bubbles: true
    }));

    element.dispatchEvent(new Event('change', {
      bubbles: true
    }));

    element.dispatchEvent(new Event('blur', {
      bubbles: true
    }));
  }

  function writeValue(element, value) {
    if (!element || !value) {
      return;
    }

    writing = true;

    try {
      if (
        element.matches &&
        element.matches('[contenteditable="true"]')
      ) {
        element.textContent = value;
      } else {
        var prototype = Object.getPrototypeOf(
          element
        );

        var descriptor = prototype &&
          Object.getOwnPropertyDescriptor(
            prototype,
            'value'
          );

        if (
          descriptor &&
          descriptor.set
        ) {
          descriptor.set.call(element, value);
        } else {
          element.value = value;
        }
      }

      fire(element);

    } finally {
      setTimeout(function () {
        writing = false;
      }, 0);
    }
  }

  function proposalNumber() {
    var date = new Date();

    var day = String(date.getDate())
      .padStart(2, '0');

    var month = String(date.getMonth() + 1)
      .padStart(2, '0');

    var year = date.getFullYear();

    return 'КП-' + dealId + '/' +
      day + '.' + month + '.' + year;
  }

  function watch(element, type) {
    if (!element || element.__kpWatch19) {
      return;
    }

    element.__kpWatch19 = type;

    element.addEventListener(
      'input',
      function () {
        if (writing) {
          return;
        }

        if (type === 'name') {
          nameWasChanged = true;
        }

        if (type === 'phone') {
          phoneWasChanged = true;
        }

        if (type === 'number') {
          numberWasChanged = true;
        }
      },
      false
    );
  }

  function hideManualButtons(doc) {
    var buttons = Array.prototype.slice.call(
      doc.querySelectorAll('button')
    );

    buttons.forEach(function (button) {
      var text = String(
        button.innerText || ''
      )
        .replace(/\s+/g, ' ')
        .trim()
        .toLowerCase();

      if (
        text.indexOf('найти поля') !== -1 ||
        text.indexOf('проверить api') !== -1 ||
        text.indexOf('сохранить настройки') !== -1
      ) {
        button.style.display = 'none';
      }
    });
  }

  function applyToConstructor() {
    var doc = getInnerDocument();

    if (!doc || !doc.body) {
      return;
    }

    var nameField = findNameField(doc);
    var documentPhoneField =
      findDocumentPhoneField(doc);
    var mainPhoneField =
      findMainPhoneField(doc);
    var numberField =
      findProposalNumberField(doc);

    watch(nameField, 'name');
    watch(documentPhoneField, 'phone');
    watch(mainPhoneField, 'phone');
    watch(numberField, 'number');

    /*
     * Заполняем имя клиента.
     * После ручного изменения не перезаписываем.
     */
    if (
      clientName &&
      nameField &&
      !nameWasChanged &&
      fieldValue(nameField) !== clientName
    ) {
      writeValue(nameField, clientName);
    }

    /*
     * Заполняем телефон в двух местах:
     * в поле поиска и в документе.
     */
    if (
      clientPhone &&
      !phoneWasChanged
    ) {
      if (
        mainPhoneField &&
        fieldValue(mainPhoneField) !== clientPhone
      ) {
        writeValue(mainPhoneField, clientPhone);
      }

      if (
        documentPhoneField &&
        fieldValue(documentPhoneField) !== clientPhone
      ) {
        writeValue(
          documentPhoneField,
          clientPhone
        );
      }
    }

    /*
     * Номер КП: КП-ID сделки/DD.MM.YYYY.
     */
    var number = proposalNumber();

    if (
      dealId &&
      numberField &&
      !numberWasChanged &&
      fieldValue(numberField) !== number
    ) {
      writeValue(numberField, number);
    }

    hideManualButtons(doc);
  }

  frame.addEventListener(
    'load',
    function () {
      applyToConstructor();
    },
    false
  );

  /*
   * Сначала получаем имя и телефон,
   * затем постоянно проверяем отрисовку полей.
   */
  loadClientData()
    .then(function () {
      applyToConstructor();
    })
    .catch(function (error) {
      log('ошибка получения данных клиента', error);
    });

  var attempts = 0;

  var timer = setInterval(
    function () {
      applyToConstructor();

      attempts++;

      if (attempts > 180) {
        clearInterval(timer);
      }
    },
    250
  );

  if (window.MutationObserver) {
    var observerTimer = setInterval(
      function () {
        var doc = getInnerDocument();

        if (
          !doc ||
          !doc.body ||
          doc.body.__kpObserver19
        ) {
          return;
        }

        doc.body.__kpObserver19 = true;

        var observer = new MutationObserver(
          function () {
            applyToConstructor();
          }
        );

        observer.observe(doc.body, {
          childList: true,
          subtree: true
        });
      },
      500
    );

    setTimeout(function () {
      clearInterval(observerTimer);
    }, 45000);
  }
})();
</script>

</body>
</html>
