<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Конструктор КП</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #070a10;
    }

    #kp-frame {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      border: 0;
    }
  </style>
</head>
<body>

<iframe
  id="kp-frame"
  src="https://alenik9024-cell.github.io/kp/kp.html?embed=1&full=1&v=20"
  title="Конструктор КП">
</iframe>

<script>
(function () {
  'use strict';

  var params = new URLSearchParams(
    window.location.search
  );

  var token = params.get('token') || '';
  var STORAGE_KEY = 'kp_context_v20';
  var frame = document.getElementById('kp-frame');

  var activeToken = '';
  var writing = false;

  var nameChanged = false;
  var phoneChanged = false;
  var numberChanged = false;

  function readContext() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);

      if (!raw) {
        return null;
      }

      var context = JSON.parse(raw);

      if (
        token &&
        context.token &&
        context.token !== token
      ) {
        return null;
      }

      return context;
    } catch (error) {
      return null;
    }
  }

  function getDocument() {
    try {
      return frame.contentDocument ||
        frame.contentWindow.document ||
        null;
    } catch (error) {
      return null;
    }
  }

  function normalize(value) {
    return String(value || '')
      .replace(/\s+/g, ' ')
      .replace(/ё/g, 'е')
      .trim()
      .toLowerCase();
  }

  function isWritable(element) {
    if (!element) {
      return false;
    }

    if (
      element.matches &&
      element.matches('[contenteditable="true"]')
    ) {
      return !element.hasAttribute('disabled');
    }

    if (
      element.tagName !== 'INPUT' &&
      element.tagName !== 'TEXTAREA'
    ) {
      return false;
    }

    var type = String(
      element.type || 'text'
    ).toLowerCase();

    /*
     * Эти типы нельзя изменять через value.
     */
    if (
      type === 'file' ||
      type === 'color' ||
      type === 'checkbox' ||
      type === 'radio' ||
      type === 'button' ||
      type === 'submit' ||
      type === 'reset' ||
      type === 'hidden'
    ) {
      return false;
    }

    return !element.disabled;
  }

  function candidates(scope) {
    if (!scope) {
      return [];
    }

    var list = Array.prototype.slice.call(
      scope.querySelectorAll(
        'input, textarea, [contenteditable="true"]'
      )
    );

    return list.filter(isWritable);
  }

  /*
   * Ищем поле только рядом с конкретным label.
   * Не просматриваем весь большой родительский блок,
   * поэтому файл/color больше не выбираются ошибочно.
   */
  function findByLabel(doc, words) {
    var labels = Array.prototype.slice.call(
      doc.querySelectorAll('label')
    );

    for (var i = 0; i < labels.length; i++) {
      var label = labels[i];
      var text = normalize(label.innerText);

      var matches = words.some(function (word) {
        return text === normalize(word) ||
          text.indexOf(normalize(word)) !== -1;
      });

      if (!matches) {
        continue;
      }

      if (label.htmlFor) {
        var linked = doc.getElementById(
          label.htmlFor
        );

        if (isWritable(linked)) {
          return linked;
        }
      }

      var parent = label.parentElement;
      var nearby = candidates(parent);

      if (nearby.length) {
        return nearby[0];
      }

      var next = label.nextElementSibling;
      nearby = candidates(next);

      if (nearby.length) {
        return nearby[0];
      }

      if (parent && parent.nextElementSibling) {
        nearby = candidates(
          parent.nextElementSibling
        );

        if (nearby.length) {
          return nearby[0];
        }
      }
    }

    return null;
  }

  function findPhoneField(doc) {
    /*
     * Это точный ID из диагностики.
     */
    return doc.querySelector('#kpPhone');
  }

  function findNameField(doc) {
    return findByLabel(doc, [
      'Кому (заказчик)'
    ]);
  }

  function findDocumentPhoneField(doc) {
    return findByLabel(doc, [
      'Контакт (телефон)'
    ]);
  }

  function findNumberField(doc) {
    return findByLabel(doc, [
      'Номер КП'
    ]);
  }

  function fieldValue(element) {
    if (!element) {
      return '';
    }

    if (
      element.matches &&
      element.matches('[contenteditable="true"]')
    ) {
      return String(
        element.textContent || ''
      ).trim();
    }

    return String(element.value || '').trim();
  }

  function fire(element) {
    var win = element.ownerDocument.defaultView;

    element.dispatchEvent(new win.Event('input', {
      bubbles: true
    }));

    element.dispatchEvent(new win.Event('change', {
      bubbles: true
    }));

    element.dispatchEvent(new win.Event('blur', {
      bubbles: true
    }));
  }

  function writeValue(element, value) {
    if (
      !isWritable(element) ||
      !value
    ) {
      return;
    }

    writing = true;

    try {
      if (
        element.matches &&
        element.matches('[contenteditable="true"]')
      ) {
        element.textContent = value;
      } else {
        var prototype = Object.getPrototypeOf(
          element
        );

        var descriptor = prototype &&
          Object.getOwnPropertyDescriptor(
            prototype,
            'value'
          );

        if (
          descriptor &&
          descriptor.set
        ) {
          descriptor.set.call(element, value);
        } else {
          element.value = value;
        }
      }

      fire(element);
    } finally {
      setTimeout(function () {
        writing = false;
      }, 0);
    }
  }

  function watch(element, type) {
    if (
      !element ||
      element.__kpWatch20
    ) {
      return;
    }

    element.__kpWatch20 = type;

    element.addEventListener(
      'input',
      function () {
        if (writing) {
          return;
        }

        if (type === 'name') {
          nameChanged = true;
        }

        if (type === 'phone') {
          phoneChanged = true;
        }

        if (type === 'number') {
          numberChanged = true;
        }
      },
      false
    );
  }

  function proposalNumber(dealId) {
    var date = new Date();

    var day = String(date.getDate())
      .padStart(2, '0');

    var month = String(date.getMonth() + 1)
      .padStart(2, '0');

    var year = date.getFullYear();

    return 'КП-' + dealId + '/' +
      day + '.' + month + '.' + year;
  }

  function hideManualButtons(doc) {
    var buttons = Array.prototype.slice.call(
      doc.querySelectorAll('button')
    );

    buttons.forEach(function (button) {
      var text = normalize(button.innerText);

      if (
        text.indexOf('найти поля') !== -1 ||
        text.indexOf('проверить api') !== -1 ||
        text.indexOf('сохранить настройки') !== -1
      ) {
        button.style.display = 'none';
      }
    });
  }

  function apply() {
    var doc = getDocument();

    if (!doc || !doc.body) {
      return;
    }

    var context = readContext();

    if (!context) {
      return;
    }

    if (activeToken !== context.token) {
      activeToken = context.token || String(Date.now());

      nameChanged = false;
      phoneChanged = false;
      numberChanged = false;
    }

    var phoneField = findPhoneField(doc);
    var nameField = findNameField(doc);
    var documentPhoneField =
      findDocumentPhoneField(doc);
    var numberField = findNumberField(doc);

    watch(phoneField, 'phone');
    watch(documentPhoneField, 'phone');
    watch(nameField, 'name');
    watch(numberField, 'number');

    /*
     * Телефон клиента — точное поле #kpPhone.
     */
    if (
      context.phone &&
      !phoneChanged &&
      phoneField &&
      fieldValue(phoneField) !== context.phone
    ) {
      writeValue(phoneField, context.phone);
    }

    /*
     * Телефон в самом документе.
     */
    if (
      context.phone &&
      !phoneChanged &&
      documentPhoneField &&
      fieldValue(documentPhoneField) !== context.phone
    ) {
      writeValue(
        documentPhoneField,
        context.phone
      );
    }

    /*
     * Поле «Кому (заказчик)».
     * Значение можно потом изменить вручную.
     */
    if (
      context.clientName &&
      !nameChanged &&
      nameField &&
      fieldValue(nameField) !== context.clientName
    ) {
      writeValue(
        nameField,
        context.clientName
      );
    }

    /*
     * Номер КП.
     */
    if (
      context.dealId &&
      !numberChanged &&
      numberField
    ) {
      var number = proposalNumber(
        context.dealId
      );

      if (fieldValue(numberField) !== number) {
        writeValue(numberField, number);
      }
    }

    hideManualButtons(doc);
  }

  frame.addEventListener(
    'load',
    function () {
      apply();
    },
    false
  );

  window.addEventListener(
    'storage',
    function (event) {
      if (event.key === STORAGE_KEY) {
        apply();
      }
    },
    false
  );

  /*
   * Поля kp.html появляются после его отрисовки.
   */
  var attempts = 0;

  var timer = setInterval(function () {
    apply();

    attempts++;

    if (attempts > 180) {
      clearInterval(timer);
    }
  }, 250);

  if (window.MutationObserver) {
    var observerTimer = setInterval(function () {
      var doc = getDocument();

      if (
        !doc ||
        !doc.body ||
        doc.body.__kpObserver20
      ) {
        return;
      }

      doc.body.__kpObserver20 = true;

      var observer = new MutationObserver(
        function () {
          apply();
        }
      );

      observer.observe(doc.body, {
        childList: true,
        subtree: true
      });
    }, 500);

    setTimeout(function () {
      clearInterval(observerTimer);
    }, 45000);
  }

  apply();
})();
</script>

</body>
</html>
