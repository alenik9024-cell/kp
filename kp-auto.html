<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Конструктор КП</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #070a10;
    }

    #kp-frame {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      display: block;
      border: 0;
    }
  </style>
</head>
<body>

<iframe
  id="kp-frame"
  src="https://alenik9024-cell.github.io/kp/kp.html?embed=1&full=1&v=20"
  title="Конструктор КП">
</iframe>

<script>
(function () {
  'use strict';

  var params = new URLSearchParams(
    window.location.search
  );

  var token = params.get('token') || '';
  var STORAGE_KEY = 'kp_context_v20';
  var frame = document.getElementById('kp-frame');

  var currentToken = '';
  var writing = false;

  var nameChanged = false;
  var phoneChanged = false;
  var numberChanged = false;

  function readContext() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);

      if (!raw) {
        return null;
      }

      var context = JSON.parse(raw);

      if (
        token &&
        context.token &&
        context.token !== token
      ) {
        return null;
      }

      return context;
    } catch (error) {
      return null;
    }
  }

  function getDocument() {
    try {
      return frame.contentDocument ||
        frame.contentWindow.document ||
        null;
    } catch (error) {
      return null;
    }
  }

  function allFields(doc) {
    return Array.prototype.slice.call(
      doc.querySelectorAll(
        'input, textarea, [contenteditable="true"]'
      )
    );
  }

  function fieldValue(element) {
    if (!element) {
      return '';
    }

    if (
      element.matches &&
      element.matches('[contenteditable="true"]')
    ) {
      return String(
        element.textContent || ''
      ).trim();
    }

    return String(element.value || '').trim();
  }

  function fieldDescription(element) {
    if (!element) {
      return '';
    }

    var text =
      String(element.id || '') + ' ' +
      String(element.name || '') + ' ' +
      String(element.placeholder || '') + ' ' +
      String(
        element.getAttribute('aria-label') || ''
      );

    if (element.labels) {
      for (var i = 0; i < element.labels.length; i++) {
        text += ' ' + String(
          element.labels[i].innerText || ''
        );
      }
    }

    var parent = element.parentElement;

    for (var j = 0; j < 5 && parent; j++) {
      text += ' ' + String(
        parent.innerText || ''
      );

      parent = parent.parentElement;
    }

    return text
      .replace(/\s+/g, ' ')
      .toLowerCase();
  }

  function findField(doc, caption) {
    var fields = allFields(doc);

    for (var i = 0; i < fields.length; i++) {
      if (
        fieldDescription(fields[i])
          .indexOf(caption) !== -1
      ) {
        return fields[i];
      }
    }

    return null;
  }

  function fire(element) {
    element.dispatchEvent(new Event('input', {
      bubbles: true
    }));

    element.dispatchEvent(new Event('change', {
      bubbles: true
    }));

    element.dispatchEvent(new Event('blur', {
      bubbles: true
    }));
  }

  function writeValue(element, value) {
    if (!element || !value) {
      return;
    }

    writing = true;

    try {
      if (
        element.matches &&
        element.matches('[contenteditable="true"]')
      ) {
        element.textContent = value;
      } else {
        var prototype = Object.getPrototypeOf(element);
        var descriptor = prototype &&
          Object.getOwnPropertyDescriptor(
            prototype,
            'value'
          );

        if (
          descriptor &&
          descriptor.set
        ) {
          descriptor.set.call(element, value);
        } else {
          element.value = value;
        }
      }

      fire(element);
    } finally {
      setTimeout(function () {
        writing = false;
      }, 0);
    }
  }

  function watch(element, type) {
    if (!element || element.__kpWatch20) {
      return;
    }

    element.__kpWatch20 = type;

    element.addEventListener(
      'input',
      function () {
        if (writing) {
          return;
        }

        if (type === 'name') {
          nameChanged = true;
        }

        if (type === 'phone') {
          phoneChanged = true;
        }

        if (type === 'number') {
          numberChanged = true;
        }
      },
      false
    );
  }

  function hideManualButtons(doc) {
    var buttons = Array.prototype.slice.call(
      doc.querySelectorAll('button')
    );

    buttons.forEach(function (button) {
      var text = String(
        button.innerText || ''
      )
        .replace(/\s+/g, ' ')
        .trim()
        .toLowerCase();

      if (
        text.indexOf('найти поля') !== -1 ||
        text.indexOf('проверить api') !== -1 ||
        text.indexOf('сохранить настройки') !== -1
      ) {
        button.style.display = 'none';
      }
    });
  }

  function proposalNumber(dealId) {
    var date = new Date();

    var day = String(date.getDate())
      .padStart(2, '0');

    var month = String(date.getMonth() + 1)
      .padStart(2, '0');

    var year = date.getFullYear();

    return 'КП-' + dealId + '/' +
      day + '.' + month + '.' + year;
  }

  function apply() {
    var doc = getDocument();

    if (!doc || !doc.body) {
      return;
    }

    var context = readContext();

    if (!context) {
      return;
    }

    if (currentToken !== context.token) {
      currentToken = context.token || String(Date.now());

      nameChanged = false;
      phoneChanged = false;
      numberChanged = false;
    }

    var mainPhone = doc.querySelector('#kpPhone');
    var clientName = findField(
      doc,
      'кому (заказчик)'
    );
    var documentPhone = findField(
      doc,
      'контакт (телефон)'
    );
    var kpNumber = findField(
      doc,
      'номер кп'
    );

    watch(mainPhone, 'phone');
    watch(documentPhone, 'phone');
    watch(clientName, 'name');
    watch(kpNumber, 'number');

    if (
      context.phone &&
      !phoneChanged
    ) {
      if (
        mainPhone &&
        fieldValue(mainPhone) !== context.phone
      ) {
        writeValue(mainPhone, context.phone);
      }

      if (
        documentPhone &&
        fieldValue(documentPhone) !== context.phone
      ) {
        writeValue(
          documentPhone,
          context.phone
        );
      }
    }

    if (
      context.clientName &&
      clientName &&
      !nameChanged &&
      fieldValue(clientName) !== context.clientName
    ) {
      writeValue(
        clientName,
        context.clientName
      );
    }

    if (
      context.dealId &&
      kpNumber &&
      !numberChanged
    ) {
      var number = proposalNumber(
        context.dealId
      );

      if (fieldValue(kpNumber) !== number) {
        writeValue(kpNumber, number);
      }
    }

    hideManualButtons(doc);
  }

  frame.addEventListener(
    'load',
    function () {
      apply();
    },
    false
  );

  window.addEventListener(
    'storage',
    function (event) {
      if (event.key === STORAGE_KEY) {
        apply();
      }
    },
    false
  );

  var attempts = 0;

  var timer = setInterval(
    function () {
      apply();

      attempts++;

      if (attempts > 180) {
        clearInterval(timer);
      }
    },
    250
  );

  if (window.MutationObserver) {
    var observerTimer = setInterval(
      function () {
        var doc = getDocument();

        if (
          !doc ||
          !doc.body ||
          doc.body.__kpObserver20
        ) {
          return;
        }

        doc.body.__kpObserver20 = true;

        var observer = new MutationObserver(
          function () {
            apply();
          }
        );

        observer.observe(doc.body, {
          childList: true,
          subtree: true
        });
      },
      500
    );

    setTimeout(function () {
      clearInterval(observerTimer);
    }, 45000);
  }

  apply();
})();
</script>

</body>
</html>
