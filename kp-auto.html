<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Коммерческое предложение</title>
<style>
  html,body{margin:0;height:100%;background:#fff;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  body{display:flex;flex-direction:column}

  /* панель в потоке — конструктор начинается НИЖЕ неё, наложений нет */
  #kpBar{flex:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    padding:8px 12px;background:#101722;border-bottom:1px solid #26324a;color:#e8edf5}
  #kpBar button{padding:10px 14px;border-radius:10px;border:1px solid #33415c;
    background:#182233;color:#e8edf5;cursor:pointer;font:600 13px/1 inherit}
  #kpBar button:hover{background:#1f2b40}
  #kpBar button.primary{background:#2F6BFF;border-color:#2F6BFF;color:#fff}
  #kpBar button.primary:hover{background:#1f57e0}
  #kpBar .sp{flex:1}
  #kpNote{font:13px/1.35 inherit;color:#9fb0c8;max-width:46%}
  #kpNote.err{color:#ff8b8b} #kpNote.ok{color:#7ee0a0}
  #kp-frame{flex:1;width:100%;border:0;display:block}
</style>
</head>
<body>

<div id="kpBar">
  <button class="primary" data-act="chat">📩 В чат сделки</button>
  <button data-act="email">✉️ На e-mail</button>
  <button data-act="pdf">💾 Скачать КП</button>
  <button data-act="copy">📋 Текст</button>
  <span class="sp"></span>
  <span id="kpNote"></span>
</div>

<iframe id="kp-frame" src="kp.html?v=37"></iframe>

<script>
(function () {
  'use strict';

  var PROXY = 'https://script.google.com/macros/s/AKfycbwTIDBQvAu7q2WFEOr6F8AQ_gJdjnSxYAJrtrd04QODVyoVoR085ZdtsiwpXE7Z26AQ/exec';
  var CRM   = 'https://novikov.envycrm.com';

  /* путь карточки сделки — из вашего скриншота чата:
     https://novikov.envycrm.com/client/11130343/deal/115998923 */
  var URL_CARD  = CRM + '/client/{client}/deal/{id}';
  var URL_CHAT  = '';   /* впишите, если узнаете прямой адрес окна чата  */
  var URL_EMAIL = '';   /* впишите, если узнаете прямой адрес окна письма */

  var NUM_INPUT_ID = '';
  var ACT = { client:'client', attach:'attachFile', number:'updateDealValue' };

  var PAGE_W_MM = 210, PAGE_H_MM = 297, DOC_PX = 794;

  var params   = new URLSearchParams(location.search);
  var dealId   = params.get('deal_id')   || '';
  var clientId = params.get('client_id') || '';

  var frame = document.getElementById('kp-frame');
  var clientName = '', clientPhone = '', clientEmail = '';
  var dataReady = false, hooked = false, lastPdf = null, busy = false;

  function log(m, d) { try { console.log('[KP AUTO v37] ' + m, d || ''); } catch (e) {} }
  function doc() { try { return frame.contentDocument || frame.contentWindow.document || null; } catch (e) { return null; } }
  function win() { try { return frame.contentWindow; } catch (e) { return null; } }

  /* ---------- поля: только input, никогда textarea ---------- */
  function writable(el) {
    if (!el) return false;
    if (el.matches && el.matches('[contenteditable="true"]')) return true;
    if (el.tagName !== 'INPUT' && el.tagName !== 'TEXTAREA') return false;
    var t = String(el.type || 'text').toLowerCase();
    if (['file','color','checkbox','radio','hidden','button','submit','reset'].indexOf(t) !== -1) return false;
    return !el.disabled;
  }
  function getV(el) {
    if (!el) return '';
    if (el.matches && el.matches('[contenteditable="true"]')) return String(el.textContent || '').trim();
    return String(el.value || '').trim();
  }
  function setV(el, value) {
    if (!writable(el) || !value) return;
    var proto = Object.getPrototypeOf(el);
    var desc  = proto && Object.getOwnPropertyDescriptor(proto, 'value');
    if (el.matches && el.matches('[contenteditable="true"]')) el.textContent = value;
    else if (desc && desc.set) desc.set.call(el, value);
    else el.value = value;
    var w = el.ownerDocument.defaultView;
    ['input','change','blur'].forEach(function (t) { el.dispatchEvent(new w.Event(t, { bubbles: true })); });
  }
  function ownLabel(el) {
    if (!el) return '';
    if (el.labels && el.labels.length) {
      return String(el.labels[0].innerText || '').replace(/\s+/g, ' ').trim().toLowerCase();
    }
    if (el.closest) {
      var l = el.closest('label, .field, .form-group');
      if (l) { var t = String(l.innerText || '').replace(/\s+/g, ' ').trim().toLowerCase(); if (t.length < 80) return t; }
    }
    return '';
  }
  function shortControls(d) {
    return Array.prototype.slice.call(d.querySelectorAll('input, [contenteditable="true"]'))
      .filter(function (el) {
        if (!writable(el) || el.tagName === 'TEXTAREA') return false;
        if (el.matches && el.matches('[contenteditable="true"]')) return true;
        return ['text','tel','email','number','search','url',''].indexOf(String(el.type || 'text').toLowerCase()) !== -1;
      });
  }
  function isLongText(el) {
    var hay = (ownLabel(el) + ' ' + (el.id || '') + ' ' + (el.getAttribute('name') || '') + ' ' +
               (el.getAttribute('placeholder') || '')).toLowerCase();
    return /текст|описан|услуг|каталог|реквизит|примечан|коммент/.test(hay);
  }
  function findByWords(d, words, opts) {
    opts = opts || {};
    var list = shortControls(d), i, j, hay;
    for (i = 0; i < list.length; i++) {
      if (isLongText(list[i])) continue;
      hay = (ownLabel(list[i]) + ' ' + (list[i].id || '') + ' ' + (list[i].getAttribute('name') || '')).toLowerCase();
      for (j = 0; j < words.length; j++) if (hay.indexOf(words[j]) !== -1) return list[i];
    }
    for (i = 0; i < list.length; i++) {
      if (isLongText(list[i])) continue;
      hay = String(list[i].getAttribute('placeholder') || '').toLowerCase();
      for (j = 0; j < words.length; j++) if (hay.indexOf(words[j]) !== -1) return list[i];
    }
    if (opts.type) for (i = 0; i < list.length; i++)
      if (String(list[i].getAttribute('type') || '').toLowerCase() === opts.type) return list[i];
    return null;
  }
  function fillOnce(el, value) {
    if (!el || !value || el.__kpFilled) return;
    if (getV(el) === value) { el.__kpFilled = true; return; }
    setV(el, value); el.__kpFilled = true;
  }
  function proposalNumber() {
    if (!dealId) return 'КП';
    var d = new Date(), p = function (n) { return String(n).padStart(2, '0'); };
    return 'КП-' + dealId + '/' + p(d.getDate()) + '.' + p(d.getMonth() + 1) + '.' + d.getFullYear();
  }
  function normPhone(raw) {
    var d = String(raw || '').replace(/\D/g, '');
    if (d.length === 11 && d.charAt(0) === '8') d = '7' + d.slice(1);
    if (d.length === 10) d = '7' + d;
    return d;
  }

  function applyData() {
    var d = doc();
    if (!d || !d.body) return;

    var platform = findByWords(d, ['название платформ']);
    if (platform) platform.__kpFilled = true;              /* фирменное название не трогаем */

    fillOnce(findByWords(d, ['номер кп', 'номер предложения']), proposalNumber());
    if (!dataReady) return;

    if (clientName)  fillOnce(findByWords(d, ['кому (заказчик)', 'кому', 'заказчик']), clientName);
    if (clientPhone) {
      var tel = findByWords(d, ['контакт (телефон)', 'телефон', 'тел.'], { type: 'tel' });
      if (tel && !isLongText(tel)) fillOnce(tel, clientPhone);
    }
  }

  /* ---------- GAS ---------- */
  function gasGet(payload, timeoutMs) {
    return new Promise(function (resolve, reject) {
      var cb = 'kpj_' + Math.random().toString(36).slice(2);
      var q = Object.keys(payload).map(function (k) {
        return encodeURIComponent(k) + '=' + encodeURIComponent(payload[k] == null ? '' : payload[k]);
      }).join('&');
      var s = document.createElement('script'), done = false;
      var timer = setTimeout(function () { finish(new Error('timeout')); }, timeoutMs || 15000);
      function finish(err, data) {
        if (done) return; done = true; clearTimeout(timer);
        try { delete window[cb]; } catch (e) { window[cb] = undefined; }
        if (s.parentNode) s.parentNode.removeChild(s);
        err ? reject(err) : resolve(data);
      }
      window[cb] = function (data) { finish(null, data); };
      s.onerror = function () { finish(new Error('gas error')); };
      s.src = PROXY + '?' + q + '&callback=' + cb;
      document.head.appendChild(s);
    });
  }
  function gasPost(payload) {
    var target = 'kpPost_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    var ifr = document.createElement('iframe');
    ifr.name = target; ifr.style.cssText = 'display:none;width:0;height:0;border:0';
    document.body.appendChild(ifr);
    var f = document.createElement('form');
    f.method = 'POST'; f.action = PROXY; f.target = target; f.style.display = 'none';
    Object.keys(payload).forEach(function (k) {
      var i = document.createElement('input');
      i.type = 'hidden'; i.name = k; i.value = payload[k] == null ? '' : String(payload[k]);
      f.appendChild(i);
    });
    document.body.appendChild(f); f.submit();
    setTimeout(function () { try { f.remove(); } catch (e) {} try { ifr.remove(); } catch (e) {} }, 30000);
  }

  function loadClient() {
    if (!dealId && !clientId) { dataReady = true; applyData(); return; }
    gasGet({ action: ACT.client, deal_id: dealId, client_id: clientId }).then(function (res) {
      var c = (res && (res.client || res.data)) || res || {};
      clientName  = c.name  || c.fio || c.client_name || clientName;
      clientPhone = normPhone(c.phone || c.phone_main || clientPhone);
      clientEmail = c.email || c.email_main || clientEmail;
      if (res && res.deal_id)   dealId   = String(res.deal_id);
      if (res && res.client_id) clientId = String(res.client_id);
      dataReady = true; applyData();
      log('клиент загружен', { name: clientName, phone: clientPhone });
    }).catch(function (e) { log('клиент не загружен', e && e.message); dataReady = true; applyData(); });
  }

  /* ---------- PDF ---------- */
  function ensureLibs() {
    var w = win();
    if (!w) return Promise.reject(new Error('нет доступа к фрейму'));
    function inject(src) {
      return new Promise(function (resolve) {
        var s = w.document.createElement('script');
        s.src = src; s.onload = resolve; s.onerror = resolve;
        w.document.head.appendChild(s);
      });
    }
    var chain = Promise.resolve();
    if (!w.html2canvas) chain = chain.then(function () {
      return inject('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'); });
    if (!(w.jspdf && w.jspdf.jsPDF)) chain = chain.then(function () {
      return inject('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'); });
    return chain;
  }

  function findDocEl(d) {
    var cands = ['#kpDoc','#doc','#docPreview','#preview','#kpDocument','#kpDocPreview',
                 '.kp-doc','.doc-page','.doc-preview','.preview','.paper','.sheet','.a4','[data-doc]'];
    for (var i = 0; i < cands.length; i++) {
      var el = d.querySelector(cands[i]);
      if (el && el.offsetHeight > 300 && el.offsetWidth > 400) return { el: el, sel: cands[i] };
    }
    var vw = d.documentElement.clientWidth || 1200, best = null, area = 0;
    Array.prototype.forEach.call(d.body.querySelectorAll('div,section,article,main'), function (el) {
      var r = el.getBoundingClientRect();
      if (r.width < 500 || r.height < 500 || r.left < vw * 0.18) return;
      var a = r.width * r.height;
      if (a > area) { area = a; best = el; }
    });
    return best ? { el: best, sel: 'эвристика' } : { el: d.body, sel: 'body' };
  }

  function docText(d) {
    var t = String(d.body.innerText || d.body.textContent || '');
    return t.replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
  }

  function buildPdf() {
    var d = doc(), w = win();
    if (!d || !w) return Promise.reject(new Error('фрейм не готов'));
    var found = findDocEl(d);

    return ensureLibs().then(function () {
      var hc = w.html2canvas;
      var JsPDF = (w.jspdf && w.jspdf.jsPDF) || w.jsPDF;
      if (!hc || !JsPDF) throw new Error('html2canvas/jsPDF недоступны');

      var sandbox = d.createElement('div');
      sandbox.style.cssText = 'position:fixed;left:-10000px;top:0;width:' + DOC_PX +
        'px;background:#fff;padding:0;margin:0;box-sizing:border-box;z-index:-1';
      sandbox.appendChild(found.el.cloneNode(true));
      d.body.appendChild(sandbox);

      return hc(sandbox, { scale:2, backgroundColor:'#ffffff', useCORS:true,
                           logging:false, width:DOC_PX, windowWidth:DOC_PX })
        .then(function (canvas) {
          try { d.body.removeChild(sandbox); } catch (e) {}
          if (!canvas.width || !canvas.height) throw new Error('пустой canvas');

          var pdf  = new JsPDF('p', 'mm', 'a4');
          var img  = canvas.toDataURL('image/jpeg', 0.92);
          var imgH = canvas.height * PAGE_W_MM / canvas.width;
          var pages = Math.ceil(imgH / PAGE_H_MM);
          if (pages > 1 && (imgH - (pages - 1) * PAGE_H_MM) < 5) pages -= 1;

          for (var i = 0; i < pages; i++) {
            if (i) pdf.addPage();
            pdf.addImage(img, 'JPEG', 0, -i * PAGE_H_MM, PAGE_W_MM, imgH);
          }
          return { blob: pdf.output('blob'), text: docText(d), sel: found.sel };
        })
        .catch(function (e) { try { d.body.removeChild(sandbox); } catch (e2) {} throw e; });
    });
  }

  function fileName() { return proposalNumber().replace(/[\\/:*?"<>|]/g, '_') + '.pdf'; }
  function download(blob, name) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }
  function note(msg, cls) {
    var n = document.getElementById('kpNote');
    n.textContent = msg || ''; n.className = cls || '';
  }
  function blobToBase64(blob) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(String(r.result).split(',')[1]); };
      r.onerror = reject; r.readAsDataURL(blob);
    });
  }

  function openCrm(kind) {
    var tpl = (kind === 'email' ? URL_EMAIL : URL_CHAT) || URL_CARD;
    var url = tpl.replace(/\{client\}/g, encodeURIComponent(clientId || ''))
                 .replace(/\{id\}/g, encodeURIComponent(dealId || ''));
    log('открываю CRM: ' + url);
    var t = window.open(url, '_blank');
    if (!t) note('Разрешите всплывающие окна для этого сайта.', 'err');
  }

  function attachToDeal() {
    if (!dealId || !lastPdf) return;
    blobToBase64(lastPdf.blob).then(function (b64) {
      gasPost({ action: ACT.attach, deal_id: dealId, client_id: clientId,
                fileName: lastPdf.name, file: b64, pdf: b64 });
      if (NUM_INPUT_ID) gasPost({ action: ACT.number, deal_id: dealId,
                                  input_id: NUM_INPUT_ID, value: proposalNumber() });
      log('вложение отправлено');
    }).catch(function (e) { log('вложение не отправлено', e && e.message); });
  }

  function doAction(mode) {
    if (mode === 'copy') {
      if (!lastPdf) { note('Сначала нажмите «💾 Скачать КП».', 'err'); return; }
      navigator.clipboard.writeText(lastPdf.text).then(function () {
        note('Текст КП скопирован.', 'ok');
      }, function () { note('Браузер не дал доступ к буферу.', 'err'); });
      return;
    }
    if (busy) { note('Подождите, идёт сборка…'); return; }
    busy = true;
    note('Формирую PDF…');

    buildPdf().then(function (res) {
      lastPdf = { blob: res.blob, text: res.text, name: fileName() };
      download(lastPdf.blob, lastPdf.name);
      attachToDeal();

      return navigator.clipboard.writeText(lastPdf.text).catch(function () {}).then(function () {
        if (mode === 'chat') {
          openCrm('chat');
          note('PDF скачан и прикреплён к сделке. В карточке — пузырь чата, текст уже в буфере (Ctrl+V).', 'ok');
        } else if (mode === 'email') {
          openCrm('email');
          note('PDF скачан и прикреплён к сделке. В карточке — «Написать письмо», прикрепите файл.', 'ok');
        } else {
          note('PDF скачан (' + res.sel + ') и прикреплён к сделке.', 'ok');
        }
      });
    }).catch(function (e) {
      note('Ошибка PDF: ' + (e && e.message ? e.message : e), 'err');
    }).then(function () { busy = false; });
  }

  /* ---------- перехват родной кнопки печати внутри конструктора ---------- */
  function hookInner(d, w) {
    if (hooked) return;
    hooked = true;
    d.addEventListener('click', function (e) {
      var el = e.target;
      while (el && el !== d) {
        if (el.tagName === 'BUTTON') {
          var t = String(el.innerText || '').replace(/\s+/g, ' ').trim().toLowerCase();
          if (t.indexOf('найти поля') === -1 && t.indexOf('проверить api') === -1 &&
              t.indexOf('сохранить') === -1 &&
              (t.indexOf('печат') !== -1 || t.indexOf('распечат') !== -1)) {
            e.preventDefault(); e.stopImmediatePropagation(); doAction('pdf'); return;
          }
        }
        el = el.parentNode;
      }
    }, true);
  }

  /* ---------- старт ---------- */
  document.getElementById('kpBar').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button[data-act]') : null;
    if (!b) return;
    doAction(b.getAttribute('data-act'));
  });

  frame.addEventListener('load', function () {
    var d = doc(), w = win();
    if (!d || !w) { log('фрейм недоступен'); return; }
    hookInner(d, w);
    applyData();
    loadClient();

    var tries = 0;
    var iv = setInterval(function () {
      tries++; applyData();
      if (tries > 20) clearInterval(iv);
    }, 500);
  });

  log('v37 запущен', { deal_id: dealId, client_id: clientId });
})();
</script>
</body>
</html>
