<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Конструктор КП</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #070a10;
    }

    #kp-frame {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      border: 0;
    }
  </style>
</head>
<body>

<iframe
  id="kp-frame"
  src="https://alenik9024-cell.github.io/kp/kp.html?embed=1&full=1&v=18"
  title="Конструктор КП">
</iframe>

<script>
(function () {
  'use strict';

  var params = new URLSearchParams(
    window.location.search
  );

  var token = params.get('token') || '';
  var STORAGE_KEY = 'kp_current_deal_context_v18';
  var frame = document.getElementById('kp-frame');

  var activeToken = '';
  var writing = false;

  var nameUserChanged = false;
  var phoneUserChanged = false;
  var numberUserChanged = false;

  function readContext() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);

      if (!raw) {
        return null;
      }

      var context = JSON.parse(raw);

      if (
        token &&
        context.token &&
        context.token !== token
      ) {
        return null;
      }

      return context;
    } catch (error) {
      return null;
    }
  }

  function getFrameDocument() {
    try {
      return frame.contentDocument ||
        frame.contentWindow.document ||
        null;
    } catch (error) {
      return null;
    }
  }

  function allEditableFields(doc) {
    return Array.prototype.slice.call(
      doc.querySelectorAll(
        'input, textarea, [contenteditable="true"]'
      )
    );
  }

  function fieldValue(element) {
    if (!element) {
      return '';
    }

    if (
      element.matches &&
      element.matches('[contenteditable="true"]')
    ) {
      return String(
        element.textContent || ''
      ).trim();
    }

    return String(element.value || '').trim();
  }

  function fieldText(element) {
    if (!element) {
      return '';
    }

    var result =
      String(element.id || '') + ' ' +
      String(element.name || '') + ' ' +
      String(element.placeholder || '') + ' ' +
      String(
        element.getAttribute('aria-label') || ''
      );

    if (element.labels) {
      for (var i = 0; i < element.labels.length; i++) {
        result += ' ' + String(
          element.labels[i].innerText || ''
        );
      }
    }

    var parent = element.parentElement;

    for (var j = 0; j < 5 && parent; j++) {
      result += ' ' + String(
        parent.innerText || ''
      );

      parent = parent.parentElement;
    }

    return result
      .replace(/\s+/g, ' ')
      .toLowerCase();
  }

  function findByCaption(doc, caption) {
    var fields = allEditableFields(doc);

    for (var i = 0; i < fields.length; i++) {
      var text = fieldText(fields[i]);

      if (text.indexOf(caption) !== -1) {
        return fields[i];
      }
    }

    return null;
  }

  function findConfigPhone(doc) {
    return doc.querySelector('#kpPhone');
  }

  function findDocumentPhone(doc) {
    return findByCaption(
      doc,
      'контакт (телефон)'
    );
  }

  function findClientName(doc) {
    return findByCaption(
      doc,
      'кому (заказчик)'
    );
  }

  function findProposalNumber(doc) {
    return findByCaption(
      doc,
      'номер кп'
    );
  }

  function fire(element) {
    element.dispatchEvent(new Event('input', {
      bubbles: true
    }));

    element.dispatchEvent(new Event('change', {
      bubbles: true
    }));

    element.dispatchEvent(new Event('blur', {
      bubbles: true
    }));
  }

  function write(element, value) {
    if (!element || !value) {
      return;
    }

    writing = true;

    try {
      if (
        element.matches &&
        element.matches('[contenteditable="true"]')
      ) {
        element.textContent = value;
      } else {
        var prototype = Object.getPrototypeOf(
          element
        );

        var descriptor = prototype &&
          Object.getOwnPropertyDescriptor(
            prototype,
            'value'
          );

        if (
          descriptor &&
          descriptor.set
        ) {
          descriptor.set.call(element, value);
        } else {
          element.value = value;
        }
      }

      fire(element);
    } finally {
      setTimeout(function () {
        writing = false;
      }, 0);
    }
  }

  function watch(element, type) {
    if (!element || element.__kpWatch18) {
      return;
    }

    element.__kpWatch18 = type;

    element.addEventListener(
      'input',
      function () {
        if (writing) {
          return;
        }

        if (type === 'name') {
          nameUserChanged = true;
        }

        if (type === 'phone') {
          phoneUserChanged = true;
        }

        if (type === 'number') {
          numberUserChanged = true;
        }
      },
      false
    );
  }

  function hideManualButtons(doc) {
    var buttons = Array.prototype.slice.call(
      doc.querySelectorAll('button')
    );

    buttons.forEach(function (button) {
      var text = String(
        button.innerText || ''
      )
        .replace(/\s+/g, ' ')
        .trim()
        .toLowerCase();

      if (
        text.indexOf('найти поля') !== -1 ||
        text.indexOf('проверить api') !== -1 ||
        text.indexOf('сохранить настройки') !== -1
      ) {
        button.style.display = 'none';
      }
    });
  }

  function apply(context) {
    var doc = getFrameDocument();

    if (!doc || !doc.body) {
      return;
    }

    if (!context) {
      context = readContext();
    }

    if (!context) {
      return;
    }

    if (activeToken !== context.token) {
      activeToken =
        context.token || String(Date.now());

      nameUserChanged = false;
      phoneUserChanged = false;
      numberUserChanged = false;
    }

    /*
     * Поля, подтверждённые вашей диагностикой:
     * #kpPhone — телефон клиента в настройках;
     * «Кому (заказчик)» — имя;
     * «Контакт (телефон)» — телефон в документе;
     * «Номер КП» — номер документа.
     */
    var configPhone = findConfigPhone(doc);
    var documentPhone = findDocumentPhone(doc);
    var clientName = findClientName(doc);
    var proposalNumber = findProposalNumber(doc);

    watch(configPhone, 'phone');
    watch(documentPhone, 'phone');
    watch(clientName, 'name');
    watch(proposalNumber, 'number');

    /*
     * Заполняем телефон клиента в верхнее поле
     * и в поле документа.
     */
    if (
      context.phone &&
      !phoneUserChanged
    ) {
      if (
        configPhone &&
        fieldValue(configPhone) !== context.phone
      ) {
        write(configPhone, context.phone);
      }

      if (
        documentPhone &&
        fieldValue(documentPhone) !== context.phone
      ) {
        write(documentPhone, context.phone);
      }
    }

    /*
     * Заполняем «Кому (заказчик)».
     * После ручного изменения имя не перезаписывается.
     */
    if (
      context.clientName &&
      clientName &&
      !nameUserChanged &&
      fieldValue(clientName) !== context.clientName
    ) {
      write(clientName, context.clientName);
    }

    /*
     * Заполняем номер КП.
     */
    if (
      context.proposalNumber &&
      proposalNumber &&
      !numberUserChanged &&
      fieldValue(proposalNumber) !== context.proposalNumber
    ) {
      write(
        proposalNumber,
        context.proposalNumber
      );
    }

    hideManualButtons(doc);
  }

  frame.addEventListener(
    'load',
    function () {
      apply(readContext());
    },
    false
  );

  window.addEventListener(
    'storage',
    function (event) {
      if (event.key === STORAGE_KEY) {
        apply(readContext());
      }
    },
    false
  );

  /*
   * Повторная проверка нужна потому,
   * что kp.html дорисовывает поля после загрузки.
   */
  var attempts = 0;

  var timer = setInterval(function () {
    apply(readContext());

    attempts++;

    if (attempts > 180) {
      clearInterval(timer);
    }
  }, 250);

  if (
    window.MutationObserver
  ) {
    var observerTimer = setInterval(
      function () {
        var doc = getFrameDocument();

        if (
          !doc ||
          !doc.body ||
          doc.body.__kpObserver18
        ) {
          return;
        }

        doc.body.__kpObserver18 = true;

        var observer = new MutationObserver(
          function () {
            apply(readContext());
          }
        );

        observer.observe(doc.body, {
          childList: true,
          subtree: true
        });
      },
      500
    );

    setTimeout(function () {
      clearInterval(observerTimer);
    }, 45000);
  }

  apply(readContext());
})();
</script>

</body>
</html>
