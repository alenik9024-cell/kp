<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Конструктор КП</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #070a10;
    }

    #kp-frame {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      border: 0;
    }
  </style>
</head>
<body>

<iframe
  id="kp-frame"
  src="https://alenik9024-cell.github.io/kp/kp.html?embed=1&full=1&v=26"
  title="Конструктор КП">
</iframe>

<script>
(function () {
  'use strict';

  var params = new URLSearchParams(
    window.location.search
  );

  var dealId = params.get('deal_id') || '';
  var clientId = params.get('client_id') || '';

  var PROXY_URL =
    'https://script.google.com/macros/s/AKfycbxxi10GiEDFroquS0VwwUH4eJ3v0NuR5GlUiIdOvynZFukhRKkOhRkPVrCFgsBg-pV9/exec';

  var frame = document.getElementById('kp-frame');

  var clientName = '';
  var clientPhone = '';

  var nameChanged = false;
  var phoneChanged = false;
  var numberChanged = false;
  var writing = false;

  function log(message, data) {
    console.log(
      '[KP AUTO v26] ' + message,
      data || ''
    );
  }

  function getDocument() {
    try {
      return frame.contentDocument ||
        frame.contentWindow.document ||
        null;
    } catch (error) {
      return null;
    }
  }

  /*
   * Порядок подтверждён вашей диагностикой kp.html:
   *
   * 0  fileImport
   * 1  #kpPhone
   * 2  #kpHost
   * 3  #kpKey
   * 4  #kpFile
   * 5  #kpNumId
   * 6  #kpWriteNum
   * 7  цвет
   * 8  цвет
   * 9  цвет
   * 10 Название платформы — НЕ ТРОГАЕМ
   * 11 Подзаголовок
   * 12 Заголовок документа
   * 13 Номер КП
   * 14 Дата
   * 15 Срок
   * 16 Кому (заказчик)
   * 17 Контакт (телефон)
   */
  function controls(doc) {
    return Array.prototype.slice.call(
      doc.querySelectorAll(
        'input, textarea, select, [contenteditable="true"]'
      )
    );
  }

  function field(doc, index) {
    var list = controls(doc);
    return list[index] || null;
  }

  function writable(element) {
    if (!element) {
      return false;
    }

    if (
      element.matches &&
      element.matches('[contenteditable="true"]')
    ) {
      return !element.hasAttribute('disabled');
    }

    if (
      element.tagName !== 'INPUT' &&
      element.tagName !== 'TEXTAREA'
    ) {
      return false;
    }

    var type = String(
      element.type || 'text'
    ).toLowerCase();

    return (
      type !== 'file' &&
      type !== 'color' &&
      type !== 'checkbox' &&
      type !== 'radio' &&
      type !== 'hidden' &&
      type !== 'button' &&
      type !== 'submit' &&
      !element.disabled
    );
  }

  function value(element) {
    if (!element) {
      return '';
    }

    if (
      element.matches &&
      element.matches('[contenteditable="true"]')
    ) {
      return String(
        element.textContent || ''
      ).trim();
    }

    return String(element.value || '').trim();
  }

  function setValue(element, newValue) {
    if (
      !writable(element) ||
      !newValue
    ) {
      return;
    }

    writing = true;

    try {
      if (
        element.matches &&
        element.matches('[contenteditable="true"]')
      ) {
        element.textContent = newValue;
      } else {
        var prototype = Object.getPrototypeOf(
          element
        );

        var descriptor = prototype &&
          Object.getOwnPropertyDescriptor(
            prototype,
            'value'
          );

        if (
          descriptor &&
          descriptor.set
        ) {
          descriptor.set.call(element, newValue);
        } else {
          element.value = newValue;
        }
      }

      var win =
        element.ownerDocument.defaultView;

      element.dispatchEvent(new win.Event(
        'input',
        { bubbles: true }
      ));

      element.dispatchEvent(new win.Event(
        'change',
        { bubbles: true }
      ));

      element.dispatchEvent(new win.Event(
        'blur',
        { bubbles: true }
      ));

    } finally {
      setTimeout(function () {
        writing = false;
      }, 0);
    }
  }

  function watch(element, type) {
    if (
      !element ||
      element.__kpWatch26
    ) {
      return;
    }

    element.__kpWatch26 = type;

    element.addEventListener(
      'input',
      function () {
        if (writing) {
          return;
        }

        if (type === 'name') {
          nameChanged = true;
        }

        if (type === 'phone') {
          phoneChanged = true;
        }

        if (type === 'number') {
          numberChanged = true;
        }
      },
      false
    );
  }

  function proposalNumber() {
    var date = new Date();

    var day = String(date.getDate())
      .padStart(2, '0');

    var month = String(date.getMonth() + 1)
      .padStart(2, '0');

    var year = date.getFullYear();

    return 'КП-' + dealId + '/' +
      day + '.' + month + '.' + year;
  }

  function proxyData() {
    if (!dealId && !clientId) {
      return Promise.resolve();
    }

    return new Promise(function (resolve) {
      var callbackName =
        '__kp_data_' +
        Date.now() +
        '_' +
        Math.floor(Math.random() * 100000);

      var script = document.createElement(
        'script'
      );

      var timer = setTimeout(function () {
        cleanup();
        log('прокси не ответил за 15 секунд');
        resolve();
      }, 15000);

      function cleanup() {
        clearTimeout(timer);

        try {
          delete window[callbackName];
        } catch (error) {
          window[callbackName] = undefined;
        }

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }
      }

      window[callbackName] = function (data) {
        cleanup();

        if (!data || !data.ok) {
          log(
            'ошибка прокси',
            data && data.error
          );

          resolve();
          return;
        }

        clientName =
          String(data.clientName || '');

        clientPhone =
          String(data.phone || '');

        log('имя и телефон получены', {
          clientName: clientName,
          phone: clientPhone
        });

        resolve();
      };

      script.onerror = function () {
        cleanup();
        log('Google Apps Script недоступен');
        resolve();
      };

      script.src =
        PROXY_URL +
        '?deal_id=' +
        encodeURIComponent(dealId) +
        '&client_id=' +
        encodeURIComponent(clientId) +
        '&callback=' +
        encodeURIComponent(callbackName);

      document.head.appendChild(script);
    });
  }

  function hideManualButtons(doc) {
    var buttons = Array.prototype.slice.call(
      doc.querySelectorAll('button')
    );

    buttons.forEach(function (button) {
      var text = String(
        button.innerText || ''
      )
        .replace(/\s+/g, ' ')
        .trim()
        .toLowerCase();

      if (
        text.indexOf('найти поля') !== -1 ||
        text.indexOf('проверить api') !== -1 ||
        text.indexOf('сохранить настройки') !== -1
      ) {
        button.style.display = 'none';
      }
    });
  }

  function apply() {
    var doc = getDocument();

    if (!doc || !doc.body) {
      return;
    }

    /*
     * Точные поля из диагностики.
     * Поле 10 «Название платформы» здесь отсутствует
     * и никогда не изменяется.
     */
    var phoneSearchField =
      doc.querySelector('#kpPhone');

    var numberField = field(doc, 13);
    var nameField = field(doc, 16);
    var documentPhoneField = field(doc, 17);

    watch(phoneSearchField, 'phone');
    watch(documentPhoneField, 'phone');
    watch(nameField, 'name');
    watch(numberField, 'number');

    if (
      clientPhone &&
      !phoneChanged
    ) {
      if (
        writable(phoneSearchField) &&
        value(phoneSearchField) !== clientPhone
      ) {
        setValue(
          phoneSearchField,
          clientPhone
        );
      }

      if (
        writable(documentPhoneField) &&
        value(documentPhoneField) !== clientPhone
      ) {
        setValue(
          documentPhoneField,
          clientPhone
        );
      }
    }

    if (
      clientName &&
      !nameChanged &&
      writable(nameField) &&
      value(nameField) !== clientName
    ) {
      setValue(
        nameField,
        clientName
      );
    }

    if (
      dealId &&
      !numberChanged &&
      writable(numberField)
    ) {
      var number = proposalNumber();

      if (value(numberField) !== number) {
        setValue(numberField, number);
      }
    }

    hideManualButtons(doc);
  }

  frame.addEventListener(
    'load',
    function () {
      apply();
    },
    false
  );

  /*
   * Сначала получаем данные через прокси,
   * затем применяем к точным полям.
   */
  proxyData().then(function () {
    apply();
  });

  var attempts = 0;

  var timer = setInterval(function () {
    apply();

    attempts++;

    if (attempts > 180) {
      clearInterval(timer);
    }
  }, 250);

  if (window.MutationObserver) {
    var observerTimer = setInterval(
      function () {
        var doc = getDocument();

        if (
          !doc ||
          !doc.body ||
          doc.body.__kpObserver26
        ) {
          return;
        }

        doc.body.__kpObserver26 = true;

        var observer = new MutationObserver(
          function () {
            apply();
          }
        );

        observer.observe(doc.body, {
          childList: true,
          subtree: true
        });
      },
      500
    );

    setTimeout(function () {
      clearInterval(observerTimer);
    }, 45000);
  }

  apply();
})();
</script>

</body>
</html>
