<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Конструктор КП</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #070a10;
    }

    #kp-frame {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>

<iframe
  id="kp-frame"
  src="https://alenik9024-cell.github.io/kp/kp.html?embed=1&full=1"
  title="Конструктор КП">
</iframe>

<script>
(function () {
  'use strict';

  var params = new URLSearchParams(
    window.location.search
  );

  var token = params.get('token') || '';
  var STORAGE_KEY = 'kp_current_deal_context_v17';
  var frame = document.getElementById('kp-frame');

  var currentToken = '';
  var nameUserChanged = false;
  var phoneUserChanged = false;
  var numberUserChanged = false;
  var writing = false;

  var channel = null;

  if (window.BroadcastChannel && token) {
    try {
      channel = new BroadcastChannel(
        'kp_context_' + token
      );

      channel.onmessage = function (event) {
        if (event.data) {
          apply(event.data);
        }
      };
    } catch (e) {
      channel = null;
    }
  }

  function readContext() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);

      if (!raw) {
        return null;
      }

      var context = JSON.parse(raw);

      if (
        token &&
        context.token &&
        context.token !== token
      ) {
        return null;
      }

      return context;
    } catch (e) {
      return null;
    }
  }

  function doc() {
    try {
      return frame.contentDocument ||
        frame.contentWindow.document ||
        null;
    } catch (e) {
      return null;
    }
  }

  function allFields(documentObject) {
    return Array.prototype.slice.call(
      documentObject.querySelectorAll(
        'input, textarea, [contenteditable="true"]'
      )
    );
  }

  function fieldValue(element) {
    if (!element) {
      return '';
    }

    if (
      element.matches &&
      element.matches('[contenteditable="true"]')
    ) {
      return String(
        element.textContent || ''
      ).trim();
    }

    return String(element.value || '').trim();
  }

  function fieldDescription(element) {
    if (!element) {
      return '';
    }

    var text =
      String(element.id || '') + ' ' +
      String(element.name || '') + ' ' +
      String(element.placeholder || '') + ' ' +
      String(element.getAttribute('aria-label') || '');

    if (element.labels) {
      for (var i = 0; i < element.labels.length; i++) {
        text += ' ' + String(
          element.labels[i].innerText || ''
        );
      }
    }

    var parent = element.parentElement;

    for (var j = 0; j < 5 && parent; j++) {
      text += ' ' + String(parent.innerText || '');
      parent = parent.parentElement;
    }

    return text
      .replace(/\s+/g, ' ')
      .toLowerCase();
  }

  function fromLabel(documentObject, words, excluded) {
    var labels = Array.prototype.slice.call(
      documentObject.querySelectorAll('label')
    );

    for (var i = 0; i < labels.length; i++) {
      var label = labels[i];

      var text = String(label.innerText || '')
        .replace(/\s+/g, ' ')
        .trim()
        .toLowerCase();

      var matches = words.some(function (word) {
        return text.indexOf(word) !== -1;
      });

      if (!matches) {
        continue;
      }

      if (
        excluded &&
        excluded.some(function (word) {
          return text.indexOf(word) !== -1;
        })
      ) {
        continue;
      }

      if (label.htmlFor) {
        var linked = documentObject.getElementById(
          label.htmlFor
        );

        if (linked) {
          return linked;
        }
      }

      var parent = label.parentElement;

      if (parent) {
        var direct = parent.querySelector(
          'input, textarea, [contenteditable="true"]'
        );

        if (direct) {
          return direct;
        }

        var next = parent.nextElementSibling;

        if (next) {
          var nextField = next.querySelector(
            'input, textarea, [contenteditable="true"]'
          );

          if (nextField) {
            return nextField;
          }
        }
      }
    }

    return null;
  }

  function findPhone(documentObject) {
    return (
      documentObject.querySelector('#clientPhone') ||
      documentObject.querySelector('#phone') ||
      documentObject.querySelector('[name="client_phone"]') ||
      documentObject.querySelector('[name="phone"]') ||
      documentObject.querySelector('input[type="tel"]') ||
      fromLabel(
        documentObject,
        ['телефон клиента', 'телефон'],
        ['контакт']
      )
    );
  }

  function findName(documentObject) {
    var direct =
      documentObject.querySelector('#clientName') ||
      documentObject.querySelector('#customerName') ||
      documentObject.querySelector('[name="client_name"]') ||
      documentObject.querySelector('[name="customer_name"]') ||
      documentObject.querySelector('[name="customer"]');

    if (direct) {
      return direct;
    }

    var byLabel = fromLabel(
      documentObject,
      ['кому', 'заказчик'],
      ['телефон', 'контакт', 'исполнитель']
    );

    if (byLabel) {
      return byLabel;
    }

    var list = allFields(documentObject);

    for (var i = 0; i < list.length; i++) {
      var text = fieldDescription(list[i]);

      if (
        (
          text.indexOf('кому') !== -1 ||
          text.indexOf('заказчик') !== -1 ||
          text.indexOf('client_name') !== -1
        ) &&
        text.indexOf('телефон') === -1 &&
        text.indexOf('исполнитель') === -1
      ) {
        return list[i];
      }
    }

    return null;
  }

  function findNumber(documentObject) {
    var direct =
      documentObject.querySelector('#proposalNumber') ||
      documentObject.querySelector('#kpNumber') ||
      documentObject.querySelector('[name="proposal_number"]') ||
      documentObject.querySelector('[name="kp_number"]');

    if (direct) {
      return direct;
    }

    return fromLabel(
      documentObject,
      ['номер кп', '№ кп'],
      ['телефон']
    );
  }

  function fire(element) {
    element.dispatchEvent(new Event('input', {
      bubbles: true
    }));

    element.dispatchEvent(new Event('change', {
      bubbles: true
    }));

    element.dispatchEvent(new Event('blur', {
      bubbles: true
    }));
  }

  function write(element, value) {
    if (!element || !value) {
      return;
    }

    writing = true;

    try {
      if (
        element.matches &&
        element.matches('[contenteditable="true"]')
      ) {
        element.textContent = value;
      } else {
        var prototype = Object.getPrototypeOf(element);
        var descriptor = prototype &&
          Object.getOwnPropertyDescriptor(
            prototype,
            'value'
          );

        if (descriptor && descriptor.set) {
          descriptor.set.call(element, value);
        } else {
          element.value = value;
        }
      }

      fire(element);
    } finally {
      setTimeout(function () {
        writing = false;
      }, 0);
    }
  }

  function watch(element, type) {
    if (!element || element.__kpWatch) {
      return;
    }

    element.__kpWatch = type;

    element.addEventListener('input', function () {
      if (writing) {
        return;
      }

      if (type === 'name') {
        nameUserChanged = true;
      }

      if (type === 'phone') {
        phoneUserChanged = true;
      }

      if (type === 'number') {
        numberUserChanged = true;
      }
    }, false);
  }

  function hideExtraButtons(documentObject) {
    var buttons = Array.prototype.slice.call(
      documentObject.querySelectorAll('button')
    );

    buttons.forEach(function (button) {
      var text = String(button.innerText || '')
        .replace(/\s+/g, ' ')
        .trim()
        .toLowerCase();

      if (
        text.indexOf('найти поля') !== -1 ||
        text.indexOf('проверить api') !== -1 ||
        text.indexOf('сохранить настройки') !== -1
      ) {
        button.style.display = 'none';
      }
    });
  }

  function apply(context) {
    var documentObject = doc();

    if (!documentObject || !documentObject.body) {
      return;
    }

    if (!context) {
      context = readContext();
    }

    if (!context) {
      return;
    }

    if (currentToken !== context.token) {
      currentToken = context.token || String(Date.now());

      nameUserChanged = false;
      phoneUserChanged = false;
      numberUserChanged = false;
    }

    var nameField = findName(documentObject);
    var phoneField = findPhone(documentObject);
    var numberField = findNumber(documentObject);

    watch(nameField, 'name');
    watch(phoneField, 'phone');
    watch(numberField, 'number');

    if (
      nameField &&
      context.clientName &&
      !nameUserChanged &&
      fieldValue(nameField) !== context.clientName
    ) {
      write(nameField, context.clientName);
    }

    if (
      phoneField &&
      context.phone &&
      !phoneUserChanged &&
      fieldValue(phoneField) !== context.phone
    ) {
      write(phoneField, context.phone);
    }

    if (
      numberField &&
      context.proposalNumber &&
      !numberUserChanged &&
      fieldValue(numberField) !== context.proposalNumber
    ) {
      write(numberField, context.proposalNumber);
    }

    hideExtraButtons(documentObject);
  }

  frame.addEventListener('load', function () {
    apply(readContext());
  });

  window.addEventListener('storage', function (event) {
    if (event.key === STORAGE_KEY) {
      apply(readContext());
    }
  });

  var timer = setInterval(function () {
    apply(readContext());
  }, 300);

  setTimeout(function () {
    clearInterval(timer);
  }, 45000);

  var observerTimer = setInterval(function () {
    var documentObject = doc();

    if (
      documentObject &&
      documentObject.body &&
      window.MutationObserver &&
      !documentObject.body.__kpObserver
    ) {
      documentObject.body.__kpObserver = true;

      var observer = new MutationObserver(function () {
        apply(readContext());
      });

      observer.observe(documentObject.body, {
        childList: true,
        subtree: true
      });
    }
  }, 500);

  setTimeout(function () {
    clearInterval(observerTimer);
  }, 30000);

  apply(readContext());
})();
</script>

</body>
</html>
