<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Конструктор КП</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #070a10;
    }

    #kp-frame {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      border: 0;
    }
  </style>
</head>
<body>

<iframe
  id="kp-frame"
  src="https://alenik9024-cell.github.io/kp/kp.html?embed=1&full=1"
  title="Конструктор КП">
</iframe>

<script>
(function () {
  'use strict';

  var params = new URLSearchParams(
    window.location.search
  );

  var tokenFromUrl = params.get('token') || '';
  var STORAGE_KEY = 'kp_current_deal_context';

  var frame = document.getElementById('kp-frame');

  var activeToken = '';
  var nameField = null;
  var phoneField = null;
  var numberField = null;

  var nameChangedByUser = false;
  var phoneChangedByUser = false;
  var numberChangedByUser = false;

  var writing = false;

  function readContext() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);

      if (!raw) {
        return null;
      }

      var context = JSON.parse(raw);

      if (
        tokenFromUrl &&
        context.token &&
        context.token !== tokenFromUrl
      ) {
        return null;
      }

      return context;
    } catch (error) {
      return null;
    }
  }

  function getDocument() {
    try {
      return frame.contentDocument ||
        frame.contentWindow.document ||
        null;
    } catch (error) {
      return null;
    }
  }

  function fields(doc) {
    return Array.prototype.slice.call(
      doc.querySelectorAll(
        'input, textarea, [contenteditable="true"]'
      )
    );
  }

  function valueOf(element) {
    if (!element) {
      return '';
    }

    if (
      element.matches &&
      element.matches('[contenteditable="true"]')
    ) {
      return String(
        element.textContent || ''
      ).trim();
    }

    return String(element.value || '').trim();
  }

  function description(element) {
    if (!element) {
      return '';
    }

    var result =
      String(element.id || '') + ' ' +
      String(element.name || '') + ' ' +
      String(element.placeholder || '') + ' ' +
      String(element.getAttribute('aria-label') || '');

    if (element.labels) {
      for (var i = 0; i < element.labels.length; i++) {
        result += ' ' + String(
          element.labels[i].innerText || ''
        );
      }
    }

    var parent = element.parentElement;

    for (var j = 0; j < 4 && parent; j++) {
      result += ' ' + String(parent.innerText || '');
      parent = parent.parentElement;
    }

    return result
      .replace(/\s+/g, ' ')
      .toLowerCase();
  }

  function fieldFromLabel(doc, words, excluded) {
    var labels = Array.prototype.slice.call(
      doc.querySelectorAll('label')
    );

    for (var i = 0; i < labels.length; i++) {
      var label = labels[i];

      var labelText = String(label.innerText || '')
        .replace(/\s+/g, ' ')
        .trim()
        .toLowerCase();

      var found = words.some(function (word) {
        return labelText.indexOf(word) !== -1;
      });

      if (!found) {
        continue;
      }

      if (
        excluded &&
        excluded.some(function (word) {
          return labelText.indexOf(word) !== -1;
        })
      ) {
        continue;
      }

      if (label.htmlFor) {
        var linked = doc.getElementById(label.htmlFor);

        if (linked) {
          return linked;
        }
      }

      var parent = label.parentElement;

      if (parent) {
        var inside = parent.querySelector(
          'input, textarea, [contenteditable="true"]'
        );

        if (inside) {
          return inside;
        }

        var next = parent.nextElementSibling;

        if (next) {
          var nextField = next.querySelector(
            'input, textarea, [contenteditable="true"]'
          );

          if (nextField) {
            return nextField;
          }
        }
      }
    }

    return null;
  }

  function findPhoneField(doc) {
    var direct =
      doc.querySelector('#clientPhone') ||
      doc.querySelector('#phone') ||
      doc.querySelector('[name="client_phone"]') ||
      doc.querySelector('[name="phone"]') ||
      doc.querySelector('input[type="tel"]');

    if (direct) {
      return direct;
    }

    var labelled = fieldFromLabel(
      doc,
      ['телефон клиента'],
      ['контакт']
    );

    if (labelled) {
      return labelled;
    }

    var list = fields(doc);

    for (var i = 0; i < list.length; i++) {
      var text = description(list[i]);

      if (
        text.indexOf('телефон клиента') !== -1 ||
        text.indexOf('client_phone') !== -1
      ) {
        return list[i];
      }
    }

    return null;
  }

  function findNameField(doc) {
    var direct =
      doc.querySelector('#clientName') ||
      doc.querySelector('#customerName') ||
      doc.querySelector('[name="client_name"]') ||
      doc.querySelector('[name="customer_name"]') ||
      doc.querySelector('[name="customer"]');

    if (direct) {
      return direct;
    }

    var labelled = fieldFromLabel(
      doc,
      ['кому', 'заказчик'],
      ['телефон', 'контакт', 'исполнитель']
    );

    if (labelled) {
      return labelled;
    }

    var list = fields(doc);

    for (var i = 0; i < list.length; i++) {
      var text = description(list[i]);

      var isName =
        text.indexOf('кому') !== -1 ||
        text.indexOf('заказчик') !== -1 ||
        text.indexOf('client_name') !== -1 ||
        text.indexOf('customer_name') !== -1;

      var isOther =
        text.indexOf('телефон') !== -1 ||
        text.indexOf('контакт') !== -1 ||
        text.indexOf('исполнитель') !== -1 ||
        text.indexOf('от кого') !== -1;

      if (isName && !isOther) {
        return list[i];
      }
    }

    return null;
  }

  function findNumberField(doc) {
    var direct =
      doc.querySelector('#proposalNumber') ||
      doc.querySelector('#kpNumber') ||
      doc.querySelector('[name="proposal_number"]') ||
      doc.querySelector('[name="kp_number"]');

    if (direct) {
      return direct;
    }

    var labelled = fieldFromLabel(
      doc,
      ['номер кп', '№ кп'],
      ['телефон']
    );

    if (labelled) {
      return labelled;
    }

    var list = fields(doc);

    for (var i = 0; i < list.length; i++) {
      var text = description(list[i]);

      if (
        text.indexOf('номер кп') !== -1 ||
        text.indexOf('proposal_number') !== -1 ||
        text.indexOf('kp_number') !== -1
      ) {
        return list[i];
      }
    }

    return null;
  }

  function trigger(element) {
    element.dispatchEvent(new Event('input', {
      bubbles: true
    }));

    element.dispatchEvent(new Event('change', {
      bubbles: true
    }));

    element.dispatchEvent(new Event('blur', {
      bubbles: true
    }));
  }

  function setValue(element, value) {
    if (!element || !value) {
      return;
    }

    writing = true;

    try {
      if (
        element.matches &&
        element.matches('[contenteditable="true"]')
      ) {
        element.textContent = value;
      } else {
        var prototype = Object.getPrototypeOf(element);
        var descriptor = prototype &&
          Object.getOwnPropertyDescriptor(
            prototype,
            'value'
          );

        if (descriptor && descriptor.set) {
          descriptor.set.call(element, value);
        } else {
          element.value = value;
        }
      }

      trigger(element);
    } finally {
      setTimeout(function () {
        writing = false;
      }, 0);
    }
  }

  function watchField(element, type) {
    if (!element || element.__kpWatch === type) {
      return;
    }

    element.__kpWatch = type;

    element.addEventListener('input', function () {
      if (writing) {
        return;
      }

      if (type === 'name') {
        nameChangedByUser = true;
      }

      if (type === 'phone') {
        phoneChangedByUser = true;
      }

      if (type === 'number') {
        numberChangedByUser = true;
      }
    }, false);
  }

  function hideExtraButtons(doc) {
    var buttons = Array.prototype.slice.call(
      doc.querySelectorAll('button')
    );

    buttons.forEach(function (button) {
      var text = String(button.innerText || '')
        .replace(/\s+/g, ' ')
        .trim()
        .toLowerCase();

      if (
        text.indexOf('найти поля') !== -1 ||
        text.indexOf('проверить api') !== -1 ||
        text.indexOf('сохранить настройки') !== -1
      ) {
        button.style.display = 'none';
      }
    });
  }

  function apply() {
    var doc = getDocument();

    if (!doc || !doc.body) {
      return;
    }

    var context = readContext();

    if (!context) {
      return;
    }

    if (activeToken !== context.token) {
      activeToken = context.token || String(Date.now());

      nameChangedByUser = false;
      phoneChangedByUser = false;
      numberChangedByUser = false;
    }

    nameField = findNameField(doc);
    phoneField = findPhoneField(doc);
    numberField = findNumberField(doc);

    watchField(nameField, 'name');
    watchField(phoneField, 'phone');
    watchField(numberField, 'number');

    /*
     * Подставляем имя, пока пользователь сам его не изменил.
     * Если CRM перерисовала поле и очистила его,
     * значение будет вставлено повторно.
     */
    if (
      nameField &&
      context.clientName &&
      !nameChangedByUser &&
      valueOf(nameField) !== context.clientName
    ) {
      setValue(nameField, context.clientName);
    }

    if (
      phoneField &&
      context.phone &&
      !phoneChangedByUser &&
      valueOf(phoneField) !== context.phone
    ) {
      setValue(phoneField, context.phone);
    }

    if (
      numberField &&
      context.proposalNumber &&
      !numberChangedByUser &&
      valueOf(numberField) !== context.proposalNumber
    ) {
      setValue(numberField, context.proposalNumber);
    }

    hideExtraButtons(doc);
  }

  frame.addEventListener('load', function () {
    apply();
  });

  /*
   * Повторяем заполнение 40 секунд:
   * этого достаточно для загрузки и перерисовки конструктора.
   */
  var attempts = 0;

  var timer = setInterval(function () {
    apply();

    attempts++;

    if (attempts > 160) {
      clearInterval(timer);
    }
  }, 250);

  if (window.MutationObserver) {
    var observerTimer = setInterval(function () {
      var doc = getDocument();

      if (!doc || !doc.body) {
        return;
      }

      if (doc.body.__kpObserverStarted) {
        return;
      }

      doc.body.__kpObserverStarted = true;

      var observer = new MutationObserver(function () {
        apply();
      });

      observer.observe(doc.body, {
        childList: true,
        subtree: true
      });
    }, 500);

    setTimeout(function () {
      clearInterval(observerTimer);
    }, 30000);
  }

  window.addEventListener('storage', function (event) {
    if (event.key === STORAGE_KEY) {
      apply();
    }
  });

  apply();
})();
</script>

</body>
</html>
