<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Коммерческое предложение</title>
<style>
  html,body{margin:0;height:100%;background:#fff;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  body{display:flex;flex-direction:column}
  #kpBar{flex:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;
    background:#101722;border-bottom:1px solid #26324a;color:#e8edf5}
  #kpBar button{padding:10px 14px;border-radius:10px;border:1px solid #33415c;background:#182233;
    color:#e8edf5;cursor:pointer;font:600 13px/1 inherit}
  #kpBar button:hover{background:#1f2b40}
  #kpBar button.primary{background:#2F6BFF;border-color:#2F6BFF;color:#fff}
  #kpBar button.primary:hover{background:#1f57e0}
  #kpBar .sp{flex:1}
  #kpNote{font:13px/1.35 inherit;color:#9fb0c8;max-width:46%}
  #kpNote.err{color:#ff8b8b} #kpNote.ok{color:#7ee0a0}
  #kp-frame{flex:1;width:100%;border:0;display:block}
  #kpToast{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:2147483000;
    background:#101722;color:#e8edf5;border:1px solid #26324a;border-radius:10px;padding:9px 14px;
    font:13px/1.4 inherit;display:none;max-width:80vw;text-align:center;pointer-events:none}
  #kpToast.err{color:#ff8b8b} #kpToast.ok{color:#7ee0a0}
</style>
</head>
<body>

<div id="kpBar">
  <button class="primary" data-act="chat">📩 В чат сделки</button>
  <button data-act="email">✉️ На e-mail</button>
  <button data-act="pdf">💾 Скачать КП</button>
  <button data-act="copy">📋 Текст</button>
  <span class="sp"></span>
  <span id="kpNote"></span>
</div>

<iframe id="kp-frame" src="kp.html"></iframe>
<div id="kpToast"></div>

<script>
(function () {
  'use strict';

  var PROXY = 'https://script.google.com/macros/s/AKfycbwTIDBQvAu7q2WFEOr6F8AQ_gJdjnSxYAJrtrd04QODVyoVoR085ZdtsiwpXE7Z26AQ/exec';
  var CRM   = 'https://novikov.envycrm.com';

  var params   = new URLSearchParams(location.search);
  var dealId   = params.get('deal_id')   || '';
  var clientId = params.get('client_id') || '';

  var frame = document.getElementById('kp-frame');
  var clientName = '', clientPhone = '';

  function log(m, d) { try { console.log('[KP CONST] ' + m, d || ''); } catch (e) {} }
  function doc() { try { return frame.contentDocument || frame.contentWindow.document || null; } catch (e) { return null; } }
  function win() { try { return frame.contentWindow; } catch (e) { return null; } }

  function note(msg, cls) {
    var n = document.getElementById('kpNote');
    if (n) { n.textContent = msg || ''; n.className = cls || ''; }
    var t = document.getElementById('kpToast');
    if (t) {
      t.textContent = msg || ''; t.className = cls || ''; t.style.display = msg ? 'block' : 'none';
      if (msg) setTimeout(function () { if (t.textContent === msg) t.style.display = 'none'; }, 8000);
    }
  }

  function proposalNumber() {
    if (!dealId) return '';
    var d = new Date();
    var p = function (n) { return String(n).padStart(2, '0'); };
    return dealId + '/' + p(d.getDate()) + '/' + p(d.getMonth() + 1);
  }

  function setFieldValue(el, val) {
    if (!el || !val) return;
    el.value = val;
    var w = el.ownerDocument ? el.ownerDocument.defaultView : window;
    ['input', 'change', 'blur'].forEach(function (evName) {
      el.dispatchEvent(new w.Event(evName, { bubbles: true }));
    });
  }

  /* Заполнение документа kp.html */
  function fillDoc() {
    var d = doc();
    if (!d) return;

    // 1. Поле заказчика
    var cInput = d.querySelector('[data-bind="client"]') || d.querySelector('input[placeholder*="ООО"]');
    if (cInput && clientName && cInput.value !== clientName) {
      setFieldValue(cInput, clientName);
      log('Записано имя клиента:', clientName);
    }

    // 2. Поле контакта / телефона
    var pInput = d.querySelector('[data-bind="clientContact"]');
    if (pInput && clientPhone) {
      setFieldValue(pInput, clientPhone);
      log('Записан телефон:', clientPhone);
    }

    // 3. Номер КП
    var nInput = d.querySelector('[data-bind="docNumber"]');
    var pNum = proposalNumber();
    if (nInput && pNum) {
      setFieldValue(nInput, pNum);
      log('Записан номер КП:', pNum);
    }

    // 4. Если внутри есть скрипт renderDoc — вызываем для мгновенного обновления предпросмотра
    var w = win();
    if (w && typeof w.renderDoc === 'function') {
      try { w.renderDoc(); } catch (e) {}
    }
  }

  /* Запрос данных клиента через JSONP Google Apps Script */
  function fetchClient() {
    if (!clientId) {
      note('Номер КП: ' + proposalNumber(), 'ok');
      return;
    }

    note('Загрузка данных клиента…', '');

    var cbName = 'jsonp_cb_' + Date.now();
    window[cbName] = function (res) {
      try {
        log('Ответ от CRM получен:', res);
        var r = (res && res.result) ? res.result : res;
        if (r) {
          clientName  = r.name || r.client_name || r.company || '';
          clientPhone = r.phone || r.client_phone || '';
          if (Array.isArray(r.phones) && r.phones[0]) {
            clientPhone = r.phones[0].phone || r.phones[0];
          }

          var label = (clientName ? clientName : '') + (clientPhone ? ' (' + clientPhone + ')' : '');
          note(label ? label : 'Данные загружены', 'ok');

          fillDoc();
        }
      } catch (err) {
        log('Ошибка обработки данных', err);
      } finally {
        delete window[cbName];
        var s = document.getElementById(cbName);
        if (s) s.remove();
      }
    };

    var sc = document.createElement('script');
    sc.id = cbName;
    sc.src = PROXY + '?action=client&client_id=' + encodeURIComponent(clientId) + '&callback=' + cbName;
    document.body.appendChild(sc);
  }

  frame.onload = function () {
    log('Фрейм загружен');
    fillDoc();
    fetchClient();
    // Повторяем заполнение через 300мс на случай медленной инициализации kp.html
    setTimeout(fillDoc, 300);
    setTimeout(fillDoc, 800);
  };

  /* Обработка верхней панели кнопок */
  document.getElementById('kpBar').addEventListener('click', function (e) {
    var act = e.target.getAttribute('data-act');
    if (!act) return;

    var w = win();

    if (act === 'pdf') {
      if (w) w.print();
    } else if (act === 'copy') {
      var d = doc();
      var txt = d ? (d.body.innerText || d.body.textContent) : '';
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(function () {
          note('Текст предложения скопирован в буфер', 'ok');
        });
      }
    } else if (act === 'chat') {
      note('Скачайте КП (PDF) и прикрепите в чат сделки EnvyCRM', 'ok');
    } else if (act === 'email') {
      note('Скачайте КП (PDF) и отправьте на e-mail клиента', 'ok');
    }
  });

})();
</script>

</body>
</html>
