<script>
/* ============================================================
   ЧАСТЬ 2. CRM: виджеты (кнопка в карточке сделки), КП, PDF в поле
   ============================================================ */
(function(){
'use strict';

var CK = 'kp_crm_v3';
var cfg = {
  host: 'https://novikov.envycrm.com',
  key:  '48a7f23ebf788af44686fe0fa4c9c955c4c34d7c',
  file_id: '', file_type: 'custom',
  num_id: '',  num_type: 'custom',
  fmt_tpl: '', fmt_key: ''
};
try { cfg = Object.assign(cfg, JSON.parse(localStorage.getItem(CK) || '{}')); } catch(e){}
var DEAL = null;

function W(){ return window.EnvyCrmWidget; }
function logEl(){ return document.getElementById('kpLog'); }
function lg(m, v, bad){
  var s = m + (v === undefined ? '' : ': ' + (typeof v === 'string' ? v : JSON.stringify(v)));
  s = String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  var el = logEl(); if (el){ el.innerHTML += (bad ? '<i>' : '<b>') + s + (bad ? '</i>' : '</b>') + '\n'; }
  console.log('[KP]', s);
}
function say(m){ try { toast(m); } catch(e){ console.log(m); } }
function cfgSave(){
  try { localStorage.setItem(CK, JSON.stringify(cfg)); } catch(e){}
  try { var w = W(); if (w && w.saveParams) w.saveParams([{ name:'kp_cfg', value: JSON.stringify(cfg), type:'user' }]); } catch(e){}
}

/* ---------------- API ---------------- */
function url(p){
  var b = String(cfg.host || '').replace(/\/+$/, '') + '/openapi/v1' + p;
  if (cfg.key) b += (b.indexOf('?') === -1 ? '?' : '&') + 'api_key=' + encodeURIComponent(cfg.key);
  return b;
}
function api(p, m, b, form){
  var o = { method: m || 'POST' };
  if (form) o.body = b;
  else { o.headers = { 'Content-Type':'application/json' }; o.body = JSON.stringify(b || {}); }
  return fetch(url(p), o).then(function(r){
    return r.text().then(function(t){
      var j = null; try { j = JSON.parse(t); } catch(e){}
      if (!r.ok) throw new Error('HTTP ' + r.status + ' · ' + String(t).slice(0,300));
      return j === null ? t : j;
    });
  });
}

/* ---------------- РЕГИСТРАЦИЯ ВИДЖЕТОВ ---------------- */
var WIDGETS = {
  'deal-btn': function(){
    return [
      { title:'Сформировать КП', icon:'md-content-paste',
        styles:{ 'color':'#ffffff', 'background-color':'#2F6BFF' },
        clickEventName:'kp:make', position:['first'], name:'kp-make' },
      { title:'Конструктор КП', icon:'md-list',
        styles:{ 'color':'#0B1428', 'background-color':'#7FD1FF' },
        clickEventName:'kp:open', position:['after-kp-make'], name:'kp-open' }
    ];
  },
  'sidebar-item': function(){
    return [ { title:'Конструктор КП', icon:'md-content-paste',
               clickEventName:'kp:open', position:['after-section-4'], name:'kp-side' } ];
  }
};
function registerWidgets(){
  var w = W();
  if (!w){ lg('EnvyCrmWidget не загрузился — виджеты не зарегистрировать', undefined, true); return false; }
  var names = ['init','initWidget','initWidgets','register','registerWidget','addWidgets'];
  for (var i = 0; i < names.length; i++){
    var n = names[i];
    if (typeof w[n] !== 'function') continue;
    try { w[n](WIDGETS); lg('ВИДЖЕТЫ ЗАРЕГИСТРИРОВАНЫ через EnvyCrmWidget.' + n + '()'); return true; }
    catch(e){ lg('EnvyCrmWidget.' + n + '() ошибка: ' + e.message, undefined, true); }
  }
  if (typeof window.init === 'function'){
    try { window.init(WIDGETS); lg('ВИДЖЕТЫ ЗАРЕГИСТРИРОВАНЫ через window.init()'); return true; } catch(e){}
  }
  lg('метод регистрации не найден — пришлите этот журнал', undefined, true);
  try { lg('методы EnvyCrmWidget: ' + Object.keys(w).join(', ')); } catch(e){}
  return false;
}

/* ---------------- сделка ---------------- */
function loadDeal(){
  if (DEAL && DEAL.id) return Promise.resolve(DEAL);
  var el = document.getElementById('kpDealId');
  var manual = el ? String(el.value || '').trim() : '';
  var fromWidget = null;
  var step;
  if (manual){ step = Promise.resolve(Number(manual)); }
  else {
    var w = W();
    step = (w && w.getDeal)
      ? w.getDeal().then(function(d){
          var id = d && (d.id || d.deal_id || (d.result && d.result.id));
          if (!id) throw new Error('getDeal не вернул id: ' + JSON.stringify(d).slice(0,150));
          fromWidget = d; return Number(id);
        })
      : Promise.reject(new Error('getDeal недоступен — впишите ID сделки в поле'));
  }
  return step.then(function(id){
    return api('/deal/get', 'POST', { deal_id:id }).then(function(r){
      DEAL = (r && r.result) ? r.result : r;
    }).catch(function(e){
      if (fromWidget){ DEAL = fromWidget; lg('API недоступен, беру данные виджета: ' + e.message, undefined, true); }
      else throw e;
    }).then(function(){
      lg('сделка: id=' + DEAL.id + ' client_id=' + DEAL.client_id + ' user_id=' + DEAL.user_id + ' employee_id=' + DEAL.employee_id + ' «' + (DEAL.client_name || '') + '»');
      if (!DEAL.id) throw new Error('не удалось получить сделку');
      return DEAL;
    });
  });
}
function flat(v){
  var out = [];
  if (!v) return out;
  ['service','custom'].forEach(function(g){
    var grp = v[g]; if (!grp) return;
    var arr = Array.isArray(grp) ? grp : Object.keys(grp).map(function(k){ return grp[k]; });
    arr.forEach(function(it){ if (it && typeof it === 'object') out.push(it); });
  });
  return out;
}
function valById(v, id){
  var f = flat(v).filter(function(x){ return Number(x.input_id) === Number(id); })[0];
  return f ? f.value : null;
}
function readValues(){
  var w = W();
  if (w && w.getDealValues){
    return Promise.resolve(w.getDealValues())
      .catch(function(){ return api('/deal/get','POST',{ deal_id:DEAL.id }).then(function(r){ DEAL = (r&&r.result)?r.result:r; return DEAL.values; }); });
  }
  return api('/deal/get','POST',{ deal_id:DEAL.id }).then(function(r){ DEAL = (r&&r.result)?r.result:r; return DEAL.values; });
}
function writeField(id, type, value){
  var w = W();
  if (type !== 'service' && w && w.changeDealValue){
    return Promise.resolve(w.changeDealValue({ input_id:Number(id), value:String(value) }));
  }
  return loadDeal().then(function(d){
    return api('/deal/updateDealValue','POST',{
      deal_id:Number(d.id), client_id:Number(d.client_id),
      user_id:Number(d.user_id), employee_id:Number(d.employee_id),
      fields:[{ input_id:Number(id), value:String(value), value_type_id:(type === 'service' ? 1 : 2) }]
    });
  });
}

/* ---------------- подстановка в КП ---------------- */
function fillFromDeal(d){
  var v = d.values || {}, s = v.service || {};
  function pick(){
    for (var i = 0; i < arguments.length; i++){
      var x = Array.isArray(s) ? null : s[arguments[i]];
      if (x && x.value) return String(x.value);
    }
    return '';
  }
  var name  = d.client_name || pick('client_name','name');
  var comp  = d.short_name  || pick('short_name');
  var phone = (d.contacts && d.contacts[0] && d.contacts[0].phone) ? String(d.contacts[0].phone) : pick('phone');
  if (comp || name) state.client = comp ? (comp + (name ? ' · ' + name : '')) : name;
  if (phone) state.clientContact = phone;
  var iso = new Date().toISOString().slice(0,10);
  state.docDate = iso;
  var an = document.getElementById('kpAutoNum');
  if (!an || an.checked) state.docNumber = 'КП-' + d.id + '/' + iso.slice(0,4);
  syncInputs(); renderDoc(); save();
  lg('в КП подставлено', { Кому: state.client, Контакт: state.clientContact, Номер: state.docNumber });
}

/* ---------------- поиск полей ---------------- */
function loadInputs(type){
  var all = [], off = 0;
  function step(){
    return api('/deal/getListInputs?type=' + type + '&limit=50&offset=' + off, 'GET').then(function(r){
      var list = (r && r.result) || [];
      all = all.concat(list);
      var next = r && r.offset;
      if (list.length && next !== -1 && next !== undefined && next !== null && all.length < 400){ off = next; return step(); }
      return all;
    });
  }
  return step();
}
function findKpFields(){
  logEl().innerHTML = '';
  lg('ищу поля «КП»…');
  return Promise.all([
    loadInputs('custom').catch(function(e){ lg('custom недоступен: ' + e.message, undefined, true); return []; }),
    loadInputs('service').catch(function(){ return []; })
  ]).then(function(res){
    var groups = [{ l:res[0], t:'custom' }, { l:res[1], t:'service' }];
    var file = null, num = null, found = 0;
    groups.forEach(function(g){
      g.l.forEach(function(f){
        var n = String(f.name || '').toLowerCase();
        if (!/кп|коммерч/.test(n)) return;
        found++;
        lg('  id=' + f.id + ' «' + f.name + '» type_id=' + f.type_id + ' (' + g.t + ')');
        if (!file && /файл|file|документ|pdf/.test(n)) file = { id:f.id, name:f.name, t:g.t };
        else if (!num) num = { id:f.id, name:f.name, t:g.t };
      });
    });
    if (file){ cfg.file_id = file.id; cfg.file_type = file.t; lg('ФАЙЛОВОЕ ПОЛЕ → ' + file.id + ' «' + file.name + '»'); }
    else lg('поле с «файл» в названии не найдено — впишите input_id вручную', undefined, true);
    if (num){ cfg.num_id = num.id; cfg.num_type = num.t; lg('текстовое поле → ' + num.id + ' «' + num.name + '»'); }
    if (!found) lg('полей со словом «КП» не найдено', undefined, true);
    cfgSave(); fillForm();
  });
}

/* ---------------- кандидаты значений из ответа ---------------- */
function refPairs(res){
  var pairs = [], seen = {};
  (function walk(o, path){
    if (o == null || typeof o !== 'object') return;
    Object.keys(o).forEach(function(k){
      var v = o[k], p = path ? path + '.' + k : k;
      if (v == null) return;
      if (typeof v === 'object'){ walk(v, p); return; }
      var sv = String(v), kl = k.toLowerCase();
      var isUrl = /url|link|href|path/.test(kl) && /^https?:/.test(sv);
      var isId  = /^(id|file_id|log_id|element_id)$/.test(kl) && /^\d{1,12}$/.test(sv);
      if (isUrl || isId){
        var key = isUrl ? 'url' : kl, sig = key + ':' + sv;
        if (!seen[sig]){ seen[sig] = 1; pairs.push({ key:key, val:sv, isUrl:isUrl, path:p }); }
      }
    });
  })(res, '');
  return pairs;
}
function formatsFrom(pairs){
  var out = [], seen = {};
  function add(n, tpl, key){ if (seen[n]) return; seen[n] = 1; out.push({ n:n, tpl:tpl, key:key }); }
  pairs.filter(function(p){ return p.isUrl; }).forEach(function(p){
    add('url_obj',  '[{"url":"{{v}}"}]', p.key);
    add('url_arr',  '["{{v}}"]',         p.key);
    add('url_bare', '{{v}}',             p.key);
  });
  pairs.filter(function(p){ return !p.isUrl; }).forEach(function(p){
    add(p.key + '_obj',     '[{"' + p.key + '":{{v}}}]',   p.key);
    add(p.key + '_obj_str', '[{"' + p.key + '":"{{v}}"}]', p.key);
    add(p.key + '_arr',     '["{{v}}"]',                   p.key);
    add(p.key + '_bare',    '{{v}}',                       p.key);
  });
  return out.slice(0, 16);
}

/* ---------------- PDF ---------------- */
function withDocVisible(fn){
  var pv = document.querySelector('.preview');
  var restore = function(){ if (pv){ pv.style.display = ''; pv.style.position = ''; pv.style.left = ''; pv.style.top = ''; } };
  if (pv){ pv.style.display = 'block'; pv.style.position = 'fixed'; pv.style.left = '-10000px'; pv.style.top = '0'; }
  return Promise.resolve().then(fn).then(function(r){ restore(); return r; }, function(e){ restore(); throw e; });
}
function makePdf(){
  if (typeof html2pdf === 'undefined') return Promise.reject(new Error('html2pdf не загрузился — нет интернета?'));
  var el = document.getElementById('doc');
  return withDocVisible(function(){
    return html2pdf().set({
      margin: 0,
      image: { type:'jpeg', quality: 0.95 },
      html2canvas: { scale: 2, useCORS: true, backgroundColor:'#ffffff', windowWidth:1400, windowHeight:2400 },
      jsPDF: { unit:'mm', format:'a4', orientation:'portrait' },
      pagebreak: { mode: ['css','legacy'] }
    }).from(el).toPdf().get('pdf').then(function(pdf){ return pdf.output('blob'); });
  });
}
function attachFile(dealIdV, blob, filename){
  var fd = new FormData();
  fd.append('deal_id', String(dealIdV));
  fd.append('comment', 'Коммерческое предложение ' + (state.docNumber || ''));
  fd.append('files[]', blob, filename);
  return api('/deal/log/attachFile', 'POST', fd, true);
}

/* ---------------- ГЛАВНОЕ: сформировать КП ---------------- */
function run(){
  logEl().innerHTML = '';
  lg('старт формирования КП');
  var resp = null;

  loadDeal().then(function(d){
    fillFromDeal(d);
    return makePdf();
  }).then(function(blob){
    lg('PDF собран: ' + Math.round(blob.size / 1024) + ' КБ');
    var fn = 'KP_' + DEAL.id + '_' + String(state.docNumber || '').replace(/[^\wа-яА-ЯёЁ-]+/g,'_') + '.pdf';
    return attachFile(DEAL.id, blob, fn);
  }).then(function(r){
    resp = r;
    lg('файл загружен в сделку: ' + JSON.stringify(r).slice(0,600));
    if (!cfg.file_id) throw new Error('не найден input_id поля «КП (файл)» — нажмите «Найти поля»');
    return readValues();
  }).then(function(vals){
    var now = valById(vals, cfg.file_id);
    lg('сейчас в поле «КП (файл)»: ' + (now === null || now === '' ? '(пусто)' : String(now).slice(0,200)));
    var pairs = refPairs(resp);
    if (!pairs.some(function(p){ return p.isUrl; })){
      lg('ссылки в ответе нет — смотрю логи сделки…');
      return api('/deal/log/list?deal_id=' + Number(DEAL.id) + '&limit=10','GET')
        .then(function(r){ return pairs.concat(refPairs(r)); })
        .catch(function(){ return pairs; });
    }
    return pairs;
  }).then(function(pairs){
    pairs = pairs || [];
    lg('кандидатов для записи в поле: ' + pairs.length);
    pairs.slice(0,8).forEach(function(p){ lg('  ' + p.path + ' = ' + String(p.val).slice(0,120)); });

    var list = [];
    if (cfg.fmt_tpl && cfg.fmt_key){
      var pr0 = pairs.filter(function(p){ return p.key === cfg.fmt_key; })[0];
      if (pr0) list.push({ n:'запомненный', tpl:cfg.fmt_tpl, key:cfg.fmt_key, val:pr0.val });
    }
    formatsFrom(pairs).forEach(function(f){
      var pr = pairs.filter(function(p){ return p.key === f.key; })[0];
      if (pr) list.push({ n:f.n, tpl:f.tpl, key:f.key, val:pr.val });
    });
    if (!list.length) throw new Error('в ответе нет ни ссылки, ни ID файла — пришлите журнал');

    function tryNext(i){
      if (i >= list.length) throw new Error('ни один формат не подошёл — пришлите журнал');
      var f = list[i];
      var val = String(f.tpl).replace('{{v}}', f.val);
      lg('пробую [' + f.n + '] ' + val.slice(0,160));
      return writeField(cfg.file_id, cfg.file_type, val)
        .then(function(){ return readValues(); })
        .then(function(vals){
          var got = valById(vals, cfg.file_id);
          lg('  прочитано обратно: ' + (got === null || got === '' ? '(пусто)' : String(got).slice(0,160)));
          if (got !== null && got !== '' && String(got) !== '[]' && String(got) !== 'null'){
            cfg.fmt_tpl = f.tpl; cfg.fmt_key = f.key; cfgSave();
            lg('ФОРМАТ ПОДОШЁЛ: ' + f.n + ' → ' + f.tpl);
            return true;
          }
          return tryNext(i + 1);
        })
        .catch(function(e){ lg('  отклонено: ' + e.message, undefined, true); return tryNext(i + 1); });
    }
    return tryNext(0);
  }).then(function(){
    var cb = document.getElementById('kpWriteNum');
    if (cfg.num_id && (!cb || cb.checked)){
      return writeField(cfg.num_id, cfg.num_type, state.docNumber)
        .then(function(){ lg('номер КП записан: ' + state.docNumber); })
        .catch(function(e){ lg('номер КП не записался: ' + e.message, undefined, true); });
    }
    lg('запись номера пропущена');
  }).then(function(){
    lg('ГОТОВО');
    say('КП сформировано и сохранено в сделке');
  }).catch(function(e){
    var m = String(e && e.message ? e.message : e);
    lg('ОШИБКА: ' + m, undefined, true);
    if (/Failed to fetch|NetworkError|load failed|CORS/i.test(m)){
      lg('проверьте адрес CRM, ключ API и блокировщик рекламы', undefined, true);
    }
    say('Ошибка — откройте журнал');
  });
}

/* ---------------- открыть конструктор ---------------- */
function openConstructor(){
  var u = location.origin + location.pathname + (DEAL && DEAL.id ? '?deal_id=' + DEAL.id : '');
  var w = W();
  if (w && w.openPage){
    try {
      w.openPage({ content: '<iframe src="' + u + '" style="width:100%;height:100%;border:0"></iframe>' });
      lg('конструктор открыт через openPage');
      return;
    } catch(e){ lg('openPage не сработал: ' + e.message, undefined, true); }
  }
  var win = window.open(u, '_blank');
  if (!win) lg('всплывающее окно заблокировано — откройте вручную: ' + u, undefined, true);
  else lg('конструктор открыт в новой вкладке');
}

/* ---------------- клики по кнопкам CRM ---------------- */
window.addEventListener('message', function(e){
  var d = e.data || {};
  var t = d.type;
  if (!t) return;
  console.log('[KP] CRM message:', d);
  if (t === 'kp:make') run();
  else if (t === 'kp:open' || t === 'sidebar-item:click') openConstructor();
}, false);

/* ---------------- предпросмотр и печать ---------------- */
function openDoc(doPrint){
  var css = '';
  Array.prototype.forEach.call(document.querySelectorAll('style'), function(s){ css += s.textContent; });
  var ds = document.getElementById('doc').getAttribute('style') || '';
  var html = '<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>'
    + (state.docTitle || 'КП') + (state.docNumber ? ' № ' + state.docNumber : '') + '</title><style>' + css
    + '\nhtml,body{height:auto;background:#fff}.app,.main{display:block;height:auto;overflow:visible}'
    + '.doc{width:210mm;min-height:297mm;margin:0 auto;border:0;border-radius:0;box-shadow:none}</style></head><body>'
    + '<div class="doc" id="doc" style="' + ds + '">' + document.getElementById('doc').innerHTML + '</div>'
    + (doPrint ? '<script>window.onload=function(){setTimeout(function(){window.print()},300)}<\/script>' : '')
    + '</body></html>';
  var win = window.open('', '_blank');
  if (!win){ try { window.print(); } catch(e){} say('Всплывающее окно заблокировано'); return; }
  win.document.open(); win.document.write(html); win.document.close();
}
document.getElementById('btnPrint').onclick = function(){ if (window.parent !== window) openDoc(true); else window.print(); };
document.getElementById('btnPreview').onclick = function(){ openDoc(false); };

/* ---------------- панель ---------------- */
function fillForm(){
  var set = function(id, v){ var el = document.getElementById(id); if (el) el.value = (v == null ? '' : v); };
  set('kpHost', cfg.host); set('kpKey', cfg.key);
  set('kpFile', cfg.file_id); set('kpNumId', cfg.num_id);
}
function bindPanel(){
  var q = function(id){ return document.getElementById(id); };
  if (!q('kpRun')) return;
  q('kpSaveCfg').onclick = function(){
    cfg.host = q('kpHost').value.trim();
    cfg.key  = q('kpKey').value.trim();
    cfg.file_id = q('kpFile').value.trim();
    cfg.num_id  = q('kpNumId').value.trim();
    cfgSave(); say('Настройки сохранены');
  };
  q('kpTest').onclick = function(){
    logEl().innerHTML = '';
    cfg.host = q('kpHost').value.trim();
    cfg.key  = q('kpKey').value.trim();
    lg('проверяю ' + cfg.host);
    api('/main/data','GET').then(function(r){
      var c = (r && r.crm) || (r && r.result && r.result.crm);
      lg(c ? ('API отвечает: crm_id=' + c.id + ' «' + c.name + '» домен ' + c.domain) : 'API отвечает');
      say('API отвечает');
    }).catch(function(e){
      lg('ошибка API: ' + e.message, undefined, true);
      lg('401 → ключ · Failed to fetch → CORS, блокировщик или адрес', undefined, true);
    });
  };
  q('kpFind').onclick = function(){ findKpFields().catch(function(e){ lg('ошибка поиска: ' + e.message, undefined, true); }); };
  q('kpRun').onclick = run;
  q('kpOpen').onclick = openConstructor;
  q('kpReg').onclick = function(){ registerWidgets(); };
  var m = /[?&]deal_id=(\d+)/.exec(location.search);
  if (m) q('kpDealId').value = m[1];
  fillForm();
}
function addButtons(){
  var box = document.querySelector('#kpRun');
  if (!box || document.getElementById('kpReg')) return;
  var wrap = document.createElement('button');
  wrap.className = 'btn'; wrap.id = 'kpReg'; wrap.textContent = 'Зарегистрировать виджеты';
  box.parentNode.insertBefore(wrap, box.nextSibling);
  var o = document.createElement('button');
  o.className = 'btn'; o.id = 'kpOpen'; o.textContent = 'Открыть конструктор';
  wrap.parentNode.insertBefore(o, wrap.nextSibling);
}
function inCrm(){
  if (window.parent === window) return;
  var st = document.createElement('style');
  st.textContent = 'body.crm-mode .main{grid-template-columns:1fr}body.crm-mode .preview{display:none}'
    + 'body.crm-mode .editor{height:100%;max-height:none;border-right:0}';
  document.head.appendChild(st);
  document.body.classList.add('crm-mode');
}

/* ---------------- старт ---------------- */
function boot(){
  inCrm();
  addButtons();
  bindPanel();
  lg('страница загружена. iframe: ' + (window.parent !== window ? 'да (внутри CRM)' : 'нет (обычная страница)'));
  registerWidgets();
  var w = W();
  if (w && w.getParams){
    try {
      w.getParams({ type:'user' }).then(function(p){
        var raw = null;
        if (Array.isArray(p)) p.forEach(function(x){ if (x && x.name === 'kp_cfg') raw = x.value; });
        else if (p && p.kp_cfg) raw = (p.kp_cfg.value !== undefined ? p.kp_cfg.value : p.kp_cfg);
        if (typeof raw === 'string'){ try { cfg = Object.assign(cfg, JSON.parse(raw)); fillForm(); } catch(e){} }
        lg('настройки из CRM прочитаны');
      }).catch(function(){});
    } catch(e){}
  }
}
if (document.readyState === 'complete' || document.readyState === 'interactive') setTimeout(boot, 600);
else window.addEventListener('DOMContentLoaded', function(){ setTimeout(boot, 600); });
})();
</script>
