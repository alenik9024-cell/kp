<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>КП — виджет</title>
<style>
  body{margin:0;padding:14px;box-sizing:border-box;background:#fff;color:#2b2b2b;
       font:13px/1.5 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
  #kpBtn{display:block;width:100%;padding:14px 16px;border:0;border-radius:10px;
         background:#2F6BFF;color:#fff;font:600 15px/1 inherit;cursor:pointer}
  #kpBtn:hover{background:#1f57e0}
  #st{margin-top:12px;font-size:12px;line-height:1.6;color:#666;word-break:break-all}
</style>
</head>
<body>

<button id="kpBtn" type="button">📄 Сформировать КП</button>
<div id="st">запуск…</div>

<script>
(function () {
  'use strict';

  var CONSTRUCTOR_URL = 'https://alenik9024-cell.github.io/kp/kp-constructor.html';
  var st = document.getElementById('st'), btn = document.getElementById('kpBtn');
  var dealId = '', clientId = '', src = '';

  function log(m, d) { try { console.log('[KP v47] ' + m, d || ''); } catch (e) {} }
  function W() { return window.EnvyCrmWidget; }

  /* 1) ID из параметров самого iframe */
  function idsFromQuery() {
    try {
      var p = new URLSearchParams(location.search);
      var d = p.get('deal_id') || p.get('dealId') || p.get('dealID');
      var c = p.get('client_id') || p.get('clientId') || p.get('clientID');
      if (d) { dealId = d; clientId = c || clientId; src = 'query'; return true; }
    } catch (e) {}
    return false;
  }

  /* 2) ID из API — если он когда-нибудь появится */
  function idsFromApi() {
    return new Promise(function (resolve) {
      var w = W();
      if (!w || typeof w.getDeal !== 'function') { resolve(false); return; }
      try {
        var r = w.getDeal();
        if (r && typeof r.then === 'function') {
          r.then(function (d) {
            d = d && d.result ? d.result : (d || {});
            if (d.id || d.deal_id) {
              dealId   = String(d.id || d.deal_id);
              clientId = String(d.client_id || d.clientId || clientId || '');
              src = 'api';
            }
            resolve(!!dealId);
          }).catch(function () { resolve(false); });
        } else resolve(false);
      } catch (e) { resolve(false); }
    });
  }

  /* 3) ID из referrer — работает без API */
  function idsFromReferrer() {
    var r = '';
    try { r = String(document.referrer || ''); } catch (e) {}
    var m = r.match(/client\/(\d+)\/deal\/(\d+)/);
    if (m) { clientId = m[1]; dealId = m[2]; src = 'referrer'; return true; }
    var m2 = r.match(/deal\/(\d+)/);
    if (m2) { dealId = m2[1]; src = 'referrer'; return true; }
    return false;
  }

  function resolveIds() {
    if (idsFromQuery()) return Promise.resolve(true);
    return idsFromApi().then(function (ok) { return ok || idsFromReferrer(); });
  }

  function open() {
    resolveIds().then(function () {
      var u = CONSTRUCTOR_URL +
        (dealId   ? '?deal_id='   + encodeURIComponent(dealId)   : '?') +
        (clientId ? '&client_id=' + encodeURIComponent(clientId) : '');
      log('открываю ' + u + ' (источник: ' + (src || 'нет') + ')');

      var w = W();
      var html = '<iframe src="' + u + '" style="width:100%;height:80vh;border:0;display:block"></iframe>';
      try {
        if (w && typeof w.openPage === 'function') { w.openPage({ content: html }); return; }
        if (w && typeof w.openModal === 'function') {
          w.openModal({ title: 'Коммерческое предложение', content: html, width: 1250 }); return;
        }
      } catch (e) {}
      window.open(u, '_blank');
    });
  }

  btn.addEventListener('click', open);

  function register() {
    var w = W();
    if (!w || typeof w.init !== 'function') return false;
    try {
      w.init({
        'deal-btn': function (params) {
          params = params || {};
          dealId   = String(params.dealID   || params.deal_id   || params.dealId   || dealId   || '');
          clientId = String(params.clientID || params.client_id || params.clientId || clientId || '');
          return [{
            title: 'Сформировать КП',
            styles: { color: '#fff', 'background-color': '#2F6BFF' },
            icon: 'md-description',
            clickEventName: 'kp-btn:click',
            position: ['first'],
            name: 'kp-btn-v47'
          }];
        }
      });
      return true;
    } catch (e) { log('init ошибка', e); return false; }
  }

  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'kp-btn:click') open();
  }, false);

  function show(apiOk) {
    var ref = '';
    try { ref = String(document.referrer || '—').slice(0, 90); } catch (e) { ref = '—'; }
    st.innerHTML =
      'EnvyCrmWidget: <b>' + (W() ? 'есть' : 'нет') + '</b><br>' +
      'init: <b>' + (apiOk ? 'вызван' : 'недоступен') + '</b><br>' +
      'ID: <b>' + (dealId || '—') + '</b> / ' + (clientId || '—') + ' <i>' + (src || '') + '</i><br>' +
      'referrer: <b>' + ref + '</b>';
  }

  var ok = register();
  resolveIds().then(function () { show(ok); });
  log('запуск', { api: !!W(), ids: src });
})();
</script>
</body>
</html>
