<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>КП — виджет</title>

<!-- ПОДКЛЮЧЕНИЕ БИБЛИОТЕКИ ВИДЖЕТА. Без этой строки w.init() не работает,
     и кнопка не появляется молча. Адрес — только этот. -->
<script src="https://cdn.saas-support.com/crm_assets/build/widget/js/envycrmwidget.min.js"
        onerror="window.__KP_LIB_ERROR=1"></script>

<style>
  body{margin:0;font:13px/1.45 -apple-system,Segoe UI,Roboto,Arial,sans-serif;
       background:#fff;color:#2b2b2b;padding:12px;box-sizing:border-box}
  #kpBtn{display:block;width:100%;padding:13px 16px;border:0;border-radius:10px;
    background:#2F6BFF;color:#fff;font:600 14px/1 inherit;cursor:pointer}
  #kpBtn:hover{background:#1f57e0}
  #st{margin-top:10px;font-size:12px;line-height:1.5;color:#666}
  .ok{color:#0a7d33;font-weight:600}
  .err{color:#c0392b;font-weight:600}
  .warn{color:#b8860b;font-weight:600}
</style>
</head>
<body>

<button id="kpBtn" type="button">📄 Сформировать КП</button>
<div id="st">запуск…</div>

<script>
(function () {
  'use strict';

  var VERSION  = 'v40';
  var AUTO_URL = 'https://alenik9024-cell.github.io/kp/kp-auto.html';

  var st  = document.getElementById('st');
  var btn = document.getElementById('kpBtn');

  var w = window.EnvyCrmWidget;
  var dealId = '', clientId = '';

  function log(m, d) { try { console.log('[KP ' + VERSION + '] ' + m, d || ''); } catch (e) {} }
  function say(h) { st.innerHTML = h; }

  function getParam(p, names) {
    p = p || {};
    for (var i = 0; i < names.length; i++) {
      var v = p[names[i]];
      if (v !== undefined && v !== null && v !== '') return String(v);
    }
    return '';
  }

  /* ---------- идентификаторы сделки ---------- */
  function pullDeal() {
    return new Promise(function (resolve) {
      if (dealId) { resolve(); return; }
      try {
        if (!w || typeof w.getDeal !== 'function') { resolve(); return; }
        var r = w.getDeal();
        if (r && typeof r.then === 'function') {
          r.then(function (d) {
            d = d && d.result ? d.result : (d || {});
            dealId   = String(d.id || d.deal_id || dealId || '');
            clientId = String(d.client_id || d.clientId || clientId || '');
            log('getDeal', d);
            resolve();
          }).catch(function (e) { log('getDeal ошибка', e); resolve(); });
        } else { resolve(); }
      } catch (e) { log('getDeal исключение', e); resolve(); }
    });
  }

  /* ---------- открытие конструктора ---------- */
  function openConstructor() {
    var url = AUTO_URL +
      (dealId   ? '&deal_id='   + encodeURIComponent(dealId)   : '') +
      (clientId ? '&client_id=' + encodeURIComponent(clientId) : '');

    var html = '<iframe src="' + url + '" style="width:100%;height:80vh;border:0;display:block"></iframe>';

    log('открываю конструктор', { deal_id: dealId, client_id: clientId });

    try {
      if (w && typeof w.openPage === 'function') {
        w.openPage({ content: html }).catch(function (e) {
          log('openPage не сработал', e);
          if (w && typeof w.openModal === 'function') {
            w.openModal({ title: 'Коммерческое предложение', content: html, width: 1250 });
          }
        });
        return;
      }
      if (w && typeof w.openModal === 'function') {
        w.openModal({ title: 'Коммерческое предложение', content: html, width: 1250 });
        return;
      }
      window.open(url, '_blank');
    } catch (e) {
      log('ошибка открытия', e);
      window.open(url, '_blank');
    }
  }

  /* ---------- кнопка внутри панели расширения ---------- */
  btn.addEventListener('click', function () {
    btn.disabled = true;
    pullDeal().then(function () { btn.disabled = false; openConstructor(); });
  });

  /* ---------- регистрация кнопки в шапке сделки ---------- */
  function register() {
    w = window.EnvyCrmWidget;
    if (!w) { log('EnvyCrmWidget не найдена'); return; }

    /* эвент клика проверяется ТОЧНЫМ сравнением с clickEventName */
    window.addEventListener('message', function (e) {
      if (e.data && e.data.type === 'kp-btn:click') {
        log('кнопка нажата');
        pullDeal().then(openConstructor);
      }
    }, false);

    try {
      w.init({
        'deal-btn': function (params) {
          dealId   = getParam(params, ['dealID', 'deal_id', 'dealId'])       || dealId;
          clientId = getParam(params, ['clientID', 'client_id', 'clientId']) || clientId;
          log('params', { deal_id: dealId, client_id: clientId });

          /* РОВНО ОДНА кнопка, как в рабочей v32.
             Несколько кнопок с одним position гасят друг друга. */
          return [{
            title: 'Сформировать КП',
            styles: { color: '#fff', 'background-color': '#2F6BFF' },
            icon: 'md-description',
            clickEventName: 'kp-btn:click',
            position: ['first'],
            name: 'kp-btn-final-32'
          }];
        }
      });
      log('кнопка зарегистрирована');
    } catch (e) { log('ошибка регистрации', e); }
  }

  /* ---------- ожидание библиотеки + состояние на экране ---------- */
  function wait(n) {
    n = n || 0;

    if (window.EnvyCrmWidget) {
      register();
      pullDeal().then(function () {
        say('Библиотека: <span class="ok">загружена</span><br>' +
            'Кнопка в шапке: <span class="ok">зарегистрирована</span><br>' +
            'Сделка: <b>' + (dealId || '—') + '</b> · Клиент: <b>' + (clientId || '—') + '</b>');
      });
      return;
    }

    if (n === 0) {
      say('Библиотека: <span class="warn">ожидание…</span>');
    }

    if (n >= 60) {
      say('Библиотека: <span class="err">НЕ загрузилась</span><br>' +
          'Строка <code>cdn.saas-support.com</code> не открывается из этой сети.<br>' +
          'Кнопка ниже работает и без неё.');
      log('библиотека не загрузилась за 6 с');
      return;
    }
    setTimeout(function () { wait(n + 1); }, 100);
  }

  log('виджет ' + VERSION + ' запущен', { lib: !!window.EnvyCrmWidget, err: !!window.__KP_LIB_ERROR });
  wait(0);
})();
</script>
</body>
</html>
