<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>КП — виджет EnvyCRM</title>
</head>
<body>
<script src="https://cdn.saas-support.com/crm_assets/build/widget/js/envycrmwidget.min.js"></script>

<script>
(function () {
  'use strict';

  var VERSION = 'v9';
  var CTOR = 'https://alenik9024-cell.github.io/kp/kp.html';

  var w = window.EnvyCrmWidget;

  function log(message, data) {
    console.log('[KP ' + VERSION + '] ' + message, data || '');
  }

  if (!w) {
    log('EnvyCrmWidget не загрузилась');
    return;
  }

  /*
   * Открывает новую вкладку сразу в момент клика.
   * Это важно: браузер не блокирует такое открытие,
   * потому что оно происходит непосредственно после нажатия кнопки.
   */
  function openConstructorFromClick() {
    var tab = null;

    try {
      tab = window.open('about:blank', '_blank');
    } catch (e) {
      log('Браузер запретил новую вкладку', e);
    }

    function openUrl(dealId) {
      var url = CTOR + '?embed=1&full=1';

      if (dealId) {
        url += '&deal_id=' + encodeURIComponent(dealId);
      }

      log('открываю конструктор: ' + url);

      if (tab && !tab.closed) {
        tab.location.href = url;
        return;
      }

      /*
       * Запасной вариант, если браузер заблокировал новую вкладку.
       */
      var html =
        '<iframe src="' + url + '" ' +
        'style="width:100%;height:calc(100vh - 80px);border:0" ' +
        'allowfullscreen></iframe>';

      if (w.openPage) {
        w.openPage({ content: html })
          .then(function () {
            log('конструктор открыт через openPage');
          })
          .catch(function (error) {
            log('openPage не сработал', error);

            if (w.openModal) {
              w.openModal({
                title: 'Конструктор КП',
                content: html,
                width: 1150
              }).catch(function (e) {
                log('openModal не сработал', e);
              });
            }
          });

        return;
      }

      if (w.openModal) {
        w.openModal({
          title: 'Конструктор КП',
          content: html,
          width: 1150
        }).catch(function (e) {
          log('openModal не сработал', e);
        });

        return;
      }

      log('не удалось открыть конструктор');
    }

    /*
     * ID сделки берём штатным методом расширения.
     */
    if (w.getDeal) {
      w.getDeal()
        .then(function (deal) {
          deal = deal || {};

          var dealId =
            deal.id ||
            deal.deal_id ||
            (deal.result && (deal.result.id || deal.result.deal_id)) ||
            null;

          log('получена сделка', deal);
          openUrl(dealId);
        })
        .catch(function (error) {
          log('getDeal не сработал', error);
          openUrl(null);
        });
    } else {
      openUrl(null);
    }
  }

  /*
   * Получаем события клика.
   */
  window.addEventListener('message', function (event) {
    var type = event.data && event.data.type;

    if (type !== 'kp-btn:click' && type !== 'kp-side:click') {
      return;
    }

    log('клик: ' + type, event.data);
    openConstructorFromClick();
  }, false);

  /*
   * Регистрация кнопки в карточке сделки
   * и пункта в левом меню.
   */
  try {
    w.init({
      'deal-btn': function () {
        return [{
          title: 'Сформировать КП',
          styles: {
            'color': '#fff',
            'background-color': '#2F6BFF'
          },
          icon: 'md-description',
          clickEventName: 'kp-btn:click',
          position: ['first'],
          name: 'kp-btn-1'
        }];
      },

      'sidebar-item': function () {
        return [{
          title: 'Конструктор КП',
          icon: 'md-description',
          clickEventName: 'kp-side:click',
          position: ['first'],
          name: 'kp-sidebar-1'
        }];
      }
    });

    log('кнопки зарегистрированы');
  } catch (error) {
    log('ошибка регистрации кнопок', error);
  }
})();
</script>
</body>
</html>
