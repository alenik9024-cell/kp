<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>КП — виджет</title>
<style>
body{margin:0;padding:12px;box-sizing:border-box;background:#fff;font:13px/1.5 -apple-system,sans-serif}
#kpBtn{display:block;width:100%;padding:13px 16px;border:0;border-radius:10px;background:#2F6BFF;color:#fff;font:600 14px/1 inherit;cursor:pointer}
#kpBtn:hover{background:#1f57e0}
#st{margin-top:10px;font-size:12px;color:#666}
</style>
</head>
<body>
<button id="kpBtn">📄 Сформировать КП</button>
<div id="st">Готов к работе</div>

<script>
(function(){
  var btn = document.getElementById('kpBtn');
  btn.onclick = function(){
    var params = new URLSearchParams(location.search);
    var dealId = params.get('deal_id') || params.get('dealId') || '';
    var clientId = params.get('client_id') || params.get('clientId') || '';
    window.open('https://alenik9024-cell.github.io/kp/kp-constructor.html?deal_id=' + dealId + '&client_id=' + clientId, '_blank');
  };
})();
</script>
</body>
</html>
