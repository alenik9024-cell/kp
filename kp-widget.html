<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Генератор КП</title>
</head>
<body>

<script src="https://cdn.saas-support.com/crm_assets/build/widget/js/envycrmwidget.min.js"></script>

<script>
(function () {
  'use strict';

  var VERSION = 'v32';
  var AUTO_URL = 'https://alenik9024-cell.github.io/kp/kp-auto.html?v=32';

  var w = window.EnvyCrmWidget;
  var dealId = '';
  var clientId = '';

  function log(m, d) {
    try { console.log('[KP ' + VERSION + '] ' + m, d || ''); } catch (e) {}
  }

  function getParam(params, names) {
    params = params || {};
    for (var i = 0; i < names.length; i++) {
      var v = params[names[i]];
      if (v !== undefined && v !== null && v !== '') return String(v);
    }
    return '';
  }

  function openConstructor() {
    var url = AUTO_URL +
      '&deal_id=' + encodeURIComponent(dealId) +
      '&client_id=' + encodeURIComponent(clientId);

    var html = '<iframe src="' + url + '"' +
      ' style="width:100%;height:calc(100vh - 60px);min-height:650px;border:0"' +
      ' allowfullscreen></iframe>';

    log('открываю kp-auto.html', { deal_id: dealId, client_id: clientId });

    try {
      if (w && typeof w.openPage === 'function') {
        w.openPage({ content: html }).catch(function (e) {
          log('openPage не сработал', e);
          if (w && typeof w.openModal === 'function') {
            w.openModal({ title: 'Конструктор КП', content: html, width: 1150 });
          }
        });
        return;
      }
      if (w && typeof w.openModal === 'function') {
        w.openModal({ title: 'Конструктор КП', content: html, width: 1150 });
        return;
      }
      window.open(url, '_blank');
    } catch (e) {
      log('ошибка открытия', e);
      window.open(url, '_blank');
    }
  }

  function register() {
    w = window.EnvyCrmWidget;
    if (!w) { log('EnvyCrmWidget не найдена'); return; }

    log('библиотека найдена');

    window.addEventListener('message', function (e) {
      if (e.data && e.data.type === 'kp-btn:click') {
        log('кнопка нажата');
        openConstructor();
      }
    }, false);

    try {
      w.init({
        'deal-btn': function (params) {
          dealId = getParam(params, ['dealID', 'deal_id', 'dealId']);
          clientId = getParam(params, ['clientID', 'client_id', 'clientId']);
          log('параметры сделки получены', { deal_id: dealId, client_id: clientId });
          return [{
            title: 'Сформировать КП',
            styles: { color: '#fff', 'background-color': '#2F6BFF' },
            icon: 'md-description',
            clickEventName: 'kp-btn:click',
            position: ['first'],
            name: 'kp-btn-final-32'
          }];
        }
      });
      log('кнопка зарегистрирована');
    } catch (e) {
      log('ошибка регистрации', e);
    }
  }

  function wait(attempt) {
    attempt = attempt || 0;
    if (window.EnvyCrmWidget) { register(); return; }
    if (attempt >= 100) { log('библиотека не загрузилась'); return; }
    setTimeout(function () { wait(attempt + 1); }, 100);
  }

  log('виджет v32 запущен');
  wait(0);
})();
</script>

</body>
</html>
