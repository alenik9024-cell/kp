<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Генератор КП</title>
</head>
<body>

<script src="https://cdn.saas-support.com/crm_assets/build/widget/js/envycrmwidget.min.js"></script>

<script>
(function () {
  'use strict';

  var VERSION = 'v24';
  var CONSTRUCTOR_URL =
    'https://alenik9024-cell.github.io/kp/kp.html';

  var widget = null;
  var currentDealId = '';
  var currentClientId = '';

  function log(message, data) {
    try {
      console.log(
        '[KP ' + VERSION + '] ' + message,
        data || ''
      );
    } catch (e) {}
  }

  log('файл kp-widget.html запущен');

  function getParam(params, names) {
    params = params || {};

    for (var i = 0; i < names.length; i++) {
      var value = params[names[i]];

      if (
        value !== undefined &&
        value !== null &&
        value !== ''
      ) {
        return String(value);
      }
    }

    return '';
  }

  function openConstructor() {
    var url =
      CONSTRUCTOR_URL +
      '?embed=1' +
      '&full=1' +
      '&deal_id=' +
      encodeURIComponent(currentDealId) +
      '&client_id=' +
      encodeURIComponent(currentClientId);

    var iframe =
      '<iframe src="' + url + '"' +
      ' style="width:100%;height:calc(100vh - 60px);' +
      'min-height:650px;border:0;"' +
      ' allowfullscreen></iframe>';

    log('открываю конструктор', {
      deal_id: currentDealId,
      client_id: currentClientId,
      url: url
    });

    try {
      if (
        widget &&
        typeof widget.openPage === 'function'
      ) {
        var page = widget.openPage({
          content: iframe
        });

        if (
          page &&
          typeof page.catch === 'function'
        ) {
          page.catch(function (error) {
            log('openPage не сработал', error);
            openModalOrTab(url, iframe);
          });
        }

        return;
      }

      openModalOrTab(url, iframe);

    } catch (error) {
      log('ошибка открытия конструктора', error);
      openModalOrTab(url, iframe);
    }
  }

  function openModalOrTab(url, iframe) {
    if (
      widget &&
      typeof widget.openModal === 'function'
    ) {
      try {
        widget.openModal({
          title: 'Конструктор КП',
          content: iframe,
          width: 1150
        });

        return;
      } catch (error) {
        log('openModal не сработал', error);
      }
    }

    window.open(url, '_blank');
  }

  function registerWidget() {
    widget = window.EnvyCrmWidget;

    if (!widget) {
      log('EnvyCrmWidget не найдена');
      return;
    }

    log('библиотека EnvyCRM загружена');

    /*
     * Событие клика по кнопке.
     */
    window.addEventListener(
      'message',
      function (event) {
        var type = event.data &&
          event.data.type;

        if (type !== 'kp-btn:click') {
          return;
        }

        log('кнопка нажата', event.data);
        openConstructor();
      },
      false
    );

    try {
      var result = widget.init({
        'deal-btn': function (params) {
          /*
           * CRM передаёт параметры текущей сделки
           * именно сюда.
           */
          currentDealId = getParam(
            params,
            [
              'dealID',
              'deal_id',
              'dealId'
            ]
          );

          currentClientId = getParam(
            params,
            [
              'clientID',
              'client_id',
              'clientId'
            ]
          );

          log('параметры сделки получены', {
            deal_id: currentDealId,
            client_id: currentClientId,
            params: params
          });

          return [{
            title: 'Сформировать КП',
            styles: {
              color: '#fff',
              'background-color': '#2F6BFF'
            },
            icon: 'md-description',
            clickEventName: 'kp-btn:click',
            position: ['first'],
            name: 'kp-btn-1'
          }];
        }
      });

      if (
        result &&
        typeof result.catch === 'function'
      ) {
        result.catch(function (error) {
          log('ошибка init', error);
        });
      }

      log('кнопка зарегистрирована');
    } catch (error) {
      log('ошибка регистрации кнопки', error);
    }
  }

  function waitForLibrary(attempt) {
    attempt = attempt || 0;

    if (window.EnvyCrmWidget) {
      registerWidget();
      return;
    }

    if (attempt >= 100) {
      log(
        'EnvyCrmWidget не загрузилась за 10 секунд'
      );
      return;
    }

    setTimeout(function () {
      waitForLibrary(attempt + 1);
    }, 100);
  }

  waitForLibrary(0);
})();
</script>

</body>
</html>
