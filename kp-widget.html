<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>КП — виджет</title>
  <script src="https://cdn.saas-support.com/crm_assets/build/widget/js/envycrmwidget.min.js"></script>

  <style>
    body{margin:0;padding:12px;box-sizing:border-box;background:#fff;color:#2b2b2b;
         font:13px/1.5 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
    #kpBtn{display:block;width:100%;padding:13px 16px;border:0;border-radius:10px;
           background:#2F6BFF;color:#fff;font:600 14px/1 inherit;cursor:pointer}
    #kpBtn:hover{background:#1f57e0}
    #st{margin-top:10px;font-size:12px;line-height:1.6;color:#666}
    .ok{color:#0a7d33;font-weight:600}
  </style>
</head>
<body>

<button id="kpBtn" type="button">📄 Сформировать КП</button>
<div id="st">запуск…</div>

<script>
(function () {
  'use strict';

  var CONSTRUCTOR_URL = 'https://alenik9024-cell.github.io/kp/kp.html';

  var st  = document.getElementById('st');
  var btn = document.getElementById('kpBtn');

  var dealId = '', clientId = '';

  function log(m, d) { try { console.log('[KP] ' + m, d || ''); } catch (e) {} }
  function W() { return window.EnvyCrmWidget; }

  /* Мгновенное открытие без зависающего getDeal */
  function open() {
    var pad = function (n) { return (n < 10 ? '0' : '') + n; };
    var d = new Date();
    var num = dealId ? (dealId + '/' + pad(d.getDate()) + '/' + pad(d.getMonth() + 1)) : '';

    var url = CONSTRUCTOR_URL +
      (dealId   ? '?deal_id='  + encodeURIComponent(dealId)   : '?') +
      (clientId ? '&client_id=' + encodeURIComponent(clientId) : '') +
      (num      ? '&num='       + encodeURIComponent(num)       : '');

    log('открываю конструктор', url);

    var content =
      '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:#0F1622;border-bottom:1px solid #22304A;">' +
      '<span style="color:#E7EDF8;font-size:13px;font-weight:700;">Коммерческое предложение ' + (dealId ? '№ ' + num : '') + '</span>' +
      '<a href="' + url + '" target="_blank" style="color:#7FD1FF;font-size:12px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px;background:#141D2C;padding:6px 12px;border:1px solid #22304A;border-radius:6px;">' +
      '↗ Открыть в новой вкладке во весь экран</a>' +
      '</div>' +
      '<iframe src="' + url + '" style="width:100%;height:85vh;border:0;display:block;background:#070A10;"></iframe>';

    var w = W();
    try {
      if (w && typeof w.openPage === 'function') {
        w.openPage({ content: content });
        return;
      }
      if (w && typeof w.openModal === 'function') {
        w.openModal({ title: 'Коммерческое предложение', content: content, width: 1250 });
        return;
      }
    } catch (e) { log('ошибка открытия', e); }

    window.open(url, '_blank');
  }

  if (btn) btn.onclick = open;

  /* Клик по кнопке сделки в CRM */
  window.addEventListener('message', function (event) {
    if (event.data && event.data.type === 'kp-btn:click') {
      log('клик получен, открываю…');
      open();
    }
  }, false);

  /* Регистрация кнопки через функцию */
  function register() {
    var w = W();
    if (!w || typeof w.init !== 'function') return;

    try {
      w.init({
        'deal-btn': function (params) {
          params = params || {};
          dealId   = String(params.dealID   || params.deal_id   || params.dealId   || dealId   || '');
          clientId = String(params.clientID || params.client_id || params.clientId || clientId || '');
          log('params кнопки получены', params);

          return [{
            title: 'Сформировать КП',
            styles: { color: '#fff', 'background-color': '#2F6BFF' },
            icon: 'md-description',
            clickEventName: 'kp-btn:click',
            position: ['first'],
            name: 'kp-btn'
          }];
        }
      });
      if (st) st.innerHTML = '<span class="ok">Кнопка активна</span>';
      log('кнопка зарегистрирована');
    } catch (e) {
      log('ошибка init', e);
    }
  }

  function wait(n) {
    if (W()) { register(); return; }
    if (n >= 50) return;
    setTimeout(function () { wait(n + 1); }, 100);
  }

  wait(0);
})();
</script>

</body>
</html>
