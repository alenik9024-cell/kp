<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>КП — виджет EnvyCRM</title>
</head>
<body>

<script src="https://cdn.saas-support.com/crm_assets/build/widget/js/envycrmwidget.min.js"></script>

<script>
(function () {
  'use strict';

  var VERSION = 'v17';
  var AUTO_URL = 'https://alenik9024-cell.github.io/kp/kp-auto.html?v=17';
  var STORAGE_KEY = 'kp_current_deal_context_v17';

  var w = window.EnvyCrmWidget;

  function log(text, data) {
    console.log('[KP ' + VERSION + '] ' + text, data || '');
  }

  if (!w) {
    log('EnvyCrmWidget не загрузилась');
    return;
  }

  function primitive(value) {
    return value !== null &&
      value !== undefined &&
      (typeof value === 'string' || typeof value === 'number');
  }

  function extract(value, seen) {
    if (value === null || value === undefined) {
      return '';
    }

    if (primitive(value)) {
      return String(value).trim();
    }

    if (typeof value !== 'object') {
      return '';
    }

    seen = seen || [];

    if (seen.indexOf(value) !== -1) {
      return '';
    }

    seen.push(value);

    var keys = [
      'value',
      'phone',
      'client_phone',
      'mobile_phone',
      'client_name',
      'customer_name',
      'name',
      'result',
      'data'
    ];

    for (var i = 0; i < keys.length; i++) {
      if (value[keys[i]] !== undefined) {
        var result = extract(value[keys[i]], seen);

        if (result) {
          return result;
        }
      }
    }

    if (Array.isArray(value)) {
      for (var j = 0; j < value.length; j++) {
        var item = extract(value[j], seen);

        if (item) {
          return item;
        }
      }
    }

    return '';
  }

  function findInputValue(data, inputId, seen) {
    if (!data || typeof data !== 'object') {
      return '';
    }

    seen = seen || [];

    if (seen.indexOf(data) !== -1) {
      return '';
    }

    seen.push(data);

    if (
      data.input_id !== undefined &&
      String(data.input_id) === String(inputId)
    ) {
      return extract(data.value);
    }

    if (Array.isArray(data)) {
      for (var i = 0; i < data.length; i++) {
        var arrayValue = findInputValue(
          data[i],
          inputId,
          seen
        );

        if (arrayValue) {
          return arrayValue;
        }
      }

      return '';
    }

    for (var key in data) {
      if (!Object.prototype.hasOwnProperty.call(data, key)) {
        continue;
      }

      var nestedValue = findInputValue(
        data[key],
        inputId,
        seen
      );

      if (nestedValue) {
        return nestedValue;
      }
    }

    return '';
  }

  function dealObject(deal) {
    if (!deal || typeof deal !== 'object') {
      return {};
    }

    if (deal.result && typeof deal.result === 'object') {
      return deal.result;
    }

    return deal;
  }

  function getDealId(deal) {
    var d = dealObject(deal);

    return String(
      d.id ||
      d.deal_id ||
      ''
    );
  }

  function getName(deal) {
    var d = dealObject(deal);

    var name = extract(
      d.client_name ||
      d.clientName ||
      d.customer_name ||
      d.name_client
    );

    if (name) {
      return name;
    }

    if (d.client) {
      name = extract(d.client);

      if (name) {
        return name;
      }
    }

    return '';
  }

  function getPhone(deal) {
    var d = dealObject(deal);

    var phone = extract(
      d.phone ||
      d.client_phone ||
      d.mobile_phone
    );

    if (phone && /\d{5,}/.test(phone)) {
      return phone;
    }

    if (Array.isArray(d.contacts)) {
      for (var i = 0; i < d.contacts.length; i++) {
        phone = extract(d.contacts[i]);

        if (phone && /\d{5,}/.test(phone)) {
          return phone;
        }
      }
    }

    return '';
  }

  function getClientField(inputId) {
    if (w.getClientValue) {
      return w.getClientValue({
        input_id: inputId,
        type: 'service'
      }).then(function (data) {
        var value = extract(data);

        if (value) {
          return value;
        }

        if (w.getClientValues) {
          return w.getClientValues().then(function (all) {
            return findInputValue(all, inputId);
          });
        }

        return '';
      }).catch(function () {
        return '';
      });
    }

    if (w.getClientValues) {
      return w.getClientValues().then(function (all) {
        return findInputValue(all, inputId);
      }).catch(function () {
        return '';
      });
    }

    return Promise.resolve('');
  }

  function makeNumber(dealId) {
    var date = new Date();

    var day = String(date.getDate()).padStart(2, '0');
    var month = String(date.getMonth() + 1).padStart(2, '0');
    var year = date.getFullYear();

    return 'КП-' + dealId + '/' + day + '.' + month + '.' + year;
  }

  var channel = null;

  function publish(context) {
    try {
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(context)
      );
    } catch (e) {
      log('ошибка localStorage', e);
    }

    if (channel) {
      try {
        channel.postMessage(context);
      } catch (e) {
        log('ошибка BroadcastChannel', e);
      }
    }

    log('контекст передан', context);
  }

  function openConstructor() {
    var token = 'kp_' + Date.now();

    if (window.BroadcastChannel) {
      try {
        channel = new BroadcastChannel(
          'kp_context_' + token
        );
      } catch (e) {
        channel = null;
      }
    }

    publish({
      token: token,
      dealId: '',
      clientName: '',
      phone: '',
      proposalNumber: '',
      updatedAt: Date.now()
    });

    var url =
      AUTO_URL +
      '&token=' +
      encodeURIComponent(token);

    var iframe =
      '<iframe src="' + url + '" ' +
      'style="width:100%;height:calc(100vh - 60px);min-height:650px;border:0" ' +
      'allowfullscreen></iframe>';

    /*
     * Открываем сразу, не ожидая getDeal.
     */
    try {
      if (w.openPage) {
        var page = w.openPage({
          content: iframe
        });

        if (page && typeof page.catch === 'function') {
          page.catch(function () {
            if (w.openModal) {
              w.openModal({
                title: 'Конструктор КП',
                content: iframe,
                width: 1150
              });
            }
          });
        }
      } else if (w.openModal) {
        w.openModal({
          title: 'Конструктор КП',
          content: iframe,
          width: 1150
        });
      } else {
        window.open(url, '_blank');
      }
    } catch (error) {
      log('ошибка открытия', error);
      window.open(url, '_blank');
    }

    /*
     * После открытия получаем текущую сделку.
     */
    w.getDeal()
      .then(function (deal) {
        var id = getDealId(deal);
        var name = getName(deal);
        var phone = getPhone(deal);

        var namePromise = name
          ? Promise.resolve(name)
          : getClientField(1001);

        var phonePromise = phone
          ? Promise.resolve(phone)
          : getClientField(1002);

        return Promise.all([
          namePromise,
          phonePromise
        ]).then(function (values) {
          publish({
            token: token,
            dealId: id,
            clientName: values[0] || '',
            phone: values[1] || '',
            proposalNumber: makeNumber(id),
            updatedAt: Date.now()
          });
        });
      })
      .catch(function (error) {
        log('не удалось получить данные сделки', error);
      });
  }

  window.addEventListener('message', function (event) {
    if (
      event.data &&
      event.data.type === 'kp-btn:click'
    ) {
      log('кнопка нажата');
      openConstructor();
    }
  }, false);

  if (w.closeWidget) {
    try {
      w.closeWidget({
        type: 'sidebar-item',
        name: 'kp-sidebar-1'
      });
    } catch (e) {}

    try {
      w.closeWidget({
        type: 'sidebar-item',
        name: 'kp-side-1'
      });
    } catch (e) {}
  }

  w.init({
    'deal-btn': function () {
      return [{
        title: 'Сформировать КП',
        styles: {
          color: '#fff',
          'background-color': '#2F6BFF'
        },
        icon: 'md-description',
        clickEventName: 'kp-btn:click',
        position: ['first'],
        name: 'kp-btn-1'
      }];
    }
  });

  log('виджет v17 зарегистрирован');
})();
</script>

</body>
</html>
