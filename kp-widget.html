<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>КП — виджет</title>
  <script src="https://cdn.saas-support.com/crm_assets/build/widget/js/envycrmwidget.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 12px;
      box-sizing: border-box;
      background: #fff;
      color: #2b2b2b;
      font: 13px/1.5 -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    #kpBtn {
      display: block;
      width: 100%;
      padding: 13px 16px;
      border: 0;
      border-radius: 10px;
      background: #2F6BFF;
      color: #fff;
      font: 600 14px/1 inherit;
      cursor: pointer;
    }
    #kpBtn:hover { background: #1f57e0; }
    #st { margin-top: 10px; font-size: 12px; line-height: 1.6; color: #666; }
    .ok { color: #0a7d33; font-weight: 600; }
  </style>
</head>
<body>
  <button id="kpBtn" type="button">📄 Сформировать КП</button>
  <div id="st">запуск…</div>

  <script>
  (function () {
    'use strict';

    var CONSTRUCTOR_URL = 'https://alenik9024-cell.github.io/kp/kp.html';

    var st = document.getElementById('st');
    var btn = document.getElementById('kpBtn');

    var dealId = '', clientId = '';

    function log(m, d) { try { console.log('[KP] ' + m, d || ''); } catch (e) {} }
    function W() { return window.EnvyCrmWidget; }

    /* Мгновенное открытие КП без зависающих ожиданий */
    function openKp(sourceParams) {
      if (sourceParams) {
        dealId = String(sourceParams.dealID || sourceParams.deal_id || sourceParams.dealId || dealId || '');
        clientId = String(sourceParams.clientID || sourceParams.client_id || sourceParams.clientId || clientId || '');
      }

      var pad = function (n) { return (n < 10 ? '0' : '') + n; };
      var d = new Date();
      var num = dealId ? (dealId + '/' + pad(d.getDate()) + '/' + pad(d.getMonth() + 1)) : '';

      var url = CONSTRUCTOR_URL +
        (dealId ? '?deal_id=' + encodeURIComponent(dealId) : '?') +
        (clientId ? '&client_id=' + encodeURIComponent(clientId) : '') +
        (num ? '&num=' + encodeURIComponent(num) : '');

      log('Открываю КП:', url);
      window.open(url, '_blank');

      // Фоновая запись номера в сделку
      try {
        var w = W();
        if (w && dealId && typeof w.getDealValues === 'function') {
          w.getDealValues().then(function (fields) {
            var fid = '';
            (function walk(o) {
              if (fid || !o || typeof o !== 'object') return;
              if (Array.isArray(o)) { o.forEach(walk); return; }
              var nm = String(o.name || o.title || o.label || '').toLowerCase().trim();
              var iid = o.input_id || o.id;
              if (nm && iid && (nm === 'кп' || nm === 'номер кп' || nm === 'коммерческое предложение')) {
                fid = String(iid); return;
              }
              Object.keys(o).forEach(function (k) { walk(o[k]); });
            })(fields);

            if (fid && typeof w.changeDealValue === 'function') {
              w.changeDealValue({ input_id: fid, value: num });
            }
          }).catch(function () {});
        }
      } catch (e) {}
    }

    if (btn) {
      btn.onclick = function () { openKp(null); };
    }

    /* Клик по синей кнопке из карточки EnvyCRM */
    window.addEventListener('message', function (event) {
      if (event.data && event.data.type === 'kp-btn:click') {
        log('Клик по кнопке сделки получен', event.data);
        openKp(event.data);
      }
    }, false);

    /* Регистрация кнопки через функцию (как у вас сейчас сработало) */
    function register() {
      var w = W();
      if (!w || typeof w.init !== 'function') return;

      try {
        w.init({
          'deal-btn': function (params) {
            params = params || {};
            dealId = String(params.dealID || params.deal_id || params.dealId || dealId || '');
            clientId = String(params.clientID || params.client_id || params.clientId || clientId || '');
            log('params кнопки получены:', params);

            return [{
              title: 'Сформировать КП',
              styles: { color: '#fff', 'background-color': '#2F6BFF' },
              icon: 'md-description',
              clickEventName: 'kp-btn:click',
              position: ['first'],
              name: 'kp-btn'
            }];
          }
        });
        if (st) st.innerHTML = '<span class="ok">Кнопка активна</span>';
        log('кнопка зарегистрирована');
      } catch (e) {
        log('ошибка init', e);
      }
    }

    function wait(n) {
      if (W()) { register(); return; }
      if (n >= 50) return;
      setTimeout(function () { wait(n + 1); }, 100);
    }

    wait(0);
  })();
  </script>
</body>
</html>
