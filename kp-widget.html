<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>КП — виджет EnvyCRM</title>
</head>
<body>

<script src="https://cdn.saas-support.com/crm_assets/build/widget/js/envycrmwidget.min.js"></script>

<script>
(function () {
  'use strict';

  var VERSION = 'v13';

  var CTOR =
    'https://alenik9024-cell.github.io/kp/kp.html';

  var STORAGE_KEY = 'kp_envycrm_context_v13';

  var w = window.EnvyCrmWidget;

  function log(message, data) {
    console.log('[KP ' + VERSION + '] ' + message, data || '');
  }

  if (!w) {
    log('EnvyCrmWidget не загрузилась');
    return;
  }

  /*
   * Удаляем старый пункт из левого меню,
   * если CRM ещё держит старую версию расширения.
   */
  if (w.closeWidget) {
    try {
      w.closeWidget({
        type: 'sidebar-item',
        name: 'kp-sidebar-1'
      });
    } catch (e) {}

    try {
      w.closeWidget({
        type: 'sidebar-item',
        name: 'kp-side-1'
      });
    } catch (e) {}
  }

  function scalar(value) {
    if (value === null || value === undefined) {
      return '';
    }

    if (typeof value === 'string' || typeof value === 'number') {
      return String(value);
    }

    if (typeof value === 'object') {
      if (value.value !== undefined && value.value !== null) {
        return scalar(value.value);
      }

      if (value.phone !== undefined && value.phone !== null) {
        return scalar(value.phone);
      }

      if (value.name !== undefined && value.name !== null) {
        return scalar(value.name);
      }

      if (value.client_name !== undefined && value.client_name !== null) {
        return scalar(value.client_name);
      }

      if (value.result !== undefined && value.result !== null) {
        return scalar(value.result);
      }
    }

    return '';
  }

  function dealId(deal) {
    deal = deal || {};

    return String(
      deal.id ||
      deal.deal_id ||
      (deal.result && (
        deal.result.id ||
        deal.result.deal_id
      )) ||
      ''
    );
  }

  function dealObject(deal) {
    return deal && deal.result ? deal.result : (deal || {});
  }

  function dealName(deal) {
    var d = dealObject(deal);

    return String(
      d.client_name ||
      d.clientName ||
      d.customer_name ||
      d.name_client ||
      (d.client && (
        d.client.name ||
        d.client.client_name ||
        d.client.name_client
      )) ||
      ''
    ).trim();
  }

  function dealPhone(deal) {
    var d = dealObject(deal);

    var direct = scalar(
      d.phone ||
      d.client_phone ||
      d.mobile_phone ||
      ''
    );

    if (direct && /\d{5,}/.test(direct)) {
      return direct;
    }

    var contacts = d.contacts || [];

    for (var i = 0; i < contacts.length; i++) {
      var contact = contacts[i] || {};

      var phone = scalar(
        contact.phone ||
        contact.mobile_phone ||
        contact.value ||
        ''
      );

      if (phone && /\d{5,}/.test(phone)) {
        return phone;
      }
    }

    return '';
  }

  function clientValue(inputId) {
    if (!w.getClientValue) {
      return Promise.resolve('');
    }

    return w.getClientValue({
      input_id: inputId,
      type: 'service'
    })
      .then(function (data) {
        return scalar(data);
      })
      .catch(function () {
        return '';
      });
  }

  function saveContext(context) {
    try {
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(context)
      );

      log('контекст сохранён', context);
    } catch (e) {
      log('не удалось сохранить контекст', e);
    }
  }

  function proposalNumber(id) {
    var date = new Date();

    var day = String(date.getDate()).padStart(2, '0');
    var month = String(date.getMonth() + 1).padStart(2, '0');
    var year = date.getFullYear();

    return 'КП-' + (id || '') + '/' + day + '.' + month + '.' + year;
  }

  /*
   * Конструктор открывается сразу.
   * Данные сделки догружаются после открытия.
   */
  function openConstructor() {
    var token = 'kp_' + Date.now();

    var initialContext = {
      token: token,
      dealId: '',
      phone: '',
      clientName: '',
      number: '',
      createdAt: Date.now()
    };

    saveContext(initialContext);

    var url =
      CTOR +
      '?embed=1' +
      '&full=1' +
      '&auto=1' +
      '&context_token=' +
      encodeURIComponent(token);

    var content =
      '<iframe ' +
      'src="' + url + '" ' +
      'style="width:100%;height:calc(100vh - 70px);min-height:600px;border:0" ' +
      'allowfullscreen>' +
      '</iframe>';

    log('открываю конструктор сразу');

    /*
     * Важно: openPage вызывается до getDeal().
     */
    try {
      if (w.openPage) {
        var page = w.openPage({
          content: content
        });

        if (page && typeof page.catch === 'function') {
          page.catch(function (error) {
            log('openPage не сработал', error);

            if (w.openModal) {
              w.openModal({
                title: 'Конструктор КП',
                content: content,
                width: 1150
              });
            }
          });
        }
      } else if (w.openModal) {
        w.openModal({
          title: 'Конструктор КП',
          content: content,
          width: 1150
        });
      } else {
        window.open(url, '_blank');
      }
    } catch (error) {
      log('ошибка открытия', error);
      window.open(url, '_blank');
    }

    /*
     * Данные сделки получаем уже после открытия.
     */
    if (!w.getDeal) {
      return;
    }

    w.getDeal()
      .then(function (deal) {
        deal = deal || {};

        var id = dealId(deal);
        var name = dealName(deal);
        var phone = dealPhone(deal);

        return Promise.all([
          name ? Promise.resolve(name) : clientValue(1001),
          phone ? Promise.resolve(phone) : clientValue(1002)
        ])
          .then(function (values) {
            var context = {
              token: token,
              dealId: id,
              phone: values[1] || '',
              clientName: values[0] || '',
              number: proposalNumber(id),
              createdAt: Date.now()
            };

            saveContext(context);
          });
      })
      .catch(function (error) {
        log('не удалось получить данные сделки', error);
      });
  }

  /*
   * Получаем только событие кнопки сделки.
   */
  window.addEventListener('message', function (event) {
    var type = event.data && event.data.type;

    if (type !== 'kp-btn:click') {
      return;
    }

    log('нажата кнопка «Сформировать КП»');
    openConstructor();
  }, false);

  /*
   * Регистрируем только одну кнопку.
   */
  try {
    w.init({
      'deal-btn': function () {
        return [{
          title: 'Сформировать КП',
          styles: {
            color: '#fff',
            'background-color': '#2F6BFF'
          },
          icon: 'md-description',
          clickEventName: 'kp-btn:click',
          position: ['first'],
          name: 'kp-btn-1'
        }];
      }
    });

    log('зарегистрирована одна кнопка');
  } catch (error) {
    log('ошибка регистрации кнопки', error);
  }
})();
</script>

</body>
</html>
