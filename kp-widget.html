<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>КП — виджет EnvyCRM</title>
</head>
<body>

<script src="https://cdn.saas-support.com/crm_assets/build/widget/js/envycrmwidget.min.js"></script>

<script>
(function () {
  'use strict';

  var VERSION = 'v19';
  var AUTO_URL =
    'https://alenik9024-cell.github.io/kp/kp-auto.html?v=19';

  var currentContext = {
    dealId: '',
    clientId: ''
  };

  var w = window.EnvyCrmWidget;

  function log(message, data) {
    console.log(
      '[KP ' + VERSION + '] ' + message,
      data || ''
    );
  }

  if (!w) {
    log('EnvyCrmWidget не загрузилась');
    return;
  }

  function getParamValue(params, keys) {
    params = params || {};

    for (var i = 0; i < keys.length; i++) {
      if (
        params[keys[i]] !== undefined &&
        params[keys[i]] !== null &&
        params[keys[i]] !== ''
      ) {
        return String(params[keys[i]]);
      }
    }

    return '';
  }

  function openConstructor(eventData) {
    eventData = eventData || {};

    /*
     * Основной источник — params из callback init.
     * Резервный источник — данные события клика.
     */
    var dealId =
      currentContext.dealId ||
      getParamValue(eventData, [
        'dealID',
        'deal_id',
        'dealId'
      ]);

    var clientId =
      currentContext.clientId ||
      getParamValue(eventData, [
        'clientID',
        'client_id',
        'clientId'
      ]);

    var url =
      AUTO_URL +
      '&deal_id=' + encodeURIComponent(dealId) +
      '&client_id=' + encodeURIComponent(clientId);

    var iframe =
      '<iframe src="' + url + '" ' +
      'style="width:100%;height:calc(100vh - 60px);' +
      'min-height:650px;border:0" ' +
      'allowfullscreen></iframe>';

    log('открываю конструктор', {
      dealID: dealId,
      clientID: clientId,
      url: url
    });

    try {
      if (w.openPage) {
        var page = w.openPage({
          content: iframe
        });

        if (
          page &&
          typeof page.catch === 'function'
        ) {
          page.catch(function (error) {
            log('openPage не сработал', error);

            if (w.openModal) {
              w.openModal({
                title: 'Конструктор КП',
                content: iframe,
                width: 1150
              });
            }
          });
        }

        return;
      }

      if (w.openModal) {
        w.openModal({
          title: 'Конструктор КП',
          content: iframe,
          width: 1150
        });

        return;
      }

      window.open(url, '_blank');

    } catch (error) {
      log('ошибка открытия конструктора', error);
      window.open(url, '_blank');
    }
  }

  window.addEventListener(
    'message',
    function (event) {
      var type = event.data && event.data.type;

      if (type !== 'kp-btn:click') {
        return;
      }

      log('кнопка нажата', event.data);
      openConstructor(event.data);
    },
    false
  );

  /*
   * ВАЖНО:
   * params — это параметры текущей сделки,
   * которые CRM передаёт в callback init.
   */
  try {
    var initResult = w.init({
      'deal-btn': function (params) {
        currentContext.dealId = getParamValue(
          params,
          ['dealID', 'deal_id', 'dealId']
        );

        currentContext.clientId = getParamValue(
          params,
          ['clientID', 'client_id', 'clientId']
        );

        log('параметры сделки получены из init', {
          params: params,
          dealID: currentContext.dealId,
          clientID: currentContext.clientId
        });

        return [{
          title: 'Сформировать КП',
          styles: {
            color: '#fff',
            'background-color': '#2F6BFF'
          },
          icon: 'md-description',
          clickEventName: 'kp-btn:click',
          position: ['first'],
          name: 'kp-btn-1'
        }];
      }
    });

    if (
      initResult &&
      typeof initResult.catch === 'function'
    ) {
      initResult.catch(function (error) {
        log('ошибка init', error);
      });
    }

    log('виджет v19 зарегистрирован');

  } catch (error) {
    log('ошибка регистрации кнопки', error);
  }
})();
</script>

</body>
</html>
