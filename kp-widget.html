<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>КП — виджет EnvyCRM</title>
</head>
<body>

<script src="https://cdn.saas-support.com/crm_assets/build/widget/js/envycrmwidget.min.js"></script>

<script>
(function () {
  'use strict';

  var VERSION = 'v23';

  var AUTO_URL =
    'https://alenik9024-cell.github.io/kp/kp-auto.html?v=21';

  var PROXY_URL =
    'https://script.google.com/macros/s/AKfycbxxi10GiEDFroquS0VwwUH4eJ3v0NuR5GlUiIdOvynZFukhRKkOhRkPVrCFgsBg-pV9/exec';

  var STORAGE_KEY = 'kp_context_v20';

  var widget = null;

  var dealContext = {
    dealId: '',
    clientId: '',
    clientName: '',
    phone: ''
  };

  function log(message, data) {
    try {
      console.log(
        '[KP ' + VERSION + '] ' + message,
        data || ''
      );
    } catch (error) {}
  }

  log('скрипт kp-widget.html запущен');

  function getParam(params, names) {
    params = params || {};

    for (var i = 0; i < names.length; i++) {
      var value = params[names[i]];

      if (
        value !== undefined &&
        value !== null &&
        value !== ''
      ) {
        return String(value);
      }
    }

    return '';
  }

  function proposalNumber(dealId) {
    var date = new Date();

    var day = String(date.getDate())
      .padStart(2, '0');

    var month = String(date.getMonth() + 1)
      .padStart(2, '0');

    var year = date.getFullYear();

    return 'КП-' + dealId + '/' +
      day + '.' + month + '.' + year;
  }

  function saveContext(token) {
    var context = {
      token: token,
      dealId: dealContext.dealId,
      clientId: dealContext.clientId,
      clientName: dealContext.clientName,
      phone: dealContext.phone,
      proposalNumber: proposalNumber(
        dealContext.dealId
      ),
      updatedAt: Date.now()
    };

    try {
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(context)
      );

      log('контекст сохранён', context);
    } catch (error) {
      log('ошибка localStorage', error);
    }
  }

  function getProxyData(token) {
    var dealId = dealContext.dealId;
    var clientId = dealContext.clientId;

    if (!dealId && !clientId) {
      log('нет dealID/clientID для прокси');
      return;
    }

    var callbackName =
      '__kp_proxy_' +
      Date.now() +
      '_' +
      Math.floor(Math.random() * 100000);

    var script = document.createElement('script');
    var finished = false;

    var timer = setTimeout(function () {
      finish('тайм-аут Google Apps Script');
    }, 15000);

    function cleanup() {
      clearTimeout(timer);

      try {
        delete window[callbackName];
      } catch (error) {
        window[callbackName] = undefined;
      }

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }
    }

    function finish(message) {
      if (finished) {
        return;
      }

      finished = true;
      cleanup();

      if (message) {
        log(message);
      }
    }

    window[callbackName] = function (data) {
      if (finished) {
        return;
      }

      if (!data || !data.ok) {
        finish(
          'прокси вернул ошибку: ' +
          (data && data.error
            ? data.error
            : 'неизвестная ошибка')
        );

        return;
      }

      dealContext.clientName =
        String(data.clientName || '');

      dealContext.phone =
        String(data.phone || '');

      saveContext(token);

      finish('данные получены через Google Apps Script');
    };

    script.onerror = function () {
      finish('Google Apps Script недоступен');
    };

    script.src =
      PROXY_URL +
      '?deal_id=' +
      encodeURIComponent(dealId) +
      '&client_id=' +
      encodeURIComponent(clientId) +
      '&callback=' +
      encodeURIComponent(callbackName);

    document.head.appendChild(script);
  }

  function openConstructor() {
    var token = 'kp_' + Date.now();

    /*
     * Сохраняем ID сделки до ответа прокси.
     */
    saveContext(token);

    var url =
      AUTO_URL +
      '&token=' +
      encodeURIComponent(token);

    var content =
      '<iframe src="' + url + '" ' +
      'style="width:100%;height:calc(100vh - 60px);' +
      'min-height:650px;border:0" ' +
      'allowfullscreen></iframe>';

    log('открываю конструктор', {
      dealId: dealContext.dealId,
      clientId: dealContext.clientId
    });

    try {
      if (
        widget.openPage &&
        typeof widget.openPage === 'function'
      ) {
        var page = widget.openPage({
          content: content
        });

        if (
          page &&
          typeof page.catch === 'function'
        ) {
          page.catch(function (error) {
            log('openPage не сработал', error);

            if (
              widget.openModal &&
              typeof widget.openModal === 'function'
            ) {
              widget.openModal({
                title: 'Конструктор КП',
                content: content,
                width: 1150
              });
            }
          });
        }
      } else if (
        widget.openModal &&
        typeof widget.openModal === 'function'
      ) {
        widget.openModal({
          title: 'Конструктор КП',
          content: content,
          width: 1150
        });
      } else {
        window.open(url, '_blank');
      }
    } catch (error) {
      log('ошибка открытия конструктора', error);
      window.open(url, '_blank');
    }

    /*
     * Прокси запускается после открытия
     * и не влияет на появление кнопки.
     */
    getProxyData(token);
  }

  function register() {
    widget = window.EnvyCrmWidget;

    if (!widget) {
      log('EnvyCrmWidget не найдена');
      return;
    }

    log('библиотека найдена');

    window.addEventListener(
      'message',
      function (event) {
        if (
          event.data &&
          event.data.type === 'kp-btn:click'
        ) {
          log('кнопка нажата');
          openConstructor();
        }
      },
      false
    );

    try {
      var result = widget.init({
        'deal-btn': function (params) {
          dealContext.dealId = getParam(
            params,
            ['dealID', 'deal_id', 'dealId']
          );

          dealContext.clientId = getParam(
            params,
            ['clientID', 'client_id', 'clientId']
          );

          log('параметры сделки получены', {
            dealId: dealContext.dealId,
            clientId: dealContext.clientId
          });

          return [{
            title: 'Сформировать КП',
            styles: {
              color: '#fff',
              'background-color': '#2F6BFF'
            },
            icon: 'md-description',
            clickEventName: 'kp-btn:click',
            position: ['first'],
            name: 'kp-btn-1'
          }];
        }
      });

      if (
        result &&
        typeof result.catch === 'function'
      ) {
        result.catch(function (error) {
          log('init вернул ошибку', error);
        });
      }

      log('виджет зарегистрирован');
    } catch (error) {
      log('ошибка регистрации', error);
    }
  }

  function waitForLibrary(attempt) {
    attempt = attempt || 0;

    if (window.EnvyCrmWidget) {
      register();
      return;
    }

    if (attempt >= 100) {
      log('EnvyCrmWidget не загрузилась за 10 секунд');
      return;
    }

    setTimeout(function () {
      waitForLibrary(attempt + 1);
    }, 100);
  }

  waitForLibrary(0);
})();
</script>

</body>
</html>
