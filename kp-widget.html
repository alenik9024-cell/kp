<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>КП — виджет EnvyCRM</title>
</head>
<body>

<script src="https://cdn.saas-support.com/crm_assets/build/widget/js/envycrmwidget.min.js"></script>

<script>
(function () {
  'use strict';

  var VERSION = 'v22';

  var AUTO_URL =
    'https://alenik9024-cell.github.io/kp/kp-auto.html?v=21';

  var PROXY_URL =
    'https://script.google.com/macros/s/AKfycbwAAv5-GSxfRAtGNgn0hocXpKAU3x6lEc6pSDifNUV8m7XEuVSqnKjCmKLXGGiNllZZ/exec';

  var STORAGE_KEY = 'kp_context_v20';

  var w = window.EnvyCrmWidget;

  var dealContext = {
    dealId: '',
    clientId: '',
    clientName: '',
    phone: ''
  };

  function log(message, data) {
    console.log(
      '[KP ' + VERSION + '] ' + message,
      data || ''
    );
  }

  if (!w) {
    log('EnvyCrmWidget не загрузилась');
    return;
  }

  function getParam(params, names) {
    params = params || {};

    for (var i = 0; i < names.length; i++) {
      var value = params[names[i]];

      if (
        value !== undefined &&
        value !== null &&
        value !== ''
      ) {
        return String(value);
      }
    }

    return '';
  }

  function makeProposalNumber(dealId) {
    var date = new Date();

    var day = String(date.getDate())
      .padStart(2, '0');

    var month = String(date.getMonth() + 1)
      .padStart(2, '0');

    var year = date.getFullYear();

    return 'КП-' + dealId + '/' +
      day + '.' + month + '.' + year;
  }

  function saveContext(token) {
    var context = {
      token: token,
      dealId: dealContext.dealId,
      clientId: dealContext.clientId,
      clientName: dealContext.clientName,
      phone: dealContext.phone,
      proposalNumber: makeProposalNumber(
        dealContext.dealId
      ),
      updatedAt: Date.now()
    };

    try {
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(context)
      );

      log('контекст сохранён', context);
    } catch (error) {
      log('ошибка сохранения контекста', error);
    }
  }

  /*
   * Получение имени и телефона через Google Apps Script.
   * Прямых запросов из браузера в EnvyCRM нет.
   */
  function loadClientData() {
    var dealId = dealContext.dealId;
    var clientId = dealContext.clientId;

    if (!dealId && !clientId) {
      return Promise.reject(
        new Error(
          'CRM не передала dealID и clientID'
        )
      );
    }

    return new Promise(function (resolve, reject) {
      var callbackName =
        '__kp_proxy_callback_' +
        Date.now() +
        '_' +
        Math.floor(Math.random() * 100000);

      var script = document.createElement('script');

      var finished = false;

      var timer = setTimeout(function () {
        finishError(
          new Error(
            'Google Apps Script не ответил за 15 секунд'
          )
        );
      }, 15000);

      function removeScript() {
        if (
          script &&
          script.parentNode
        ) {
          script.parentNode.removeChild(script);
        }
      }

      function cleanup() {
        clearTimeout(timer);
        removeScript();

        try {
          delete window[callbackName];
        } catch (error) {
          window[callbackName] = undefined;
        }
      }

      function finishError(error) {
        if (finished) {
          return;
        }

        finished = true;
        cleanup();
        reject(error);
      }

      window[callbackName] = function (data) {
        if (finished) {
          return;
        }

        finished = true;
        cleanup();

        if (!data || !data.ok) {
          reject(new Error(
            data && data.error
              ? data.error
              : 'Google Apps Script вернул ошибку'
          ));

          return;
        }

        dealContext.clientName =
          String(data.clientName || '');

        dealContext.phone =
          String(data.phone || '');

        log(
          'данные получены через Google Apps Script',
          {
            dealId: dealId,
            clientId: clientId,
            clientName: dealContext.clientName,
            phone: dealContext.phone
          }
        );

        resolve(dealContext);
      };

      script.onerror = function () {
        finishError(
          new Error(
            'Не удалось загрузить Google Apps Script'
          )
        );
      };

      script.src =
        PROXY_URL +
        '?deal_id=' +
        encodeURIComponent(dealId) +
        '&client_id=' +
        encodeURIComponent(clientId) +
        '&callback=' +
        encodeURIComponent(callbackName);

      document.head.appendChild(script);
    });
  }

  function openConstructor() {
    var token = 'kp_' + Date.now();

    /*
     * Сохраняем ID сразу, чтобы конструктор открылся
     * даже до ответа Google Apps Script.
     */
    saveContext(token);

    var url =
      AUTO_URL +
      '&token=' +
      encodeURIComponent(token);

    var iframe =
      '<iframe src="' + url + '" ' +
      'style="width:100%;height:calc(100vh - 60px);' +
      'min-height:650px;border:0" ' +
      'allowfullscreen></iframe>';

    log('открываю конструктор', {
      dealId: dealContext.dealId,
      clientId: dealContext.clientId,
      url: url
    });

    try {
      if (w.openPage) {
        var page = w.openPage({
          content: iframe
        });

        if (
          page &&
          typeof page.catch === 'function'
        ) {
          page.catch(function (error) {
            log('openPage не сработал', error);

            if (w.openModal) {
              w.openModal({
                title: 'Конструктор КП',
                content: iframe,
                width: 1150
              });
            }
          });
        }
      } else if (w.openModal) {
        w.openModal({
          title: 'Конструктор КП',
          content: iframe,
          width: 1150
        });
      } else {
        window.open(url, '_blank');
      }
    } catch (error) {
      log('ошибка открытия конструктора', error);
      window.open(url, '_blank');
    }

    /*
     * После открытия получаем имя и телефон
     * через серверный прокси.
     */
    loadClientData()
      .then(function () {
        saveContext(token);
      })
      .catch(function (error) {
        log(
          'не удалось получить имя и телефон',
          error
        );

        /*
         * ID сделки всё равно остаётся доступен,
         * поэтому номер КП продолжит формироваться.
         */
        saveContext(token);
      });
  }

  /*
   * CRM передаёт параметры текущей сделки
   * именно в callback типа deal-btn.
   */
  try {
    var initResult = w.init({
      'deal-btn': function (params) {
        dealContext.dealId = getParam(
          params,
          [
            'dealID',
            'deal_id',
            'dealId'
          ]
        );

        dealContext.clientId = getParam(
          params,
          [
            'clientID',
            'client_id',
            'clientId'
          ]
        );

        log(
          'параметры сделки получены',
          {
            params: params,
            dealId: dealContext.dealId,
            clientId: dealContext.clientId
          }
        );

        /*
         * Здесь запрос НЕ запускаем.
         * Он запускается только после нажатия кнопки.
         */
        return [{
          title: 'Сформировать КП',
          styles: {
            color: '#fff',
            'background-color': '#2F6BFF'
          },
          icon: 'md-description',
          clickEventName: 'kp-btn:click',
          position: ['first'],
          name: 'kp-btn-1'
        }];
      }
    });

    if (
      initResult &&
      typeof initResult.catch === 'function'
    ) {
      initResult.catch(function (error) {
        log('ошибка init', error);
      });
    }

    log('виджет зарегистрирован');
  } catch (error) {
    log(
      'ошибка регистрации кнопки',
      error
    );
  }

  /*
   * Обработка клика по кнопке.
   */
  window.addEventListener(
    'message',
    function (event) {
      if (
        event.data &&
        event.data.type === 'kp-btn:click'
      ) {
        log('кнопка нажата');
        openConstructor();
      }
    },
    false
  );
})();
</script>

</body>
</html>
