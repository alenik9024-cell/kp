<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>КП — виджет</title>
  <script src="https://cdn.saas-support.com/crm_assets/build/widget/js/envycrmwidget.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 12px;
      box-sizing: border-box;
      background: #fff;
      color: #2b2b2b;
      font: 13px/1.5 -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    #kpBtn {
      display: block;
      width: 100%;
      padding: 13px 16px;
      border: 0;
      border-radius: 10px;
      background: #2F6BFF;
      color: #fff;
      font: 600 14px/1 inherit;
      cursor: pointer;
    }
    #kpBtn:hover { background: #1f57e0; }
    #st { margin-top: 10px; font-size: 12px; line-height: 1.6; color: #666; }
    .ok { color: #0a7d33; font-weight: 600; }
    .err { color: #c0392b; font-weight: 600; }
  </style>
</head>
<body>
  <button id="kpBtn" type="button">📄 Сформировать КП</button>
  <div id="st">запуск…</div>

  <script>
  (function () {
    'use strict';

    var CONSTRUCTOR_URL = 'https://alenik9024-cell.github.io/kp/kp.html';

    var st = document.getElementById('st');
    var btn = document.getElementById('kpBtn');

    var dealId = '', clientId = '';
    var registered = false, numberWritten = false, fieldId = '', state = '—';

    function log(m, d) {
      try { console.log('[KP] ' + m, d || ''); } catch (e) {}
    }

    function W() {
      return window.EnvyCrmWidget;
    }

    function proposalNumber() {
      if (!dealId) return '';
      var d = new Date();
      var p = function (n) { return (n < 10 ? '0' : '') + n; };
      return dealId + '/' + p(d.getDate()) + '/' + p(d.getMonth() + 1);
    }

    /* Получение ID сделки */
    function readIds() {
      return new Promise(function (res) {
        var w = W();
        if (!w || typeof w.getDeal !== 'function') { res(); return; }
        try {
          var r = w.getDeal();
          if (r && typeof r.then === 'function') {
            r.then(function (d) {
              d = d || {};
              dealId = String(d.id || d.deal_id || dealId || '');
              clientId = String(d.client_id || d.clientId || clientId || '');
              log('getDeal', { deal_id: dealId, client_id: clientId });
              res();
            }).catch(function (e) { log('getDeal ошибка', e); res(); });
          } else res();
        } catch (e) { res(); }
      });
    }

    function findFieldId(data, wanted) {
      var found = '';
      (function walk(o) {
        if (found || !o || typeof o !== 'object') return;
        if (Array.isArray(o)) { o.forEach(walk); return; }

        var nm = String(o.name || o.title || o.label || o.name_id || '').toLowerCase().trim();
        var iid = o.input_id || o.id;
        if (nm && iid) {
          for (var i = 0; i < wanted.length; i++) {
            if (nm === wanted[i]) { found = String(iid); return; }
          }
        }
        Object.keys(o).forEach(function (k) { walk(o[k]); });
      })(data);
      return found;
    }

    function writeNumber() {
      if (numberWritten || !dealId) return;
      var w = W();
      if (!w || typeof w.getDealValues !== 'function') { state = 'нет getDealValues'; return; }

      w.getDealValues().then(function (data) {
        fieldId = findFieldId(data, ['кп', 'номер кп', 'номер кп (кп)', 'коммерческое предложение']);
        if (!fieldId) { state = 'поле КП не найдено'; return; }

        if (typeof w.changeDealValue !== 'function') { state = 'нет changeDealValue'; return; }

        return w.changeDealValue({ input_id: fieldId, value: proposalNumber() })
          .then(function () {
            numberWritten = true;
            state = 'номер записан: ' + proposalNumber();
            show();
          });
      }).catch(function (e) { state = 'ошибка записи: ' + e; show(); });
    }

    function openWindow() {
      readIds().then(function () {
        writeNumber();
        var url = CONSTRUCTOR_URL +
          (dealId ? '?deal_id=' + encodeURIComponent(dealId) : '?') +
          (clientId ? '&client_id=' + encodeURIComponent(clientId) : '');
        var pNum = proposalNumber();
        if (pNum) url += '&num=' + encodeURIComponent(pNum);

        log('открываю КП', url);
        window.open(url, '_blank');
      });
    }

    function show() {
      if (!st) return;
      st.innerHTML = (dealId ? 'сделка <b>' + dealId + '</b>' : 'сделка не определена') +
        '<br>кнопка: ' + (registered ? '<span class="ok">внедрена</span>' : '<span class="err">ожидание</span>') +
        '<br>статус: ' + state;
    }

    if (btn) {
      btn.onclick = openWindow;
    }

    window.addEventListener('message', function (e) {
      if (!e || !e.data) return;
      if (e.data.type === 'kp-btn:click') {
        log('клик по кнопке Envy');
        openWindow();
      }
    }, false);

    /* РЕГИСТРАЦИЯ СО ВСЕМИ ОБЯЗАТЕЛЬНЫМИ ПОЛЯМИ ПО ДОКУМЕНТАЦИИ */
    function register() {
      if (registered) return;
      var w = W();
      if (!w || typeof w.init !== 'function') {
        setTimeout(register, 150);
        return;
      }
      try {
        w.init({
          'deal-btn': [
            {
              name: 'kp-btn-final-32',
              title: 'Сформировать КП',
              icon: 'md-description',
              clickEventName: 'kp-btn:click',
              position: ['first'],
              styles: {
                'color': '#ffffff',
                'background-color': '#2F6BFF'
              }
            }
          ]
        });
        registered = true;
        state = 'кнопка зарегистрирована';
        log('кнопка зарегистрирована');
        show();
      } catch (err) {
        log('повтор init: ' + err);
        setTimeout(register, 250);
      }
    }

    readIds().then(function () {
      show();
      register();
    });
  })();
  </script>
</body>
</html>
