<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>КП — виджет EnvyCRM</title>
</head>
<body>
<!-- библиотека виджета: только этот адрес -->
<script src="https://cdn.saas-support.com/crm_assets/build/widget/js/envycrmwidget.min.js"></script>
<script>
/* ===== Виджет КП для EnvyCRM. Версия 3 ===== */
(function () {
  'use strict';

  var VERSION = 'v3';
  var CTOR = 'https://alenik9024-cell.github.io/kp/kp.html';

  function log() {
    var a = ['[KP ' + VERSION + ']'].concat([].slice.call(arguments));
    console.log.apply(console, a);
  }

  /* ждём библиотеку (она могла подключиться с задержкой) */
  function waitW(cb, n) {
    n = n || 0;
    if (window.EnvyCrmWidget) return cb(window.EnvyCrmWidget);
    if (n > 100) { log('EnvyCrmWidget не загрузилась — проверьте адрес скрипта'); return; }
    setTimeout(function () { waitW(cb, n + 1); }, 100);
  }

  waitW(function (w) {
    if (w.__kpDone) { log('уже зарегистрирован'); return; }
    w.__kpDone = true;
    log('библиотека найдена');

    /* ---------- ID текущей сделки ---------- */
    function dealId() {
      return w.getDeal()
        .then(function (d) {
          d = d || {};
          return d.id || d.deal_id || (d.result && (d.result.id || d.result.deal_id)) || null;
        })
        .catch(function (e) { log('getDeal:', e && e.message); return null; });
    }

    /* ---------- открыть конструктор ---------- */
    function openCtor(id) {
      var u = CTOR + '?embed=1&full=1' + (id ? '&deal_id=' + encodeURIComponent(id) : '');
      log('открываю:', u);

      var html = '<iframe src="' + u + '" '
        + 'style="width:100%;height:calc(100vh - 90px);min-height:520px;border:0;border-radius:12px" '
        + 'allowfullscreen></iframe>';

      /* openPage — полноэкранный режим (по документации предпочтителен для больших форм) */
      if (w.openPage) {
        w.openPage({ content: html })
          .then(function () { log('конструктор открыт (openPage)'); })
          .catch(function (e) {
            log('openPage не сработал:', e && e.message, '— пробую modal');
            if (w.openModal) w.openModal({ title: 'Конструктор КП', content: html, width: 1150 });
          });
      } else if (w.openModal) {
        w.openModal({ title: 'Конструктор КП', content: html, width: 1150 });
      } else {
        log('открыть нечем. Адрес: ' + u);
      }
    }

    /* ---------- клики по кнопкам CRM ---------- */
    window.addEventListener('message', function (event) {
      var t = event.data && event.data.type;
      if (!t) return;

      if (t === 'kp-btn:click' || t === 'kp-side:click') {
        log('клик: ' + t, event.data);
        var id = event.data.deal_id || event.data.id || event.data.dealId || null;
        if (id) return openCtor(id);
        dealId().then(function (x) { openCtor(x); });
      }
    }, false);

    /* ---------- регистрация кнопок ---------- */
    w.init({
      'deal-btn': function () {
        return [{
          title: 'Сформировать КП',
          styles: { 'color': '#fff', 'background-color': '#2F6BFF' },
          icon: 'md-description',
          clickEventName: 'kp-btn:click',
          position: ['first'],
          name: 'kp-btn-1'
        }];
      },
      'sidebar-item': function () {
        return [{
          title: 'Конструктор КП',
          icon: 'md-description',
          clickEventName: 'kp-side:click',
          position: ['after-section-2'],
          name: 'kp-sidebar-1'
        }];
      }
    });

    /* ---------- проверка прав (в журнал) ---------- */
    if (w.checkPermissions) {
      w.checkPermissions([
        { permission: 'allow_change_deal_fields_value' },
        { permission: 'allow_change_client_fields_value' },
        { permission: 'allow_show_full_client_phone' }
      ]).then(function (p) { log('права:', p); })
       .catch(function (e) { log('права не получены:', e && e.message); });
    }

    log('виджет зарегистрирован');
  });
})();
</script>
</body>
</html>
