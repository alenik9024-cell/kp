<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>КП — виджет</title>
  <style>
    body {
      margin: 0;
      padding: 12px;
      box-sizing: border-box;
      background: #fff;
      color: #2b2b2b;
      font: 13px/1.5 -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    #kpBtn {
      display: block;
      width: 100%;
      padding: 13px 16px;
      border: 0;
      border-radius: 10px;
      background: #2F6BFF;
      color: #fff;
      font: 600 14px/1 inherit;
      cursor: pointer;
    }
    #kpBtn:hover {
      background: #1f57e0;
    }
    #st {
      margin-top: 10px;
      font-size: 12px;
      line-height: 1.6;
      color: #666;
      word-break: break-all;
    }
    .ok { color: #0a7d33; font-weight: 600; }
    .err { color: #c0392b; font-weight: 600; }
  </style>
  <script src="https://cdn.saas-support.com/crm_assets/build/widget/js/envycrmwidget.min.js"></script>
</head>
<body>
  <button id="kpBtn" type="button">📄 Сформировать КП</button>
  <div id="st">запуск…</div>

  <script>
  (function () {
    'use strict';

    var VERSION = 'v57';
    var CONSTRUCTOR_URL = 'https://alenik9024-cell.github.io/kp/kp-constructor.html';

    var st = document.getElementById('st');
    var btn = document.getElementById('kpBtn');

    var dealId = '', clientId = '';
    var registered = false, numberWritten = false, fieldId = '';
    var state = '—';

    function log(m, d) {
      try { console.log('[KP ' + VERSION + '] ' + m, d || ''); } catch (e) {}
    }

    function W() {
      return window.EnvyCrmWidget;
    }

    function show() {
      if (!st) return;
      st.innerHTML = 'v' + VERSION + ' | ' +
        (dealId ? 'сделка <b>' + dealId + '</b>' : 'сделка не определена') +
        '<br>кнопка: ' + (registered ? '<span class="ok">внедрена</span>' : '<span class="err">ожидание</span>') +
        '<br>статус: ' + state;
    }

    /* Формирование номера КП: ID/ДД/ММ */
    function proposalNumber() {
      if (!dealId) return '';
      var d = new Date();
      var pad = function (n) { return (n < 10 ? '0' : '') + n; };
      return dealId + '/' + pad(d.getDate()) + '/' + pad(d.getMonth() + 1);
    }

    /* Получение ID сделки и клиента */
    function readIds() {
      return new Promise(function (resolve) {
        var w = W();
        if (!w || typeof w.getDeal !== 'function') {
          resolve();
          return;
        }
        try {
          var r = w.getDeal();
          if (r && typeof r.then === 'function') {
            r.then(function (d) {
              d = (d && d.result) ? d.result : (d || {});
              dealId = String(d.id || d.deal_id || dealId || '');
              clientId = String(d.client_id || d.clientId || clientId || '');
              log('Сделка определена', { dealId: dealId, clientId: clientId });
              resolve();
            }).catch(function (e) {
              log('Ошибка getDeal', e);
              resolve();
            });
          } else {
            resolve();
          }
        } catch (e) {
          resolve();
        }
      });
    }

    /* Поиск ID поля для номера КП */
    function findFieldId(data, wanted) {
      var found = '';
      (function walk(o) {
        if (found || !o || typeof o !== 'object') return;
        if (Array.isArray(o)) { o.forEach(walk); return; }
        var nm = String(o.name || o.title || o.label || o.name_id || '').toLowerCase().trim();
        var iid = o.input_id || o.id;
        if (nm && iid) {
          for (var i = 0; i < wanted.length; i++) {
            if (nm === wanted[i]) { found = String(iid); return; }
          }
        }
        Object.keys(o).forEach(function (k) { walk(o[k]); });
      })(data);
      return found;
    }

    /* Фоновая запись номера КП в сделку */
    function writeNumber() {
      if (numberWritten || !dealId) return;
      var w = W();
      if (!w || typeof w.getDealValues !== 'function') return;

      w.getDealValues().then(function (data) {
        fieldId = findFieldId(data, ['кп', 'номер кп', 'номер кп (кп)', 'коммерческое предложение']);
        if (!fieldId || typeof w.changeDealValue !== 'function') return;

        var pNum = proposalNumber();
        w.changeDealValue({ input_id: fieldId, value: pNum }).then(function () {
          numberWritten = true;
          state = 'номер записан: ' + pNum;
          show();
        }).catch(function () {});
      }).catch(function () {});
    }

    /* Переход в конструктор */
    function openConstructor() {
      readIds().then(function () {
        writeNumber();

        var url = CONSTRUCTOR_URL +
          (dealId ? '?deal_id=' + encodeURIComponent(dealId) : '?') +
          (clientId ? '&client_id=' + encodeURIComponent(clientId) : '');

        var pNum = proposalNumber();
        if (pNum) url += '&num=' + encodeURIComponent(pNum);

        log('Открытие конструктора', url);
        window.open(url, '_blank');
      });
    }

    if (btn) {
      btn.onclick = openConstructor;
    }

    /* Слушаем клик по внешней кнопке EnvyCRM */
    window.addEventListener('message', function (e) {
      if (!e || !e.data) return;
      if (e.data.type === 'kp-btn:click') {
        log('Клик по кнопке EnvyCRM');
        openConstructor();
      }
    }, false);

    /* Регистрация кнопки deal-btn */
    function register() {
      if (registered) return;
      var w = W();
      if (!w || typeof w.init !== 'function') {
        setTimeout(register, 200);
        return;
      }

      try {
        w.init({
          'deal-btn': [
            {
              name: 'kp-btn-final-32',
              title: 'Сформировать КП',
              icon: 'md-description',
              clickEventName: 'kp-btn:click',
              position: ['first'],
              styles: {
                'background-color': '#2F6BFF',
                'color': '#ffffff'
              }
            }
          ]
        });

        registered = true;
        state = 'кнопка зарегистрирована';
        log('Кнопка успешно внедрена в EnvyCRM');
        show();
      } catch (err) {
        state = 'ошибка w.init: ' + err;
        log('Ошибка w.init', err);
        show();
      }
    }

    // Старт
    readIds().then(function () {
      show();
      register();
    });

  })();
  </script>
</body>
</html>
