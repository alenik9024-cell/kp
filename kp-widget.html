<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>КП — виджет</title>
<script src="https://cdn.saas-support.com/crm_assets/build/widget/js/envycrmwidget.min.js"></script>
</head>
<body>
<script>
(function(){
  'use strict';
  var W = window.EnvyCrmWidget;
  if (!W){ console.log('[KP] библиотека EnvyCrmWidget не загрузилась'); return; }

  /* !!! адрес конструктора. После переноса на другой хостинг — заменить. */
  var CTOR = 'https://alenik9024-cell.github.io/kp/kp.html';

  /* блок внутри карточки. Сейчас выключен: пока файлы на github.io,
     рамка блокируется и блок остаётся пустым. После переноса — true. */
  var SHOW_BLOCK = false;

  function urlFor(dealID, extra){
    return CTOR + '?embed=1' + (dealID ? '&deal_id=' + dealID : '') + (extra ? '&' + extra : '');
  }

  var params = {};

  if (SHOW_BLOCK){
    params['before-deal-task'] = function (p) {
      return [{
        title: 'КП из сделки',
        events: ['deal::update-value', 'client::update-value'],
        content: { type:'iframe', url: urlFor(p.dealID), height: 500 }
      }];
    };
  }

  params['deal-btn'] = function () {
    return [{
      title: 'Сформировать КП',
      styles: { 'color':'#fff', 'background-color':'#2F6BFF' },
      icon: 'md-description',
      clickEventName: 'kp-btn:click',
      position: ['first'],
      name: 'kp-btn-1'
    }];
  };

  params['sidebar-item'] = function () {
    return [{
      title: 'Конструктор КП',
      icon: 'md-description',
      clickEventName: 'kp-side:click',
      position: ['after-section-2'],
      name: 'kp-side-1'
    }];
  };

  /* ---------- ловим ВСЕ сообщения, чтобы понять формат клика ---------- */
  window.addEventListener('message', function (e) {
    var d = e.data || {};
    console.log('[KP] message:', JSON.stringify(d).slice(0, 400));

    var t = String(d.type || '');
    var mine = /kp-?(btn|side)/i.test(t) || /клик/i.test(t);
    if (!mine) return;

    console.log('[KP] КЛИК ПОЛУЧЕН:', t);

    var id = d.deal_id || d.id
          || (d.options && d.options.deal_id)
          || (d.data && d.data.deal_id) || null;

    var go = function (dealId) {
      var u = urlFor(dealId, 'full=1');
      console.log('[KP] открываю:', u);

      /* 1) сначала пробуем открыть встроенной страницей CRM */
      if (W.openPage){
        W.openPage({
          content: '<div style="padding:26px;font:15px/1.5 system-ui">'
            + '<p style="margin:0 0 14px"><b>Конструктор КП</b> — откроется в новой вкладке.</p>'
            + '<button onclick="window.open(\'' + u + '\',\'_blank\')" '
            + 'style="padding:12px 20px;border:0;border-radius:9px;background:#2F6BFF;color:#fff;'
            + 'font:600 15px system-ui;cursor:pointer">Открыть конструктор КП</button>'
            + '<p style="margin:14px 0 0;color:#6B7893;font-size:13px">Если вкладка не открылась, '
            + 'скопируйте адрес: <br>' + u + '</p></div>'
        }).then(function(){ console.log('[KP] openPage ок'); })
          .catch(function(err){ console.log('[KP] openPage ошибка:', err); window.open(u, '_blank'); });
      } else {
        window.open(u, '_blank');
      }
    };

    if (id){ go(id); return; }
    if (W.getDeal){
      W.getDeal().then(function (d2) {
        go(d2 && (d2.id || d2.deal_id || (d2.result && d2.result.id)));
      }).catch(function(){ go(null); });
    } else go(null);
  }, false);

  W.init(params);
  console.log('[KP] виджет зарегистрирован. Блок в карточке:', SHOW_BLOCK ? 'вкл' : 'выкл', '· конструктор:', CTOR);
})();
</script>
</body>
</html>
