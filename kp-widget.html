<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>КП — виджет EnvyCRM</title>
</head>
<body>

<script src="https://cdn.saas-support.com/crm_assets/build/widget/js/envycrmwidget.min.js"></script>

<script>
(function () {
  'use strict';

  var VERSION = 'v21';
  var AUTO_URL = 'https://alenik9024-cell.github.io/kp/kp-auto.html?v=21';
  var STORAGE_KEY = 'kp_context_v20';

  var w = window.EnvyCrmWidget;
  var dealContext = {
    dealId: '',
    clientId: '',
    clientName: '',
    phone: ''
  };

  var dataPromise = Promise.resolve();;

  function log(message, data) {
    console.log('[KP ' + VERSION + '] ' + message, data || '');
  }

  if (!w) {
    log('EnvyCrmWidget не загрузилась');
    return;
  }

  function scalar(value) {
    if (value === null || value === undefined) {
      return '';
    }

    if (
      typeof value === 'string' ||
      typeof value === 'number'
    ) {
      return String(value).trim();
    }

    if (Array.isArray(value)) {
      for (var i = 0; i < value.length; i++) {
        var arrayValue = scalar(value[i]);

        if (arrayValue) {
          return arrayValue;
        }
      }

      return '';
    }

    if (typeof value === 'object') {
      if (value.value !== undefined) {
        return scalar(value.value);
      }

      if (value.phone !== undefined) {
        return scalar(value.phone);
      }

      if (value.name !== undefined) {
        return scalar(value.name);
      }

      if (value.result !== undefined) {
        return scalar(value.result);
      }
    }

    return '';
  }

  function getParam(params, names) {
    params = params || {};

    for (var i = 0; i < names.length; i++) {
      if (
        params[names[i]] !== undefined &&
        params[names[i]] !== null &&
        params[names[i]] !== ''
      ) {
        return String(params[names[i]]);
      }
    }

    return '';
  }

  function proposalNumber(dealId) {
    var date = new Date();

    var day = String(date.getDate()).padStart(2, '0');
    var month = String(date.getMonth() + 1).padStart(2, '0');
    var year = date.getFullYear();

    return 'КП-' + dealId + '/' + day + '.' + month + '.' + year;
  }

  function saveContext(token) {
    var context = {
      token: token,
      dealId: dealContext.dealId,
      clientId: dealContext.clientId,
      clientName: dealContext.clientName,
      phone: dealContext.phone,
      proposalNumber: proposalNumber(dealContext.dealId),
      updatedAt: Date.now()
    };

    try {
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(context)
      );

      log('контекст сохранён', context);
    } catch (error) {
      log('ошибка сохранения контекста', error);
    }
  }

  /*
   * Этот вызов выполняется в основном расширении,
   * а не во вложенном kp-auto.html.
   */
 function loadClientData() {
  var dealId = dealContext.dealId;
  var clientId = dealContext.clientId;

  if (!dealId && !clientId) {
    return Promise.reject(
      new Error('CRM не передала dealID и clientID')
    );
  }

  var apiHost = 'https://novikov.envycrm.com';
  var apiKey = '48a7f23ebf788af44686fe0fa4c9c955c4c34d7c';
  var apiBase = apiHost + '/openapi/v1';

  function post(path, body) {
    return fetch(
      apiBase +
      path +
      '?api_key=' +
      encodeURIComponent(apiKey),
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
      }
    ).then(function (response) {
      return response.text().then(function (text) {
        var data = null;

        try {
          data = JSON.parse(text);
        } catch (error) {
          data = { raw: text };
        }

        if (!response.ok) {
          throw new Error(
            'HTTP ' +
            response.status +
            ': ' +
            (data.message || text)
          );
        }

        return data;
      });
    });
  }

  function extractPhone(client) {
    var contacts = client.contacts || [];

    for (var i = 0; i < contacts.length; i++) {
      var contact = contacts[i] || {};

      var value =
        contact.value ||
        contact.phone ||
        contact.mobile_phone ||
        '';

      value = String(value || '');

      if (/\d{5,}/.test(value)) {
        return value;
      }
    }

    return '';
  }

  var clientPromise = clientId
    ? post('/client/get', {
        client_id: Number(clientId)
      })
    : Promise.resolve(null);

  var dealPromise = dealId
    ? post('/deal/get', {
        deal_id: Number(dealId)
      })
    : Promise.resolve(null);

  return Promise.all([
    clientPromise,
    dealPromise
  ]).then(function (results) {
    var clientResponse = results[0] || {};
    var dealResponse = results[1] || {};

    var client = clientResponse.result || {};
    var deal = dealResponse.result || {};

    var name =
      client.client_name ||
      client.name ||
      deal.client_name ||
      '';

    var phone =
      extractPhone(client) ||
      deal.phone ||
      deal.client_phone ||
      '';

    dealContext.clientName = String(name || '');
    dealContext.phone = String(phone || '');

    log('данные получены через OpenAPI', {
      dealId: dealId,
      clientId: clientId,
      clientName: dealContext.clientName,
      phone: dealContext.phone
    });

    return dealContext;
  });
}
  function openConstructor() { dataPromise = loadClientData();
    var token = 'kp_' + Date.now();

    saveContext(token);

    var url =
      AUTO_URL +
      '&token=' +
      encodeURIComponent(token);

    var iframe =
      '<iframe src="' + url + '" ' +
      'style="width:100%;height:calc(100vh - 60px);' +
      'min-height:650px;border:0" ' +
      'allowfullscreen></iframe>';

    log('открываю конструктор', {
      dealId: dealContext.dealId,
      clientId: dealContext.clientId
    });

    /*
     * Открываем сразу, чтобы не блокировать окно ожиданием API.
     */
    try {
      if (w.openPage) {
        var page = w.openPage({
          content: iframe
        });

        if (
          page &&
          typeof page.catch === 'function'
        ) {
          page.catch(function (error) {
            log('openPage не сработал', error);

            if (w.openModal) {
              w.openModal({
                title: 'Конструктор КП',
                content: iframe,
                width: 1150
              });
            }
          });
        }
      } else if (w.openModal) {
        w.openModal({
          title: 'Конструктор КП',
          content: iframe,
          width: 1150
        });
      } else {
        window.open(url, '_blank');
      }
    } catch (error) {
      log('ошибка открытия', error);
      window.open(url, '_blank');
    }

    /*
     * После открытия обновляем localStorage.
     * kp-auto.html увидит новые имя и телефон.
     */
    dataPromise
      .then(function () {
        saveContext(token);
      })
      .catch(function (error) {
        log('данные клиента не получены', error);
        saveContext(token);
      });
  }

  window.addEventListener(
    'message',
    function (event) {
      if (
        event.data &&
        event.data.type === 'kp-btn:click'
      ) {
        log('кнопка нажата');
        openConstructor();
      }
    },
    false
  );

  try {
    w.init({
      'deal-btn': function (params) {
        /*
         * Это правильный способ из вашего примера.
         */
        dealContext.dealId = getParam(
          params,
          ['dealID', 'deal_id', 'dealId']
        );

        dealContext.clientId = getParam(
          params,
          ['clientID', 'client_id', 'clientId']
        );

        log('параметры сделки получены из init', {
          dealId: dealContext.dealId,
          clientId: dealContext.clientId,
          params: params
        });

        /*
         * Запрашиваем значения в контексте основного расширения.
         */
        dataPromise = loadClientData();

        return [{
          title: 'Сформировать КП',
          styles: {
            color: '#fff',
            'background-color': '#2F6BFF'
          },
          icon: 'md-description',
          clickEventName: 'kp-btn:click',
          position: ['first'],
          name: 'kp-btn-1'
        }];
      }
    });

    log('виджет v20 зарегистрирован');
  } catch (error) {
    log('ошибка регистрации кнопки', error);
  }
})();
</script>

</body>
</html>
