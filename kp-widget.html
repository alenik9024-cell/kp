<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>КП — виджет EnvyCRM</title>
</head>
<body>

<script src="https://cdn.saas-support.com/crm_assets/build/widget/js/envycrmwidget.min.js"></script>

<script>
(function () {
  'use strict';

  var VERSION = 'v18';
  var AUTO_URL =
    'https://alenik9024-cell.github.io/kp/kp-auto.html?v=18';

  var STORAGE_KEY = 'kp_current_deal_context_v18';
  var w = window.EnvyCrmWidget;

  function log(message, data) {
    console.log(
      '[KP ' + VERSION + '] ' + message,
      data || ''
    );
  }

  if (!w) {
    log('EnvyCrmWidget не загрузилась');
    return;
  }

  function scalar(value) {
    if (value === null || value === undefined) {
      return '';
    }

    if (
      typeof value === 'string' ||
      typeof value === 'number'
    ) {
      return String(value).trim();
    }

    if (Array.isArray(value)) {
      for (var i = 0; i < value.length; i++) {
        var arrayValue = scalar(value[i]);

        if (arrayValue) {
          return arrayValue;
        }
      }

      return '';
    }

    if (typeof value === 'object') {
      var priorityKeys = [
        'value',
        'phone',
        'client_phone',
        'mobile_phone',
        'client_name',
        'customer_name',
        'name',
        'result',
        'data'
      ];

      for (var j = 0; j < priorityKeys.length; j++) {
        var key = priorityKeys[j];

        if (
          value[key] !== undefined &&
          value[key] !== null
        ) {
          var result = scalar(value[key]);

          if (result) {
            return result;
          }
        }
      }
    }

    return '';
  }

  function searchKey(data, keys, visited) {
    if (!data || typeof data !== 'object') {
      return '';
    }

    visited = visited || [];

    if (visited.indexOf(data) !== -1) {
      return '';
    }

    visited.push(data);

    if (Array.isArray(data)) {
      for (var i = 0; i < data.length; i++) {
        var arrayResult = searchKey(
          data[i],
          keys,
          visited
        );

        if (arrayResult) {
          return arrayResult;
        }
      }

      return '';
    }

    for (var j = 0; j < keys.length; j++) {
      var key = keys[j];

      if (
        data[key] !== undefined &&
        data[key] !== null
      ) {
        var directResult = scalar(data[key]);

        if (directResult) {
          return directResult;
        }
      }
    }

    for (var property in data) {
      if (
        !Object.prototype.hasOwnProperty.call(
          data,
          property
        )
      ) {
        continue;
      }

      if (
        data[property] &&
        typeof data[property] === 'object'
      ) {
        var nestedResult = searchKey(
          data[property],
          keys,
          visited
        );

        if (nestedResult) {
          return nestedResult;
        }
      }
    }

    return '';
  }

  function searchInputValue(data, inputId, visited) {
    if (!data || typeof data !== 'object') {
      return '';
    }

    visited = visited || [];

    if (visited.indexOf(data) !== -1) {
      return '';
    }

    visited.push(data);

    if (
      data.input_id !== undefined &&
      String(data.input_id) === String(inputId)
    ) {
      return scalar(data.value);
    }

    if (
      data.inputId !== undefined &&
      String(data.inputId) === String(inputId)
    ) {
      return scalar(data.value);
    }

    if (Array.isArray(data)) {
      for (var i = 0; i < data.length; i++) {
        var arrayValue = searchInputValue(
          data[i],
          inputId,
          visited
        );

        if (arrayValue) {
          return arrayValue;
        }
      }

      return '';
    }

    for (var key in data) {
      if (
        !Object.prototype.hasOwnProperty.call(
          data,
          key
        )
      ) {
        continue;
      }

      var nestedValue = searchInputValue(
        data[key],
        inputId,
        visited
      );

      if (nestedValue) {
        return nestedValue;
      }
    }

    return '';
  }

  function getDealId(deal) {
    var id = searchKey(
      deal,
      ['deal_id', 'dealId']
    );

    if (id) {
      return id;
    }

    return searchKey(deal, ['id']);
  }

  function getClientName(deal) {
    var name = searchKey(
      deal,
      [
        'client_name',
        'clientName',
        'customer_name',
        'customerName',
        'name_client'
      ]
    );

    if (name) {
      return name;
    }

    /*
     * Запасной вариант: имя клиента как системное поле 1001.
     */
    return '';
  }

  function getPhoneFromDeal(deal) {
    var phone = searchKey(
      deal,
      [
        'client_phone',
        'mobile_phone',
        'phone'
      ]
    );

    if (phone && /\d{5,}/.test(phone)) {
      return phone;
    }

    var contacts = searchKey(
      deal,
      ['contacts']
    );

    if (contacts && /\d{5,}/.test(contacts)) {
      return contacts;
    }

    return '';
  }

  function getClientField(inputId) {
    if (w.getClientValue) {
      return w.getClientValue({
        input_id: inputId,
        type: 'service'
      })
        .then(function (data) {
          var value = scalar(data);

          if (value) {
            return value;
          }

          if (w.getClientValues) {
            return w.getClientValues()
              .then(function (allValues) {
                return searchInputValue(
                  allValues,
                  inputId
                );
              });
          }

          return '';
        })
        .catch(function () {
          return '';
        });
    }

    if (w.getClientValues) {
      return w.getClientValues()
        .then(function (allValues) {
          return searchInputValue(
            allValues,
            inputId
          );
        })
        .catch(function () {
          return '';
        });
    }

    return Promise.resolve('');
  }

  function makeProposalNumber(dealId) {
    var date = new Date();

    var day = String(date.getDate())
      .padStart(2, '0');

    var month = String(date.getMonth() + 1)
      .padStart(2, '0');

    var year = date.getFullYear();

    return 'КП-' + dealId + '/' +
      day + '.' + month + '.' + year;
  }

  function saveContext(context) {
    try {
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(context)
      );

      log('контекст сохранён', context);
    } catch (error) {
      log('ошибка сохранения контекста', error);
    }
  }

  function publishDealContext(token) {
    return w.getDeal()
      .then(function (deal) {
        log('полный ответ getDeal', deal);

        var dealId = getDealId(deal);
        var clientName = getClientName(deal);
        var phone = getPhoneFromDeal(deal);

        var namePromise = clientName
          ? Promise.resolve(clientName)
          : getClientField(1001);

        var phonePromise = phone
          ? Promise.resolve(phone)
          : getClientField(1002);

        return Promise.all([
          namePromise,
          phonePromise
        ]).then(function (values) {
          var context = {
            token: token,
            dealId: dealId || '',
            clientName: values[0] || '',
            phone: values[1] || '',
            proposalNumber: makeProposalNumber(
              dealId || ''
            ),
            updatedAt: Date.now()
          };

          saveContext(context);

          return context;
        });
      })
      .catch(function (error) {
        log('ошибка получения сделки', error);
        throw error;
      });
  }

  function openConstructor() {
    var token = 'kp_' + Date.now();

    /*
     * Сначала создаём контекст с токеном,
     * чтобы автоматический конструктор открылся сразу.
     */
    saveContext({
      token: token,
      dealId: '',
      clientName: '',
      phone: '',
      proposalNumber: '',
      updatedAt: Date.now()
    });

    var url =
      AUTO_URL +
      '&token=' +
      encodeURIComponent(token);

    var iframe =
      '<iframe src="' + url + '" ' +
      'style="width:100%;height:calc(100vh - 60px);' +
      'min-height:650px;border:0" ' +
      'allowfullscreen></iframe>';

    log('открываю автоматический конструктор');

    try {
      if (w.openPage) {
        var page = w.openPage({
          content: iframe
        });

        if (
          page &&
          typeof page.catch === 'function'
        ) {
          page.catch(function (error) {
            log('openPage не сработал', error);

            if (w.openModal) {
              w.openModal({
                title: 'Конструктор КП',
                content: iframe,
                width: 1150
              });
            }
          });
        }
      } else if (w.openModal) {
        w.openModal({
          title: 'Конструктор КП',
          content: iframe,
          width: 1150
        });
      } else {
        window.open(url, '_blank');
      }
    } catch (error) {
      log('ошибка открытия', error);
      window.open(url, '_blank');
    }

    /*
     * Получаем сделку уже после открытия окна.
     */
    publishDealContext(token)
      .catch(function () {});
  }

  window.addEventListener(
    'message',
    function (event) {
      if (
        event.data &&
        event.data.type === 'kp-btn:click'
      ) {
        log('кнопка нажата');
        openConstructor();
      }
    },
    false
  );

  /*
   * Убираем старые пункты бокового меню.
   */
  if (w.closeWidget) {
    try {
      w.closeWidget({
        type: 'sidebar-item',
        name: 'kp-sidebar-1'
      });
    } catch (e) {}

    try {
      w.closeWidget({
        type: 'sidebar-item',
        name: 'kp-side-1'
      });
    } catch (e) {}
  }

  /*
   * Оставляем только кнопку в карточке сделки.
   */
  try {
    var initResult = w.init({
      'deal-btn': function () {
        return [{
          title: 'Сформировать КП',
          styles: {
            color: '#fff',
            'background-color': '#2F6BFF'
          },
          icon: 'md-description',
          clickEventName: 'kp-btn:click',
          position: ['first'],
          name: 'kp-btn-1'
        }];
      }
    });

    if (
      initResult &&
      typeof initResult.catch === 'function'
    ) {
      initResult.catch(function (error) {
        log('ошибка init', error);
      });
    }

    log('виджет v18 зарегистрирован');
  } catch (error) {
    log('ошибка регистрации кнопки', error);
  }
})();
</script>

</body>
</html>
