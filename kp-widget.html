<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>КП — виджет</title>
  <style>
    body {
      margin: 0;
      padding: 12px;
      box-sizing: border-box;
      background: #fff;
      color: #2b2b2b;
      font: 13px/1.5 -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    #kpBtn {
      display: block;
      width: 100%;
      padding: 13px 16px;
      border: 0;
      border-radius: 10px;
      background: #2F6BFF;
      color: #fff;
      font: 600 14px/1 inherit;
      cursor: pointer;
    }
    #kpBtn:hover { background: #1f57e0; }
    #st { margin-top: 10px; font-size: 12px; line-height: 1.6; color: #666; }
    .ok { color: #0a7d33; font-weight: 600; }
    .err { color: #c0392b; font-weight: 600; }
  </style>
  <script src="https://cdn.saas-support.com/crm_assets/build/widget/js/envycrmwidget.min.js"></script>
</head>
<body>
  <button id="kpBtn" type="button">📄 Сформировать КП</button>
  <div id="st">запуск…</div>

  <script>
  (function () {
    'use strict';

    var VERSION = 'v70';
    var CONSTRUCTOR_URL = 'https://alenik9024-cell.github.io/kp/kp.html';

    var st = document.getElementById('st');
    var btn = document.getElementById('kpBtn');

    var dealId = '', clientId = '';
    var registered = false, numberWritten = false;

    function log(m, d) {
      try { console.log('[KP ' + VERSION + '] ' + m, d || ''); } catch (e) {}
    }

    function W() {
      return window.EnvyCrmWidget;
    }

    /* Извлечение ID из любых источников */
    function extractIds(src) {
      src = src || {};
      var d = src.deal_id || src.dealId || src.dealID || (src.deal && (src.deal.id || src.deal.deal_id));
      var c = src.client_id || src.clientId || src.clientID || (src.deal && (src.deal.client_id || src.deal.clientId));
      if (d && !dealId) dealId = String(d);
      if (c && !clientId) clientId = String(c);

      try {
        var sp = new URLSearchParams(window.location.search);
        if (!dealId && sp.get('deal_id')) dealId = sp.get('deal_id');
        if (!clientId && sp.get('client_id')) clientId = sp.get('client_id');
      } catch (e) {}
    }

    extractIds();

    function proposalNumber() {
      if (!dealId) return '';
      var d = new Date();
      var pad = function (n) { return (n < 10 ? '0' : '') + n; };
      return dealId + '/' + pad(d.getDate()) + '/' + pad(d.getMonth() + 1);
    }

    function findFieldId(data, wanted) {
      var found = '';
      (function walk(o) {
        if (found || !o || typeof o !== 'object') return;
        if (Array.isArray(o)) { o.forEach(walk); return; }
        var nm = String(o.name || o.title || o.label || o.name_id || '').toLowerCase().trim();
        var iid = o.input_id || o.id;
        if (nm && iid) {
          for (var i = 0; i < wanted.length; i++) {
            if (nm === wanted[i]) { found = String(iid); return; }
          }
        }
        Object.keys(o).forEach(function (k) { walk(o[k]); });
      })(data);
      return found;
    }

    function writeNumber() {
      if (numberWritten || !dealId) return;
      var w = W();
      if (!w || typeof w.getDealValues !== 'function') return;

      w.getDealValues().then(function (data) {
        var fid = findFieldId(data, ['кп', 'номер кп', 'номер кп (кп)', 'коммерческое предложение']);
        if (!fid || typeof w.changeDealValue !== 'function') return;

        w.changeDealValue({ input_id: fid, value: proposalNumber() }).then(function () {
          numberWritten = true;
        }).catch(function () {});
      }).catch(function () {});
    }

    function openWindow() {
      writeNumber();
      var url = CONSTRUCTOR_URL +
        (dealId ? '?deal_id=' + encodeURIComponent(dealId) : '?') +
        (clientId ? '&client_id=' + encodeURIComponent(clientId) : '');
      var pNum = proposalNumber();
      if (pNum) url += '&num=' + encodeURIComponent(pNum);

      log('Открытие КП: ' + url);
      window.open(url, '_blank');
    }

    if (btn) {
      btn.onclick = function () {
        extractIds();
        openWindow();
      };
    }

    /* Слушаем клик по кнопке из CRM */
    window.addEventListener('message', function (e) {
      if (!e || !e.data) return;
      if (e.data.type === 'kp-btn:click') {
        log('Клик по кнопке EnvyCRM', e.data);
        extractIds(e.data);
        openWindow();
      }
    }, false);

    /* РЕГИСТРАЦИЯ КНОПКИ — ЗАПУСКАЕТСЯ СРАЗУ, БЕЗ ОЖИДАНИЯ */
    function register() {
      if (registered) return;
      var w = W();
      if (!w || typeof w.init !== 'function') {
        setTimeout(register, 80);
        return;
      }
      try {
        w.init({
          'deal-btn': [
            {
              name: 'kp-btn-final-32',
              title: 'Сформировать КП',
              icon: 'md-description',
              clickEventName: 'kp-btn:click',
              position: ['first']
            }
          ]
        });
        registered = true;
        log('Кнопка успешно зарегистрирована в CRM');
        if (st) st.innerHTML = 'v' + VERSION + ' | <span class="ok">кнопка активна</span>';
      } catch (err) {
        log('Ошибка w.init: ' + err);
        setTimeout(register, 200);
      }
    }

    register();
  })();
  </script>
</body>
</html>
