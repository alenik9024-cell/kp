<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>КП — виджет EnvyCRM</title>
</head>
<body>

<script src="https://cdn.saas-support.com/crm_assets/build/widget/js/envycrmwidget.min.js"></script>

<script>
(function () {
  'use strict';

  var VERSION = 'v16';
  var AUTO_URL = 'https://alenik9024-cell.github.io/kp/kp-auto.html';
  var STORAGE_KEY = 'kp_current_deal_context';

  var w = window.EnvyCrmWidget;

  function log(message, data) {
    console.log('[KP ' + VERSION + '] ' + message, data || '');
  }

  if (!w) {
    log('EnvyCrmWidget не загрузилась');
    return;
  }

  function scalar(value) {
    if (value === null || value === undefined) {
      return '';
    }

    if (typeof value === 'string' || typeof value === 'number') {
      return String(value).trim();
    }

    if (Array.isArray(value)) {
      for (var i = 0; i < value.length; i++) {
        var item = scalar(value[i]);

        if (item) {
          return item;
        }
      }

      return '';
    }

    if (typeof value === 'object') {
      var keys = [
        'value',
        'phone',
        'client_phone',
        'mobile_phone',
        'client_name',
        'customer_name',
        'name',
        'result'
      ];

      for (var j = 0; j < keys.length; j++) {
        if (value[keys[j]] !== undefined && value[keys[j]] !== null) {
          var result = scalar(value[keys[j]]);

          if (result) {
            return result;
          }
        }
      }
    }

    return '';
  }

  function findByInputId(data, inputId, visited) {
    if (!data || typeof data !== 'object') {
      return '';
    }

    visited = visited || [];

    if (visited.indexOf(data) !== -1) {
      return '';
    }

    visited.push(data);

    if (
      data.input_id !== undefined &&
      String(data.input_id) === String(inputId)
    ) {
      return scalar(data.value);
    }

    if (
      data.id !== undefined &&
      String(data.id) === String(inputId) &&
      data.value !== undefined
    ) {
      return scalar(data.value);
    }

    if (Array.isArray(data)) {
      for (var i = 0; i < data.length; i++) {
        var arrayResult = findByInputId(
          data[i],
          inputId,
          visited
        );

        if (arrayResult) {
          return arrayResult;
        }
      }

      return '';
    }

    for (var key in data) {
      if (!Object.prototype.hasOwnProperty.call(data, key)) {
        continue;
      }

      var nestedResult = findByInputId(
        data[key],
        inputId,
        visited
      );

      if (nestedResult) {
        return nestedResult;
      }
    }

    return '';
  }

  function getDealObject(deal) {
    if (!deal || typeof deal !== 'object') {
      return {};
    }

    if (deal.result && typeof deal.result === 'object') {
      return deal.result;
    }

    if (deal.deal && typeof deal.deal === 'object') {
      return deal.deal;
    }

    return deal;
  }

  function getDealId(deal) {
    var d = getDealObject(deal);

    return String(
      d.id ||
      d.deal_id ||
      (d.deal && d.deal.id) ||
      ''
    );
  }

  function getNameFromDeal(deal) {
    var d = getDealObject(deal);

    var name = scalar(
      d.client_name ||
      d.clientName ||
      d.customer_name ||
      d.name_client
    );

    if (name) {
      return name;
    }

    if (d.client && typeof d.client === 'object') {
      return scalar(
        d.client.client_name ||
        d.client.name ||
        d.client.name_client
      );
    }

    return '';
  }

  function getPhoneFromDeal(deal) {
    var d = getDealObject(deal);

    var phone = scalar(
      d.phone ||
      d.client_phone ||
      d.mobile_phone
    );

    if (phone && /\d{5,}/.test(phone)) {
      return phone;
    }

    var contacts = d.contacts || [];

    for (var i = 0; i < contacts.length; i++) {
      phone = scalar(contacts[i]);

      if (phone && /\d{5,}/.test(phone)) {
        return phone;
      }
    }

    return '';
  }

  function clientValue(inputId) {
    if (w.getClientValue) {
      return w.getClientValue({
        input_id: inputId,
        type: 'service'
      }).then(function (data) {
        return scalar(data);
      }).catch(function () {
        return '';
      });
    }

    if (w.getClientValues) {
      return w.getClientValues().then(function (data) {
        return findByInputId(data, inputId);
      }).catch(function () {
        return '';
      });
    }

    return Promise.resolve('');
  }

  function proposalNumber(dealId) {
    var d = new Date();

    var day = String(d.getDate()).padStart(2, '0');
    var month = String(d.getMonth() + 1).padStart(2, '0');
    var year = d.getFullYear();

    return 'КП-' + dealId + '/' + day + '.' + month + '.' + year;
  }

  function saveContext(context) {
    try {
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(context)
      );

      log('контекст сохранён', context);
    } catch (error) {
      log('ошибка localStorage', error);
    }
  }

  function getContext() {
    if (!w.getDeal) {
      return Promise.reject(new Error('getDeal недоступен'));
    }

    return w.getDeal().then(function (deal) {
      var dealId = getDealId(deal);
      var name = getNameFromDeal(deal);
      var phone = getPhoneFromDeal(deal);

      var namePromise = name
        ? Promise.resolve(name)
        : clientValue(1001);

      var phonePromise = phone
        ? Promise.resolve(phone)
        : clientValue(1002);

      return Promise.all([
        namePromise,
        phonePromise
      ]).then(function (values) {
        return {
          token: '',
          dealId: dealId,
          clientName: values[0] || '',
          phone: values[1] || '',
          proposalNumber: proposalNumber(dealId),
          updatedAt: Date.now()
        };
      });
    });
  }

  function openConstructor() {
    var token = 'kp_' + Date.now();

    saveContext({
      token: token,
      dealId: '',
      clientName: '',
      phone: '',
      proposalNumber: '',
      updatedAt: Date.now()
    });

    var url =
      AUTO_URL +
      '?token=' +
      encodeURIComponent(token);

    var iframe =
      '<iframe src="' + url + '" ' +
      'style="width:100%;height:calc(100vh - 60px);min-height:650px;border:0" ' +
      'allowfullscreen></iframe>';

    /*
     * Открываем сразу.
     */
    try {
      if (w.openPage) {
        var page = w.openPage({
          content: iframe
        });

        if (page && typeof page.catch === 'function') {
          page.catch(function (error) {
            log('openPage не сработал', error);

            if (w.openModal) {
              w.openModal({
                title: 'Конструктор КП',
                content: iframe,
                width: 1150
              });
            }
          });
        }
      } else if (w.openModal) {
        w.openModal({
          title: 'Конструктор КП',
          content: iframe,
          width: 1150
        });
      } else {
        window.open(url, '_blank');
      }
    } catch (error) {
      log('ошибка открытия', error);
      window.open(url, '_blank');
    }

    /*
     * Получаем данные текущей сделки после открытия.
     */
    getContext()
      .then(function (context) {
        context.token = token;
        saveContext(context);
      })
      .catch(function (error) {
        log('данные сделки не получены', error);
      });
  }

  window.addEventListener('message', function (event) {
    var type = event.data && event.data.type;

    if (type !== 'kp-btn:click') {
      return;
    }

    log('кнопка нажата');
    openConstructor();
  }, false);

  /*
   * Удаляем старые пункты бокового меню.
   */
  if (w.closeWidget) {
    try {
      w.closeWidget({
        type: 'sidebar-item',
        name: 'kp-sidebar-1'
      });
    } catch (e) {}

    try {
      w.closeWidget({
        type: 'sidebar-item',
        name: 'kp-side-1'
      });
    } catch (e) {}
  }

  /*
   * Регистрируем только одну кнопку в карточке сделки.
   */
  try {
    w.init({
      'deal-btn': function () {
        return [{
          title: 'Сформировать КП',
          styles: {
            color: '#fff',
            'background-color': '#2F6BFF'
          },
          icon: 'md-description',
          clickEventName: 'kp-btn:click',
          position: ['first'],
          name: 'kp-btn-1'
        }];
      }
    });

    log('кнопка зарегистрирована');
  } catch (error) {
    log('ошибка регистрации', error);
  }
})();
</script>

</body>
</html>
