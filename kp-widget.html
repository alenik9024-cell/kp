<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Генератор КП</title>
</head>
<body>

<script src="https://cdn.saas-support.com/crm_assets/build/widget/js/envycrmwidget.min.js"></script>

<script>
(function () {
  'use strict';

  var VERSION = 'v26';

  var AUTO_URL =
    'https://alenik9024-cell.github.io/kp/kp-auto.html?v=26';

  var widget = null;
  var dealId = '';
  var clientId = '';

  function log(message, data) {
    console.log(
      '[KP ' + VERSION + '] ' + message,
      data || ''
    );
  }

  function getParam(params, names) {
    params = params || {};

    for (var i = 0; i < names.length; i++) {
      if (
        params[names[i]] !== undefined &&
        params[names[i]] !== null &&
        params[names[i]] !== ''
      ) {
        return String(params[names[i]]);
      }
    }

    return '';
  }

  function openConstructor() {
    var url =
      AUTO_URL +
      '&deal_id=' +
      encodeURIComponent(dealId) +
      '&client_id=' +
      encodeURIComponent(clientId);

    var html =
      '<iframe src="' + url + '"' +
      ' style="width:100%;height:calc(100vh - 60px);' +
      'min-height:650px;border:0"' +
      ' allowfullscreen></iframe>';

    log('открываю kp-auto.html', {
      dealId: dealId,
      clientId: clientId
    });

    try {
      if (
        widget &&
        typeof widget.openPage === 'function'
      ) {
        widget.openPage({
          content: html
        }).catch(function (error) {
          log('openPage не сработал', error);

          if (
            widget &&
            typeof widget.openModal === 'function'
          ) {
            widget.openModal({
              title: 'Конструктор КП',
              content: html,
              width: 1150
            });
          }
        });

        return;
      }

      if (
        widget &&
        typeof widget.openModal === 'function'
      ) {
        widget.openModal({
          title: 'Конструктор КП',
          content: html,
          width: 1150
        });

        return;
      }

      window.open(url, '_blank');

    } catch (error) {
      log('ошибка открытия', error);
      window.open(url, '_blank');
    }
  }

  function register() {
    widget = window.EnvyCrmWidget;

    if (!widget) {
      log('EnvyCrmWidget не найдена');
      return;
    }

    log('библиотека найдена');

    window.addEventListener(
      'message',
      function (event) {
        if (
          event.data &&
          event.data.type === 'kp-btn:click'
        ) {
          log('кнопка нажата');
          openConstructor();
        }
      },
      false
    );

    try {
      widget.init({
        'deal-btn': function (params) {
          dealId = getParam(
            params,
            ['dealID', 'deal_id', 'dealId']
          );

          clientId = getParam(
            params,
            ['clientID', 'client_id', 'clientId']
          );

          log('параметры сделки получены', {
            dealId: dealId,
            clientId: clientId
          });

          return [{
            title: 'Сформировать КП',
            styles: {
              color: '#fff',
              'background-color': '#2F6BFF'
            },
            icon: 'md-description',
            clickEventName: 'kp-btn:click',
            position: ['first'],
            name: 'kp-btn-1'
          }];
        }
      });

      log('кнопка зарегистрирована');
    } catch (error) {
      log('ошибка регистрации', error);
    }
  }

  function waitForLibrary(attempt) {
    attempt = attempt || 0;

    if (window.EnvyCrmWidget) {
      register();
      return;
    }

    if (attempt >= 100) {
      log('EnvyCrmWidget не загрузилась');
      return;
    }

    setTimeout(function () {
      waitForLibrary(attempt + 1);
    }, 100);
  }

  log('kp-widget.html запущен');
  waitForLibrary(0);
})();
</script>

</body>
</html>
