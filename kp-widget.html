<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>КП — расширение EnvyCRM</title>
</head>
<body>

<script src="https://cdn.saas-support.com/crm_assets/build/widget/js/envycrmwidget.min.js"></script>

<script>
(function () {
  'use strict';

  var VERSION = 'v10';
  var CTOR = 'https://alenik9024-cell.github.io/kp/kp.html';

  function log(message, data) {
    console.log('[KP ' + VERSION + '] ' + message, data || '');
  }

  var w = window.EnvyCrmWidget;

  if (!w) {
    log('EnvyCrmWidget не загрузилась');
    return;
  }

  /*
   * Открываем конструктор сразу.
   * Не вызываем getDeal до openPage:
   * иначе CRM теряет контекст клика.
   */
  function openConstructor() {
    var url = CTOR + '?embed=1&full=1';

    var content =
      '<iframe ' +
      'src="' + url + '" ' +
      'style="width:100%;height:calc(100vh - 70px);min-height:600px;border:0" ' +
      'allowfullscreen>' +
      '</iframe>';

    log('клик получен, открываю конструктор сразу');

    if (w.openPage) {
      try {
        var page = w.openPage({
          content: content
        });

        if (page && typeof page.catch === 'function') {
          page.catch(function (error) {
            log('openPage не сработал', error);

            if (w.openModal) {
              w.openModal({
                title: 'Конструктор КП',
                content: content,
                width: 1150
              }).catch(function (e) {
                log('openModal не сработал', e);
              });
            }
          });
        }

        return;
      } catch (error) {
        log('ошибка openPage', error);
      }
    }

    if (w.openModal) {
      try {
        w.openModal({
          title: 'Конструктор КП',
          content: content,
          width: 1150
        }).catch(function (error) {
          log('ошибка openModal', error);
        });

        return;
      } catch (error) {
        log('ошибка вызова openModal', error);
      }
    }

    /*
     * Последний резервный вариант.
     * Он сработает, если CRM не поддерживает openPage/openModal.
     */
    window.open(CTOR + '?embed=1&full=1', '_blank');
  }

  /*
   * Принимаем только событие кнопки сделки.
   */
  window.addEventListener('message', function (event) {
    var type = event.data && event.data.type;

    if (type !== 'kp-btn:click') {
      return;
    }

    log('получено событие kp-btn:click', event.data);

    /*
     * ВАЖНО: открываем сразу, без getDeal().
     */
    openConstructor();
  }, false);

  /*
   * Регистрируем только одну кнопку:
   * «Сформировать КП» в карточке сделки.
   */
  try {
    w.init({
      'deal-btn': function () {
        return [{
          title: 'Сформировать КП',
          styles: {
            color: '#fff',
            'background-color': '#2F6BFF'
          },
          icon: 'md-description',
          clickEventName: 'kp-btn:click',
          position: ['first'],
          name: 'kp-btn-1'
        }];
      }
    });

    log('одна кнопка зарегистрирована');
  } catch (error) {
    log('ошибка регистрации кнопки', error);
  }
})();
</script>

</body>
</html>
