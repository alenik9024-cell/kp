<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>КП — виджет</title>

<!-- Путь подключения библиотеки из документации EnvyCRM.
     Без этой строки window.EnvyCrmWidget отсутствует и init() не работает. -->
<script src="https://cdn.saas-support.com/crm_assets/build/widget/js/envycrmwidget.min.js"></script>

<style>
  body{margin:0;padding:12px;box-sizing:border-box;background:#fff;color:#2b2b2b;
       font:13px/1.5 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
  #kpBtn{display:block;width:100%;padding:13px 16px;border:0;border-radius:10px;
         background:#2F6BFF;color:#fff;font:600 14px/1 inherit;cursor:pointer}
  #kpBtn:hover{background:#1f57e0}
  #st{margin-top:10px;font-size:12px;line-height:1.6;color:#666}
  .ok{color:#0a7d33;font-weight:600} .err{color:#c0392b;font-weight:600}
</style>
</head>
<body>

<button id="kpBtn" type="button">📄 Сформировать КП</button>
<div id="st">запуск…</div>

<script>
(function () {
  'use strict';

  var CONSTRUCTOR_URL = 'https://alenik9024-cell.github.io/kp/kp-constructor.html';

  var st  = document.getElementById('st');
  var btn = document.getElementById('kpBtn');

  var dealId = '', clientId = '';
  var registered = false, libSeen = false;

  function log(m, d) { try { console.log('[KP v51] ' + m, d || ''); } catch (e) {} }
  function W() { return window.EnvyCrmWidget; }

  /* ---------- ID сделки: getDeal() из документации ---------- */
  function readIds() {
    return new Promise(function (res) {
      var w = W();
      if (!w || typeof w.getDeal !== 'function') { res(); return; }
      try {
        var r = w.getDeal();
        if (r && typeof r.then === 'function') {
          r.then(function (d) {
            d = d || {};
            dealId   = String(d.id || d.deal_id || dealId || '');
            clientId = String(d.client_id || d.clientId || clientId || '');
            log('getDeal', { deal_id: dealId, client_id: clientId });
            res();
          }).catch(function (e) { log('getDeal ошибка', e); res(); });
        } else res();
      } catch (e) { log('getDeal исключение', e); res(); }
    });
  }

  /* ---------- открытие конструктора ---------- */
  function fallback(content, url) {
    var w = W();
    try {
      if (w && typeof w.openModal === 'function') {
        w.openModal({ title: 'Коммерческое предложение', content: content, width: 1250 });
        return;
      }
    } catch (e) { log('openModal исключение', e); }
    window.open(url, '_blank');
  }

  function open() {
    readIds().then(function () {
      var url = CONSTRUCTOR_URL +
        (dealId   ? '?deal_id='   + encodeURIComponent(dealId)   : '?') +
        (clientId ? '&client_id=' + encodeURIComponent(clientId) : '');

      var content = '<iframe src="' + url +
        '" style="width:100%;height:80vh;border:0;display:block"></iframe>';

      log('открываю конструктор', url);

      var w = W();
      try {
        if (w && typeof w.openPage === 'function') {
          var r = w.openPage({ content: content });
          if (r && typeof r.catch === 'function') {
            r.catch(function (e) { log('openPage не сработал', e); fallback(content, url); });
          }
          return;
        }
      } catch (e) { log('openPage исключение', e); }

      fallback(content, url);
    });
  }

  btn.addEventListener('click', open);

  /* ---------- событие клика по кнопке в шапке ---------- */
  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'kp-btn:click') {
      log('кнопка нажата');
      open();
    }
  }, false);

  /* ---------- регистрация кнопки ---------- */
  function register() {
    var w = W();
    if (!w || typeof w.init !== 'function') return false;
    if (registered) return true;

    try {
      w.init({
        'deal-btn': function (params) {
          params = params || {};
          dealId   = String(params.dealID   || params.deal_id   || params.dealId   || dealId   || '');
          clientId = String(params.clientID || params.client_id || params.clientId || clientId || '');
          log('params', { deal_id: dealId, client_id: clientId });

          return [{
            title: 'Сформировать КП',
            styles: { color: '#fff', 'background-color': '#2F6BFF' },
            icon: 'md-description',
            clickEventName: 'kp-btn:click',
            position: ['first'],
            name: 'kp-btn'
          }];
        }
      });
      registered = true;
      log('кнопка зарегистрирована');
      return true;
    } catch (e) { log('ошибка init', e); return false; }
  }

  function show() {
    st.innerHTML =
      'Библиотека: <b class="' + (W() ? 'ok' : 'err') + '">' + (W() ? 'загружена' : 'ожидание…') + '</b><br>' +
      'Кнопка в шапке: <b>' + (registered ? 'зарегистрирована' : 'нет') + '</b><br>' +
      'Сделка: <b>' + (dealId || '—') + '</b> · Клиент: <b>' + (clientId || '—') + '</b>';
  }

  /* библиотека грузится с задержкой — ждём до 120 секунд, регистрируем при появлении */
  var tries = 0;
  var iv = setInterval(function () {
    tries++;
    if (W()) {
      if (!libSeen) { libSeen = true; log('библиотека появилась, попытка ' + tries); }
      register();
      if (registered) { readIds().then(show); clearInterval(iv); return; }
    }
    if (tries % 10 === 0) show();
    if (tries > 1200) { clearInterval(iv); log('библиотека не появилась за 120 с'); show(); }
  }, 100);

  setTimeout(show, 300);
  log('запуск', { lib: !!W() });
})();
</script>
</body>
</html>
